<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Add rooms — Homestead</title>
<meta name="theme-color" content="#FFFBF5">
<link rel="stylesheet" href="/modules.css">
</head>
<body>
<main id="app" aria-label="Add rooms">
  <header class="mods-head">
    <button class="mods-back" id="modsBack" type="button" aria-label="Back">‹</button>
    <h1 class="mods-title">Add rooms</h1>
    <p class="mods-sub">Turn on what you want on the home screen. You can always change it later.</p>
  </header>

  <section id="modsList" class="mods-list" aria-live="polite">
    <p class="mods-empty" id="modsEmpty">Loading…</p>
  </section>

  <footer class="mods-foot">
    <button class="mods-done" id="modsDone" type="button">Done</button>
  </footer>
</main>

<script src="/modules.js"></script>
</body>
</html>
