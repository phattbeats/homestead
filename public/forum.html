<!DOCTYPE html>
<html lang="en" data-skin="woodgrain">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Forum — Homestead</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#3e2610">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/forum/forum.css">
<!-- One markup, three skins. The skin stylesheet is written in during
     parsing so it blocks first paint: the localStorage mirror picks the
     right one before /api/me answers (no flash of the wrong skin), and
     forum.js swaps it if the server disagrees. -->
<script>
  (function () {
    var SKINS = ['woodgrain', 'classic', 'clubhouse'];
    var skin = 'woodgrain';
    try { var s = localStorage.getItem('homestead.forumSkin'); if (SKINS.indexOf(s) !== -1) skin = s; } catch (_) {}
    document.documentElement.setAttribute('data-skin', skin);
    document.write('<link id="forumSkin" rel="stylesheet" href="/forum/skin-' + skin + '.css">');
  })();
</script>
</head>
<body>
<div id="forum" class="fx-wrap" aria-busy="true"></div>
<script src="/forum/forum.js"></script>
</body>
</html>
