<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You're invited to Homestead</title>
<meta name="theme-color" content="#FFFBF5">
<link rel="manifest" href="/manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* PHA-2711: same-day closed-beta invite handshake.
   Public, no-auth page. Two clear choices — create a standalone
   Homestead account, or sign in with an existing local account — to
   claim the invite. The whole path completes without ever touching
   Authentik.

   Tokens mirror public/porch.css + welcome.html so the visual handoff
   to /welcome.html feels like the same app, not a different site. */
:root{
  --bg:#FFFBF5; --surface:#FFFFFF; --ink:#2B2622; --muted:#8A8177;
  --line:rgba(43,38,34,.07);
  --accent:#C4703C; --accent-soft:#F8E9DE;
  --danger:#B04A3C; --danger-soft:#F5DCD6;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font:inherit}

#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 32px) 22px 30px;min-height:100dvh;display:flex;flex-direction:column}
.heading{font-size:30px;font-weight:800;letter-spacing:-.025em;line-height:1.15;margin-bottom:6px}
.subheading{color:var(--muted);font-size:15px;line-height:1.45;margin-bottom:22px}

.intro{background:var(--surface);border-radius:22px;padding:18px 20px;margin-bottom:18px;box-shadow:0 6px 30px rgba(0,0,0,.035);font-size:14px;line-height:1.55;color:var(--ink)}
.intro strong{color:var(--ink)}
.intro em{color:var(--muted);font-style:normal}

.wall-card{background:var(--surface);border-radius:22px;padding:18px 20px;margin-bottom:18px;box-shadow:0 6px 30px rgba(0,0,0,.035)}
.wall-name{font-size:22px;font-weight:800;margin-bottom:4px}
.wall-meta{color:var(--muted);font-size:12px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:10px}
.inviter{font-size:13px;color:var(--ink);margin-bottom:8px}
.inviter b{font-weight:700}
.note{background:var(--accent-soft);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--ink);margin-top:10px;white-space:pre-wrap}

.choices{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.choice{background:var(--surface);border-radius:22px;padding:18px 20px;box-shadow:0 6px 30px rgba(0,0,0,.035);border:2px solid transparent;transition:border-color .2s var(--ease)}
.choice.open{border-color:var(--accent)}
.choice-title{font-size:17px;font-weight:800;margin-bottom:4px}
.choice-desc{color:var(--muted);font-size:13px;line-height:1.5;margin-bottom:14px}
.toggle{display:inline-block;font-size:13px;font-weight:600;color:var(--accent);padding:6px 0}
.toggle:active{opacity:.7}

.form{display:none;flex-direction:column;gap:12px;margin-top:6px}
.choice.open .form{display:flex}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.field input{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#FFFCF7;color:var(--ink);font-size:15px;outline:none;transition:border-color .2s var(--ease)}
.field input:focus{border-color:var(--accent)}
.field-hint{font-size:12px;color:var(--muted);margin-top:-2px}

.btn{display:block;width:100%;padding:14px 18px;border-radius:16px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;text-align:center;transition:transform .2s var(--ease),opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:default}
.btn.secondary{background:transparent;color:var(--accent);border:1px solid var(--accent)}

.error{background:var(--danger-soft);border-radius:14px;padding:10px 12px;color:var(--danger);font-size:13px;border:1px solid rgba(176,74,60,.15)}
.error:empty{display:none}

.status{padding:10px 0;color:var(--muted);font-size:13px;text-align:center}

.legal{font-size:11px;color:var(--muted);line-height:1.45;margin-top:14px}
</style>
</head>
<body>
<div id="app">
  <div id="content">
    <p class="status">Loading invite…</p>
  </div>
</div>

<script>
'use strict';

// PHA-2711: same-day closed-beta invite handshake.
//   1. Extract the code from the URL: /invite/{code}
//   2. GET /api/public/invites/:code — public peek (no auth).
//      - Renders Homestead intro + inviter + wall card.
//      - 410 expired / 410 exhausted / 410 revoked / 404 unknown → render error.
//   3. User picks ONE of two paths:
//        a. Create a standalone Homestead account (signup form)
//        b. Sign in with an existing local Homestead account (signin form)
//      Both POST to /api/public/invites/:code/{signup,signin}.
//   4. On success, the API also sets the session cookie. The SPA
//      redirects to result.redirect (/welcome.html?wall=<slug>).
//   5. Sign-out/sign-in persistence is tested in
//      scripts/test-2711-invite-signup.js — the cookie is the durable
//      artifact, the JS just bounces.

const content = document.getElementById('content');
let currentCode = null;

function el(tag, props = {}, children = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'style') Object.assign(e.style, v);
    else e.setAttribute(k, v);
  }
  for (const c of children) if (c) e.appendChild(c);
  return e;
}

function clear() { while (content.firstChild) content.removeChild(content.firstChild); }

function renderError(title, body) {
  return el('div', { class: 'error' }, [
    el('div', { style: { fontWeight: '700', marginBottom: '4px' }, text: title }),
    el('div', { text: body }),
  ]);
}

async function peekInvite(code) {
  const r = await fetch('/api/public/invites/' + encodeURIComponent(code), { credentials: 'same-origin' });
  if (r.status === 404) return { error: 'not_found' };
  if (r.status === 410) {
    const body = await r.json().catch(() => ({}));
    return { error: body.error || 'invalid', detail: body.detail };
  }
  if (!r.ok) return { error: 'unknown', status: r.status };
  return await r.json();
}

function renderInvite(data, code) {
  clear();
  // Homestead intro
  const intro = el('div', { class: 'intro' });
  intro.innerHTML = '<strong>Homestead</strong> is the private shared home for everyone in this circle. ' +
    'Accepting this invite adds you to <em>' + escapeHtml(data.wall_name) + '</em> — a private wall ' +
    'where members post, react, and keep in touch. You\'ll be able to see the feed, post to the wall, ' +
    'and use the rest of the app with your account.';
  content.appendChild(intro);

  // Wall card
  const card = el('div', { class: 'wall-card' });
  if (data.inviter && data.inviter.display) {
    card.appendChild(el('div', { class: 'inviter', html: 'Invited by <b>' + escapeHtml(data.inviter.display) + '</b>' }));
  }
  card.appendChild(el('div', { class: 'wall-name', text: data.wall_name }));
  card.appendChild(el('div', { class: 'wall-meta', text: '@' + data.wall_slug + ' · ' + data.remaining + ' ' + (data.remaining === 1 ? 'spot' : 'spots') + ' left' }));
  if (data.note) card.appendChild(el('div', { class: 'note', text: data.note }));
  content.appendChild(card);

  // Choices
  const choices = el('div', { class: 'choices' });
  choices.appendChild(buildSignupChoice(code, data));
  choices.appendChild(buildSigninChoice(code, data));
  content.appendChild(choices);

  // Legal / scope reminder
  content.appendChild(el('p', {
    class: 'legal',
    text: 'By accepting, you agree this wall is private to its members. Your account is local — no external sign-in is required to use Homestead.',
  }));
}

function buildSignupChoice(code, data) {
  const wrap = el('div', { class: 'choice' });
  wrap.appendChild(el('div', { class: 'choice-title', text: 'I\'m new — create my Homestead account' }));
  wrap.appendChild(el('div', { class: 'choice-desc', text: 'Pick a username, a display name, and a password. You\'ll land on the welcome screen.' }));

  const toggle = el('a', { class: 'toggle', text: 'Show form →' });
  const form = el('form', { class: 'form' });
  const errBox = el('div', { class: 'error' });
  form.appendChild(errBox);

  const fUser = field('Username', 'alice42', '2-32 chars · letters, numbers, _ or -');
  const fDisplay = field('Display name', 'Alice', 'How others will see you');
  const fPass = field('Password', '••••••••', 'At least 8 characters', 'password');
  form.appendChild(fUser.row); form.appendChild(fDisplay.row); form.appendChild(fPass.row);

  const submit = el('button', { type: 'submit', class: 'btn', text: 'Create account & join' });
  form.appendChild(submit);
  form.appendChild(el('div', { class: 'legal', text: 'After creating, you\'ll be signed in automatically and dropped into the welcome screen.' }));

  toggle.addEventListener('click', (e) => {
    e.preventDefault();
    wrap.classList.toggle('open');
    const isOpen = wrap.classList.contains('open');
    toggle.textContent = isOpen ? 'Hide form ↑' : 'Show form →';
    if (isOpen) fUser.input.focus();
  });

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    errBox.textContent = '';
    submit.disabled = true;
    submit.textContent = 'Creating account…';
    try {
      const r = await fetch('/api/public/invites/' + encodeURIComponent(code) + '/signup', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          username: fUser.input.value.trim(),
          display: fDisplay.input.value.trim(),
          password: fPass.input.value,
        }),
      });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) {
        errBox.textContent = '';
        errBox.appendChild(el('div', { style: { fontWeight: '700' }, text: friendlyError(r.status, body) }));
        submit.disabled = false;
        submit.textContent = 'Create account & join';
        return;
      }
      // Success — server set the session cookie. Bounce to welcome.
      location.replace(body.redirect || ('/welcome.html?wall=' + encodeURIComponent(body.wall_slug)));
    } catch (err) {
      errBox.textContent = '';
      errBox.appendChild(el('div', { text: 'Network error — check your connection and try again.' }));
      submit.disabled = false;
      submit.textContent = 'Create account & join';
    }
  });

  wrap.appendChild(toggle);
  wrap.appendChild(form);
  return wrap;
}

function buildSigninChoice(code, data) {
  const wrap = el('div', { class: 'choice' });
  wrap.appendChild(el('div', { class: 'choice-title', text: 'I already have a Homestead account' }));
  wrap.appendChild(el('div', { class: 'choice-desc', text: 'Sign in with your existing local username + password. You\'ll be added to ' + data.wall_name + ' on the way in.' }));

  const toggle = el('a', { class: 'toggle', text: 'Show form →' });
  const form = el('form', { class: 'form' });
  const errBox = el('div', { class: 'error' });
  form.appendChild(errBox);

  const fUser = field('Username', 'alice42', '');
  const fPass = field('Password', '••••••••', '', 'password');
  form.appendChild(fUser.row); form.appendChild(fPass.row);

  const submit = el('button', { type: 'submit', class: 'btn', text: 'Sign in & join' });
  form.appendChild(submit);
  form.appendChild(el('div', { class: 'legal', text: 'Your sign-in also claims this invite — the wall membership is added in the same request.' }));

  toggle.addEventListener('click', (e) => {
    e.preventDefault();
    wrap.classList.toggle('open');
    const isOpen = wrap.classList.contains('open');
    toggle.textContent = isOpen ? 'Hide form ↑' : 'Show form →';
    if (isOpen) fUser.input.focus();
  });

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    errBox.textContent = '';
    submit.disabled = true;
    submit.textContent = 'Signing in…';
    try {
      const r = await fetch('/api/public/invites/' + encodeURIComponent(code) + '/signin', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          username: fUser.input.value.trim(),
          password: fPass.input.value,
        }),
      });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) {
        errBox.textContent = '';
        errBox.appendChild(el('div', { style: { fontWeight: '700' }, text: friendlyError(r.status, body) }));
        submit.disabled = false;
        submit.textContent = 'Sign in & join';
        return;
      }
      location.replace(body.redirect || ('/welcome.html?wall=' + encodeURIComponent(body.wall_slug)));
    } catch (err) {
      errBox.textContent = '';
      errBox.appendChild(el('div', { text: 'Network error — check your connection and try again.' }));
      submit.disabled = false;
      submit.textContent = 'Sign in & join';
    }
  });

  wrap.appendChild(toggle);
  wrap.appendChild(form);
  return wrap;
}

function field(label, placeholder, hint, type = 'text') {
  const row = el('div', { class: 'field' });
  const lab = el('label', { text: label });
  const input = el('input', { type, placeholder, autocomplete: type === 'password' ? 'current-password' : 'username' });
  row.appendChild(lab);
  row.appendChild(input);
  if (hint) row.appendChild(el('div', { class: 'field-hint', text: hint }));
  return { row, input };
}

function friendlyError(status, body) {
  const code = body && body.error;
  if (status === 400 && code === 'invalid_username') return 'Username must be 2-32 characters (letters, numbers, underscore, or dash).';
  if (status === 400 && code === 'invalid_display') return 'Display name must be 1-64 characters.';
  if (status === 400 && code === 'weak_password') return 'Password must be at least 8 characters.';
  if (status === 409 && code === 'username_taken') return 'That username is taken. Try a different one.';
  if (status === 401) return 'Wrong username or password.';
  if (status === 410 && code === 'invite_expired') return 'This invite has expired.';
  if (status === 410 && code === 'invite_already_redeemed') return 'This invite has already been used up.';
  if (status === 410 && code === 'invite_revoked') return 'This invite was cancelled.';
  if (status === 404) return 'Server couldn\'t find that invite.';
  return 'Couldn\'t complete that. (' + (code || status) + ')';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function bootstrap() {
  const m = location.pathname.match(/^\/invite\/([A-Fa-f0-9]+)$/);
  if (!m) {
    clear();
    content.appendChild(el('h1', { class: 'heading', text: 'Invalid invite link' }));
    content.appendChild(el('p', { class: 'subheading', text: 'That URL doesn\'t look like a Homestead invite. Double-check the link you were sent.' }));
    return;
  }
  const code = m[1];
  currentCode = code;
  let data;
  try {
    data = await peekInvite(code);
  } catch (err) {
    clear();
    content.appendChild(renderError('Network error', 'Couldn\'t reach the server. Check your connection and try again.'));
    return;
  }
  if (data && data.error === 'not_found') {
    clear();
    content.appendChild(el('h1', { class: 'heading', text: 'Invite not found' }));
    content.appendChild(el('p', { class: 'subheading', text: 'This invite doesn\'t exist or has been deleted. Ask whoever sent it for a fresh link.' }));
    return;
  }
  if (data && (data.error === 'invite_expired' || data.error === 'invite_already_redeemed' || data.error === 'invite_revoked')) {
    clear();
    const heading = data.error === 'invite_expired' ? 'This invite has expired'
                  : data.error === 'invite_revoked' ? 'This invite was cancelled'
                  : 'This invite is no longer available';
    const body = data.error === 'invite_already_redeemed'
      ? 'All ' + (data.invite && data.invite.max_uses ? '' : '') + 'spots have been claimed. Ask whoever sent it for a new invite.'
      : 'Ask whoever sent it for a fresh link.';
    content.appendChild(el('h1', { class: 'heading', text: heading }));
    content.appendChild(el('p', { class: 'subheading', text: body }));
    return;
  }
  if (data && data.error) {
    clear();
    content.appendChild(renderError('Couldn\'t load invite', 'Server error: ' + (data.error || 'unknown') + '.'));
    return;
  }
  renderInvite(data, code);
}

bootstrap();
</script>
</body>
</html>
