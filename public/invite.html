<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You're invited to Homestead</title>
<meta name="theme-color" content="#FFFBF5">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/brand.css">
<style>
/* PHA-2835: branded invite landing.
 *
 * The /invite/:code surface is the first thing a new member sees. It
 * must feel like Homestead (PHA-2777 brand system), not an admin-looking
 * collection of cards. Layout: brand-hero → welcome headline → inviter
 * + wall card (sage-tinted) → primary CTA (hearth-orange) → secondary
 * CTA (sage outline) → small print. Forms collapse inline.
 *
 * Tokens pulled from /brand.css (PHA-2777). Body is Plus Jakarta Sans
 * (precached); the wordmark/hero come from /wordmark.svg and
 * /brand-hero.png (also precached — see public/sw.js).
 */
:root{
  --bg:#FFFBF5;
  --surface:#FFFFFF;
  --ink:#2B2622;
  --muted:#7a7269;
  --line:rgba(43,38,34,.07);
  --accent:#C4703C;
  --accent-soft:#F8E9DE;
  --sage:#6D7B59;
  --sage-soft:#EEF1E8;
  --sage-deep:#4b4624;
  --danger:#B04A3C;
  --danger-soft:#F5DCD6;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  background:var(--bg);color:var(--ink);
  min-height:100dvh;
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font:inherit}

#app{
  max-width:560px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 28px) 22px 30px;
  min-height:100dvh;
  display:flex;flex-direction:column;
}

/* ── Brand hero ──────────────────────────────────────────────────────── */
.hero-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:22px;text-align:center}
.hero-wrap .brand-hero{display:block;width:auto;height:88px;margin:0 auto 10px}
.hero-wrap .brand-tagline{
  font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:400;
  font-size:13px;line-height:1.45;color:var(--muted);
  letter-spacing:.005em;
}
@media (min-width:600px){
  .hero-wrap .brand-hero{height:128px}
}

/* ── Welcome headline ────────────────────────────────────────────────── */
.heading{
  font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.18;
  margin-bottom:8px;text-align:center;
}
.subheading{
  color:var(--muted);font-size:15px;line-height:1.5;
  margin-bottom:22px;text-align:center;
}
.subheading b{color:var(--ink);font-weight:700}

/* ── Wall card (sage-tinted, was white card) ────────────────────────── */
.wall-card{
  background:var(--sage-soft);
  border:1px solid rgba(109,123,89,.18);
  border-radius:18px;
  padding:16px 18px;margin-bottom:20px;
  display:flex;align-items:center;gap:14px;
}
.wall-icon{
  flex:none;width:42px;height:42px;border-radius:12px;
  background:var(--sage);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:700;letter-spacing:-.02em;
}
.wall-text{flex:1;min-width:0}
.wall-name{font-size:16px;font-weight:800;line-height:1.25;margin-bottom:2px}
.wall-meta{color:var(--muted);font-size:12px;letter-spacing:.04em}
.wall-spots{color:var(--sage-deep);font-size:12px;font-weight:600;margin-top:4px}

/* Personal note from inviter — only rendered when server scrubber
 * approves it AND it looks human-facing. */
.note{
  background:var(--accent-soft);
  border-radius:14px;
  padding:12px 14px;font-size:14px;line-height:1.5;color:var(--ink);
  margin-bottom:20px;
  font-style:italic;
  position:relative;
}
.note::before{
  content:'"';position:absolute;left:8px;top:-2px;
  font-family:'Fraunces',Georgia,serif;font-size:32px;color:var(--accent);line-height:1;
}
.note-inner{display:block;padding-left:18px}
.note-attr{
  display:block;margin-top:6px;padding-left:18px;
  font-size:11px;color:var(--muted);font-style:normal;
  letter-spacing:.04em;text-transform:uppercase;
}

/* ── Choices — primary + secondary ───────────────────────────────────── */
.choices{display:flex;flex-direction:column;gap:12px;margin-top:8px}

/* Primary CTA: warm hearth fill, prominent */
.choice.primary{
  background:var(--accent);color:#fff;
  border-radius:18px;padding:18px 20px;
  text-align:left;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  cursor:pointer;
  transition:transform .15s var(--ease),box-shadow .15s var(--ease);
  box-shadow:0 4px 16px rgba(196,112,60,.18);
}
.choice.primary:active{transform:scale(.985)}
.choice.primary .choice-text{flex:1}
.choice.primary .choice-title{font-size:16px;font-weight:800;line-height:1.25;margin-bottom:3px}
.choice.primary .choice-desc{font-size:13px;line-height:1.4;opacity:.92}
.choice.primary .choice-arrow{font-size:22px;line-height:1;flex:none;font-weight:700}

/* Secondary CTA: sage outline, restrained */
.choice.secondary{
  background:transparent;color:var(--sage-deep);
  border-radius:18px;padding:16px 20px;
  border:1.5px solid rgba(109,123,89,.35);
  text-align:left;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  cursor:pointer;
  transition:background .15s var(--ease),border-color .15s var(--ease);
}
.choice.secondary:hover{background:var(--sage-soft);border-color:var(--sage)}
.choice.secondary .choice-text{flex:1}
.choice.secondary .choice-title{font-size:15px;font-weight:700;line-height:1.25;margin-bottom:2px}
.choice.secondary .choice-desc{font-size:12px;color:var(--muted);line-height:1.4}
.choice.secondary .choice-arrow{font-size:18px;line-height:1;flex:none;font-weight:700;color:var(--sage)}

/* Inline form (revealed when a choice is tapped). The wrap itself
 * stays rendered (form takes its place) — the .expanded class on
 * the wrap hides the CTA children and shows the .form child. */
.form{
  display:none;flex-direction:column;gap:12px;
  margin-top:6px;padding:18px 0 4px;
  animation: form-in .25s var(--ease);
}
.choice.primary.expanded .ctas{display:none}
.choice.secondary.expanded .ctas{display:none}
.choice.primary.expanded .form{display:flex}
.choice.secondary.expanded .form{display:flex}
.choice.primary.expanded{background:var(--surface);color:var(--ink);box-shadow:0 6px 24px rgba(0,0,0,.06)}
@keyframes form-in{
  from{opacity:0;transform:translateY(-4px)}
  to{opacity:1;transform:none}
}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.field input{
  width:100%;padding:13px 14px;border-radius:14px;
  border:1px solid var(--line);background:#FFFCF7;color:var(--ink);
  font-size:15px;outline:none;transition:border-color .2s var(--ease);
}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(196,112,60,.18)}
.field-hint{font-size:12px;color:var(--muted);margin-top:-2px}

.btn{
  display:block;width:100%;padding:14px 18px;border-radius:14px;
  background:var(--accent);color:#fff;font-weight:700;font-size:15px;
  text-align:center;transition:transform .15s var(--ease),opacity .15s;
}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.5;cursor:default}
.btn.secondary-btn{
  background:transparent;color:var(--sage-deep);
  border:1px solid rgba(109,123,89,.4);font-weight:600;
}

.error{
  background:var(--danger-soft);border-radius:12px;
  padding:10px 12px;color:var(--danger);font-size:13px;
  border:1px solid rgba(176,74,60,.15);
}
.error:empty{display:none}

.status{padding:14px 0;color:var(--muted);font-size:13px;text-align:center}

.legal{font-size:11px;color:var(--muted);line-height:1.5;margin-top:14px;text-align:center}
</style>
</head>
<body>
<div id="app">
  <div id="content" aria-live="polite">
    <p class="status">Loading invite…</p>
  </div>
</div>

<script>
'use strict';

// PHA-2835: branded invite landing.
//   1. Extract the code from the URL: /invite/{code}
//   2. GET /api/public/invites/:code — public peek (no auth).
//      Server now scrubs operational metadata (PHA-####/wave/reissue)
//      out of `note` before exposing it. The browser applies a
//      defense-in-depth scrub (sanitizeNote) before any render.
//   3. User picks ONE of two paths:
//        a. Create a standalone Homestead account (signup form)
//        b. Sign in with an existing local Homestead account (signin form)
//      Both POST to /api/public/invites/:code/{signup,signin}.
//   4. On success, the API also sets the session cookie. The SPA
//      redirects to result.redirect (/welcome.html?wall=<slug>).
//   5. Sign-out/sign-in persistence is tested in
//      scripts/test-2711-invite-signup.js — the cookie is the durable
//      artifact, the JS just bounces.

const content = document.getElementById('content');
let currentCode = null;

function el(tag, props = {}, children = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'style') Object.assign(e.style, v);
    else e.setAttribute(k, v);
  }
  for (const c of children) if (c) e.appendChild(c);
  return e;
}

function clear() { while (content.firstChild) content.removeChild(content.firstChild); }

function renderError(title, body) {
  return el('div', { class: 'error' }, [
    el('div', { style: { fontWeight: '700', marginBottom: '4px' }, text: title }),
    el('div', { text: body }),
  ]);
}

async function peekInvite(code) {
  const r = await fetch('/api/public/invites/' + encodeURIComponent(code), { credentials: 'same-origin' });
  if (r.status === 404) return { error: 'not_found' };
  if (r.status === 410) {
    const body = await r.json().catch(() => ({}));
    return { error: body.error || 'invalid', detail: body.detail };
  }
  if (!r.ok) return { error: 'unknown', status: r.status };
  return await r.json();
}

/* sanitizeNote — defense-in-depth pass that complements the server-side
 * scrub. Strips patterns the server may have missed (e.g. legacy notes
 * pre-dating the scrubber, or admin edits that bypassed the gate).
 * Returns null if the note still looks operational after scrubbing,
 * which suppresses the render entirely rather than risk leaking
 * internal metadata to a fresh invitee. */
const NOTE_BAD_PATTERNS = [
  /\bPHA-\d{2,}\b/i,        // ticket IDs (PHA-#### / PHA-####.#)
  /\b(beta\s*wave)\b/i,
  /\b(reissued?|re-issued?)\b/i,
  /\b(wiped?|reset|wipe)\b/i,
  /\b(admin|owner)\s+(note|reset|recovery)\b/i,
  /\b(internal|staff|ops)\b/i,
];
function sanitizeNote(note, inviterDisplay) {
  if (!note || typeof note !== 'string') return null;
  const trimmed = note.trim();
  if (trimmed.length === 0 || trimmed.length > 280) return null;
  let scrubbed = trimmed;
  for (const re of NOTE_BAD_PATTERNS) scrubbed = scrubbed.replace(re, '');
  scrubbed = scrubbed.replace(/\s{2,}/g, ' ').trim();
  if (scrubbed.length === 0) return null;
  // If the scrubber stripped more than 60% of the original, the note
  // was almost certainly operational copy with a thin human wrapper.
  // Drop it rather than risk leaking the wrapper (e.g. "PHA-2664
  // beta wave reissued after PHA-2728 wipe" → empty after the
  // pattern pass).
  if (scrubbed.length / trimmed.length < 0.4) return null;
  return { text: scrubbed, attributedTo: inviterDisplay || null };
}

function renderInvite(data, code) {
  clear();

  // Brand hero (carved-wood wordmark + sage doorway painterly mark)
  const hero = el('div', { class: 'hero-wrap' });
  hero.appendChild(el('img', {
    class: 'brand-hero',
    src: '/brand-hero.png',
    alt: 'Homestead',
  }));
  hero.appendChild(el('div', {
    class: 'brand-tagline',
    text: 'A private home for the people in your circle.',
  }));
  content.appendChild(hero);

  // Welcome headline — the page now leads with welcome, not with a
  // technical "Loading invite…" then content-stacked status. This is
  // the first thing an invitee sees.
  const headline = el('h1', { class: 'heading', text: "You're invited." });
  content.appendChild(headline);

  // Subheading: inviter (if any) + wall name. Both wrapped in <b> for
  // visual weight; muted color carries the sentence.
  const subParts = [];
  if (data.inviter && data.inviter.display) {
    subParts.push('<b>' + escapeHtml(data.inviter.display) + '</b> invited you to join');
  } else {
    subParts.push('You\'ve been invited to join');
  }
  subParts.push('<b>' + escapeHtml(data.wall_name) + '</b>.');
  content.appendChild(el('p', {
    class: 'subheading',
    html: subParts.join(' '),
  }));

  // Wall card (sage-tinted)
  const card = el('div', { class: 'wall-card' });
  card.appendChild(el('div', { class: 'wall-icon', text: (data.wall_name || '?').slice(0, 1).toUpperCase() }));
  const wtext = el('div', { class: 'wall-text' });
  wtext.appendChild(el('div', { class: 'wall-name', text: data.wall_name }));
  wtext.appendChild(el('div', { class: 'wall-meta', text: '@' + data.wall_slug }));
  wtext.appendChild(el('div', { class: 'wall-spots', text: data.remaining + ' ' + (data.remaining === 1 ? 'spot' : 'spots') + ' left' }));
  card.appendChild(wtext);
  content.appendChild(card);

  // Personal note from inviter — render only if it passes the
  // defense-in-depth scrub. Server-side scrub (PHA-2835) already
  // drops operational metadata; this is the second gate.
  const note = sanitizeNote(data.note, data.inviter && data.inviter.display);
  if (note) {
    const nbox = el('div', { class: 'note' });
    nbox.appendChild(el('span', { class: 'note-inner', text: note.text }));
    if (note.attributedTo) {
      nbox.appendChild(el('span', { class: 'note-attr', text: '— ' + note.attributedTo }));
    }
    content.appendChild(nbox);
  }

  // Choices — primary CTA (create) + secondary CTA (sign in). Forms
  // collapse inline when the CTA is tapped.
  const choices = el('div', { class: 'choices' });
  choices.appendChild(buildSignupChoice(code, data));
  choices.appendChild(buildSigninChoice(code, data));
  content.appendChild(choices);

  // Legal / scope reminder — same privacy line as the prior version.
  content.appendChild(el('p', {
    class: 'legal',
    text: 'Homestead is private to the people in this circle. Your account stays local — no external sign-in is needed to use it.',
  }));
}

function buildSignupChoice(code, data) {
  const wrap = el('div', { class: 'choice primary', role: 'button', tabindex: '0' });

  // CTA children — hidden when .expanded class is added.
  const ctas = el('div', { class: 'ctas' });
  ctas.appendChild(el('div', { class: 'choice-text' }, [
    el('div', { class: 'choice-title', text: "I'm new — create my account" }),
    el('div', { class: 'choice-desc', text: "Pick a username, a display name, and a password. We'll set everything up for you." }),
  ]));
  ctas.appendChild(el('div', { class: 'choice-arrow', text: '→' }));
  wrap.appendChild(ctas);

  const form = el('form', { class: 'form' });
  const errBox = el('div', { class: 'error' });
  form.appendChild(errBox);

  const fUser = field('Username', 'alice42', '2-32 chars · letters, numbers, _ or -');
  const fDisplay = field('Display name', 'Alice', 'How others will see you');
  const fPass = field('Password', '••••••••', 'At least 8 characters', 'password');
  form.appendChild(fUser.row); form.appendChild(fDisplay.row); form.appendChild(fPass.row);

  const submit = el('button', { type: 'submit', class: 'btn', text: 'Create account & join' });
  form.appendChild(submit);
  form.appendChild(el('div', { class: 'legal', text: 'You\'ll be signed in automatically and dropped into the welcome screen.' }));

  const activate = (e) => {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    wrap.classList.add('expanded');
    setTimeout(() => fUser.input.focus(), 80);
  };
  ctas.addEventListener('click', activate);
  ctas.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') activate(e);
  });
  // The wrap itself stays focusable as a tap target.
  wrap.setAttribute('aria-expanded', 'false');
  ctas._parent = wrap;

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    errBox.textContent = '';
    submit.disabled = true;
    submit.textContent = 'Creating account…';
    try {
      const r = await fetch('/api/public/invites/' + encodeURIComponent(code) + '/signup', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          username: fUser.input.value.trim(),
          display: fDisplay.input.value.trim(),
          password: fPass.input.value,
        }),
      });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) {
        errBox.textContent = '';
        errBox.appendChild(el('div', { style: { fontWeight: '700' }, text: friendlyError(r.status, body) }));
        submit.disabled = false;
        submit.textContent = 'Create account & join';
        return;
      }
      location.replace(body.redirect || ('/welcome.html?wall=' + encodeURIComponent(body.wall_slug)));
    } catch (err) {
      errBox.textContent = '';
      errBox.appendChild(el('div', { text: 'Network error — check your connection and try again.' }));
      submit.disabled = false;
      submit.textContent = 'Create account & join';
    }
  });

  wrap.appendChild(form);
  return wrap;
}

function buildSigninChoice(code, data) {
  const wrap = el('div', { class: 'choice secondary', role: 'button', tabindex: '0' });

  const ctas = el('div', { class: 'ctas' });
  ctas.appendChild(el('div', { class: 'choice-text' }, [
    el('div', { class: 'choice-title', text: 'Already have a Homestead account?' }),
    el('div', { class: 'choice-desc', text: 'Sign in to attach this wall to your existing one.' }),
  ]));
  ctas.appendChild(el('div', { class: 'choice-arrow', text: '→' }));
  wrap.appendChild(ctas);

  const form = el('form', { class: 'form' });
  const errBox = el('div', { class: 'error' });
  form.appendChild(errBox);

  const fUser = field('Username', 'alice42', '');
  const fPass = field('Password', '••••••••', '', 'password');
  form.appendChild(fUser.row); form.appendChild(fPass.row);

  const submit = el('button', { type: 'submit', class: 'btn', text: 'Sign in & join' });
  form.appendChild(submit);
  form.appendChild(el('div', { class: 'legal', text: 'Your sign-in also claims this invite — the wall membership is added in the same request.' }));

  const activate = (e) => {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    wrap.classList.add('expanded');
    setTimeout(() => fUser.input.focus(), 80);
  };
  ctas.addEventListener('click', activate);
  ctas.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') activate(e);
  });

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    errBox.textContent = '';
    submit.disabled = true;
    submit.textContent = 'Signing in…';
    try {
      const r = await fetch('/api/public/invites/' + encodeURIComponent(code) + '/signin', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          username: fUser.input.value.trim(),
          password: fPass.input.value,
        }),
      });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) {
        errBox.textContent = '';
        errBox.appendChild(el('div', { style: { fontWeight: '700' }, text: friendlyError(r.status, body) }));
        submit.disabled = false;
        submit.textContent = 'Sign in & join';
        return;
      }
      location.replace(body.redirect || ('/welcome.html?wall=' + encodeURIComponent(body.wall_slug)));
    } catch (err) {
      errBox.textContent = '';
      errBox.appendChild(el('div', { text: 'Network error — check your connection and try again.' }));
      submit.disabled = false;
      submit.textContent = 'Sign in & join';
    }
  });

  wrap.appendChild(form);
  return wrap;
}

function field(label, placeholder, hint, type = 'text') {
  const row = el('div', { class: 'field' });
  const lab = el('label', { text: label });
  const input = el('input', { type, placeholder, autocomplete: type === 'password' ? 'current-password' : 'username' });
  row.appendChild(lab);
  row.appendChild(input);
  if (hint) row.appendChild(el('div', { class: 'field-hint', text: hint }));
  return { row, input };
}

function friendlyError(status, body) {
  const code = body && body.error;
  if (status === 400 && code === 'invalid_username') return 'Username must be 2-32 characters (letters, numbers, underscore, or dash).';
  if (status === 400 && code === 'invalid_display') return 'Display name must be 1-64 characters.';
  if (status === 400 && code === 'weak_password') return 'Password must be at least 8 characters.';
  if (status === 409 && code === 'username_taken') return 'That username is taken. Try a different one.';
  if (status === 401) return 'Wrong username or password.';
  if (status === 410 && code === 'invite_expired') return 'This invite has expired.';
  if (status === 410 && code === 'invite_already_redeemed') return 'This invite has already been used up.';
  if (status === 410 && code === 'invite_revoked') return 'This invite was cancelled.';
  if (status === 404) return 'Server couldn\'t find that invite.';
  return 'Couldn\'t complete that. (' + (code || status) + ')';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function bootstrap() {
  const m = location.pathname.match(/^\/invite\/([A-Fa-f0-9]+)$/);
  if (!m) {
    clear();
    content.appendChild(el('div', { class: 'hero-wrap' }, [
      el('img', { class: 'brand-hero', src: '/brand-hero.png', alt: 'Homestead' }),
    ]));
    content.appendChild(el('h1', { class: 'heading', text: 'Invalid invite link' }));
    content.appendChild(el('p', {
      class: 'subheading',
      text: "That URL doesn't look like a Homestead invite. Double-check the link you were sent.",
    }));
    return;
  }
  const code = m[1];
  currentCode = code;
  let data;
  try {
    data = await peekInvite(code);
  } catch (err) {
    clear();
    content.appendChild(renderError('Network error', "Couldn't reach the server. Check your connection and try again."));
    return;
  }
  if (data && data.error === 'not_found') {
    clear();
    content.appendChild(el('div', { class: 'hero-wrap' }, [
      el('img', { class: 'brand-hero', src: '/brand-hero.png', alt: 'Homestead' }),
    ]));
    content.appendChild(el('h1', { class: 'heading', text: 'Invite not found' }));
    content.appendChild(el('p', {
      class: 'subheading',
      text: "This invite doesn't exist or has been deleted. Ask whoever sent it for a fresh link.",
    }));
    return;
  }
  if (data && (data.error === 'invite_expired' || data.error === 'invite_already_redeemed' || data.error === 'invite_revoked')) {
    clear();
    content.appendChild(el('div', { class: 'hero-wrap' }, [
      el('img', { class: 'brand-hero', src: '/brand-hero.png', alt: 'Homestead' }),
    ]));
    const heading = data.error === 'invite_expired' ? 'This invite has expired'
                  : data.error === 'invite_revoked' ? 'This invite was cancelled'
                  : 'This invite is no longer available';
    const body = data.error === 'invite_already_redeemed'
      ? 'All spots have been claimed. Ask whoever sent it for a new invite.'
      : 'Ask whoever sent it for a fresh link.';
    content.appendChild(el('h1', { class: 'heading', text: heading }));
    content.appendChild(el('p', { class: 'subheading', text: body }));
    return;
  }
  if (data && data.error) {
    clear();
    content.appendChild(renderError("Couldn't load invite", 'Server error: ' + (data.error || 'unknown') + '.'));
    return;
  }
  renderInvite(data, code);
}

bootstrap();
</script>
</body>
</html>
