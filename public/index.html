/* ---- settings sheet (admin) ---- */
function openSettingsSheet(){
  if(!ME||!ME.isAdmin){
    // Non-admin: only password change (already on avatar sheet)
    return;
  }
  const users=Object.values(USERS).sort((a,b)=>{
    if((b.isAdmin?1:0)!==(a.isAdmin?1:0))return(b.isAdmin?1:0)-(a.isAdmin?1:0);
    return a.username.localeCompare(b.username);
  });
  const listHtml=users.map(u=>`
    <div class="user-row" data-u="${esc(u.username)}" style="--uc:${esc(u.color)}">
      <div class="ucolor">${esc((u.display||u.username)[0].toUpperCase())}</div>
      <div class="uinfo">
        <div class="udisp">${esc(u.display)}${u.isAdmin?' <span class="badge">admin</span>':''}</div>
        <div class="uuname">@${esc(u.username)}</div>
      </div>
      <div class="uactions">
        <button class="link" data-act="edit">Edit</button>
        ${u.username===ME.username?'':`<button class="link danger" data-act="del">Delete</button>`}
      </div>
    </div>`).join('');

  openSheet(`<h2>Settings</h2>
    <h3>Household members</h3>
    <div class="user-list">${listHtml||'<div class="empty">No users yet</div>'}</div>
    <h3>Add user</h3>
    <input class="field" id="f-newuser" placeholder="Username (a-z, 0-9, _, -)" autocapitalize="none" autocorrect="off" spellcheck="false">
    <input class="field" id="f-newdisplay" placeholder="Display name">
    <div class="row"><input class="field" type="password" id="f-newpass" placeholder="Password (4+ chars)" style="flex:2">
    <input class="field" type="color" id="f-newcolor" value="#7c9a72" style="flex:1;padding:6px"></div>
    <button class="btn" id="f-add">+ Add user</button>
    <div class="err" id="f-err"></div>
    <button class="link" style="margin-top:18px;width:100%;text-align:center" onclick="closeSheet()">Done</button>`);

  document.querySelectorAll('.user-row').forEach(row=>{
    const username=row.dataset.u;
    const editBtn=row.querySelector('[data-act="edit"]');
    if(editBtn)editBtn.onclick=()=>openUserEditSheet(username);
    const delBtn=row.querySelector('[data-act="del"]');
    if(delBtn)delBtn.onclick=async()=>{
      if(!confirm(`Delete @${username}? Tasks and events assigned to them will be reassigned to Everyone.`))return;
      try{
        await api('DELETE',`/api/users/${username}`);
        await refreshUsersFromServer();
        await refresh();
        openSettingsSheet();
      }catch(e){alert((e&&e.error)||'Failed')}
    };
  });

  $('#f-add').onclick=async()=>{
    const body={
      username:$('#f-newuser').value,
      display:$('#f-newdisplay').value,
      password:$('#f-newpass').value,
      color:$('#f-newcolor').value
    };
    try{
      await api('POST','/api/users',body);
      await refreshUsersFromServer();
      await refresh();
      renderLoginChips();
      openSettingsSheet();
    }catch(e){$('#f-err').textContent=(e&&e.error)||'Failed'}
  };
}

// ---- PHA-2556: walls admin sheet ----
// Renders a list of every wall in the system (visibility, members),
// a "Create wall" form, and an inline member-management UI per wall.
// Lives in its own sheet so the household-members form above doesn't
// grow into a kitchen-sink. Reach it from the avatar menu via
// "Walls · manage walls" (admin-only).
async function openWallsAdminSheet(){
  if(!ME||!ME.isAdmin)return;
  let wallsList=[];
  let groupsList=[];
  let errMsg='';
  try{
    [wallsList, groupsList] = await Promise.all([
      api('GET','/api/walls/all'),
      api('GET','/api/groups'),
    ]);
  }catch(e){errMsg=(e&&e.error)||'Failed to load walls';}

  const wallsHtml=(wallsList||[]).map(w=>`
    <div class="wall-row" data-slug="${esc(w.slug)}" style="border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
        <div>
          <div style="font-weight:600">${esc(w.name)}</div>
          <div style="font-size:12px;color:var(--muted)">/${esc(w.slug)} · ${esc(w.visibility)}${w.group_name? ' · group='+esc(w.group_name):''}</div>
        </div>
      </div>
      <div class="wall-members" data-slug="${esc(w.slug)}" style="margin-top:8px;font-size:13px"></div>
      <div style="display:flex;gap:6px;margin-top:8px">
        <input class="field" data-add="${esc(w.slug)}" placeholder="Add user (username)" style="flex:1">
        <button class="btn btn-secondary" data-add-btn="${esc(w.slug)}">Add</button>
      </div>
    </div>
  `).join('') || '<div class="empty">No walls yet</div>';

  const groupOptions=(groupsList&&groupsList.groups||[])
    .map(g=>`<option value="${esc(g.name)}">${esc(g.display_name||g.name)}</option>`).join('');

  openSheet(`<h2>Walls · manage walls</h2>
    <h3>Existing walls</h3>
    <div id="walls-list">${wallsHtml}</div>
    <h3 style="margin-top:18px">Create wall</h3>
    <input class="field" id="w-slug" placeholder="Slug (a-z, 0-9, dashes)" autocapitalize="none" autocorrect="off" spellcheck="false">
    <input class="field" id="w-name" placeholder="Display name">
    <select class="field" id="w-visibility">
      <option value="group">Group-scoped (visibility follows a group)</option>
      <option value="direct">Direct (only invited users)</option>
    </select>
    <select class="field" id="w-group" style="display:none">
      <option value="">— pick a group —</option>
      ${groupOptions}
    </select>
    <div class="err" id="w-err"></div>
    <button class="btn" id="w-create">+ Create wall</button>
    <button class="link" style="margin-top:18px;width:100%;text-align:center" onclick="openSettingsSheet()">← Back to settings</button>
    ${errMsg?`<div class="err" style="margin-top:8px">${esc(errMsg)}</div>`:''}`);

  // Show/hide the group picker when visibility flips.
  $('#w-visibility').onchange=()=>{
    $('#w-group').style.display=$('#w-visibility').value==='group'?'block':'none';
  };

  // Member rows: render then wire add/remove. async-IIFE because we
  // want each wall's member list fetched independently and the rows
  // to render as they arrive (small N here — there's at most a couple
  // of walls in the typical install).
  for(const w of (wallsList||[])){
    try{
      const m=await api('GET',`/api/walls/${encodeURIComponent(w.slug)}/members`);
      const host=document.querySelector(`.wall-members[data-slug="${w.slug}"]`);
      if(!host)continue;
      const membersHtml=(m.members||[]).map(u=>`
        <span style="display:inline-flex;align-items:center;gap:4px;background:var(--chip);border-radius:999px;padding:2px 8px;margin:2px 4px 2px 0">
          <span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${esc(u.color)}"></span>
          @${esc(u.username)}${u.role==='admin'?' · admin':''}
          <button class="link" style="padding:0 0 0 4px;color:var(--muted)" data-rm="${esc(w.slug)}:${esc(u.username)}" title="Remove">×</button>
        </span>
      `).join('') || '<span style="color:var(--muted)">No members yet</span>';
      host.innerHTML=membersHtml;
      host.querySelectorAll('[data-rm]').forEach(btn=>{
        btn.onclick=async()=>{
          const[slug,username]=btn.dataset.rm.split(':');
          if(!confirm(`Remove @${username} from ${slug}?`))return;
          try{
            await api('DELETE',`/api/walls/${encodeURIComponent(slug)}/members/${encodeURIComponent(username)}`);
            await openWallsAdminSheet();
          }catch(e){alert((e&&e.error)||'Failed');}
        };
      });
    }catch(_){/* wall exists but caller isn't a member (404-private) — skip member list */}
  }

  // Wire "Add" buttons (one per existing wall).
  document.querySelectorAll('[data-add-btn]').forEach(btn=>{
    btn.onclick=async()=>{
      const slug=btn.dataset.addBtn;
      const inp=document.querySelector(`[data-add="${slug}"]`);
      const username=(inp&&inp.value||'').trim();
      if(!username){alert('Username required');return;}
      try{
        await api('POST',`/api/walls/${encodeURIComponent(slug)}/members`,{username});
        inp.value='';
        await openWallsAdminSheet();
      }catch(e){alert((e&&e.error||'')+(e&&e.message?': '+e.message:''))||'Failed';}
    };
  });

  // Create wall submit.
  $('#w-create').onclick=async()=>{
    const body={
      slug:$('#w-slug').value.trim(),
      name:$('#w-name').value.trim(),
      visibility:$('#w-visibility').value,
    };
    if(body.visibility==='group')body.group_name=$('#w-group').value;
    if(!body.slug||!body.name){$('#w-err').textContent='Slug and name required';return;}
    if(body.visibility==='group'&&!body.group_name){$('#w-err').textContent='Pick a group for group-scoped walls';return;}
    try{
      await api('POST','/api/walls',body);
      await openWallsAdminSheet();
    }catch(e){
      $('#w-err').textContent=(e&&e.error&&e.message?e.message:(e&&e.error))||'Failed';
    }
  };
}

function openUserEditSheet(username){
  const u=USERS[username];
  if(!u)return;
  const isSelf=ME&&ME.username===username;
  openSheet(`<h2>${isSelf?'Your account':'Edit @'+esc(username)}</h2>
    <h3>Display</h3>
    <input class="field" id="f-display" placeholder="Display name" value="${esc(u.display)}">
    <div class="row"><div><label>Color</label><input class="field" type="color" id="f-color" value="${esc(u.color)}"></div></div>
    <button class="btn" id="f-save" style="margin-top:6px">Save changes</button>
    <h3>Password</h3>
    ${isSelf?`<input class="field" type="password" id="f-curpw" placeholder="Current password" autocomplete="current-password">`:''}
    <input class="field" type="password" id="f-newp" placeholder="New password" autocomplete="new-password">
    <button class="link" id="f-resetpw" style="margin-top:10px;width:100%;text-align:center">
      ${isSelf?'Change my password':'Reset password (admin override)'}
    </button>
    <div class="err" id="f-err"></div>
    <button class="link" style="margin-top:14px;width:100%;text-align:center" onclick="openSettingsSheet()">← Back to settings</button>`);

  $('#f-save').onclick=async()=>{
    try{
      await api('PUT',`/api/users/${username}`,{display:$('#f-display').value,color:$('#f-color').value});
      await refreshUsersFromServer();
      await refresh();
      renderLoginChips();
      openUserEditSheet(username);
    }catch(e){$('#f-err').textContent=(e&&e.error)||'Failed'}
  };
  $('#f-resetpw').onclick=async()=>{
    const next=$('#f-newp').value;
    if(!next||next.length<4){$('#f-err').textContent='Password must be 4+ characters';return}
    try{
      const body={next};
      if(isSelf){
        const cur=$('#f-curpw')?.value||'';
        if(!cur){$('#f-err').textContent='Current password required';return}
        body.current=cur;
      }
      await api('POST',`/api/users/${username}/password`,body);
      $('#f-newp').value='';
      if(isSelf)$('#f-curpw').value='';
      $('#f-err').style.color='#2B2622';
      $('#f-err').textContent='Password updated';
      setTimeout(()=>{$('#f-err').textContent='';$('#f-err').style.color=''},1500);
    }catch(e){$('#f-err').textContent=(e&&e.error)||'Failed'}
  };
}

/* ---- PHA-1868: per-user calendar source config UI ----
// The sheet is reachable from the avatar menu. Every authenticated
// user can manage their own per-user sources; admins additionally see
// shared sources and can edit/delete them. POST /api/calendar-sources
// is the only path that takes credentials — this sheet is the
// source-config counterpart to lib/calendar-sources.js. The DTO
// (publicView) is the single source of truth for what the client sees;
// no cred_blob ever crosses the network here.
*/
async function openCalendarSourcesSheet(){
  const [sources, kindsRes] = await Promise.all([
    api('GET','/api/calendar-sources'),
    api('GET','/api/calendar-sources/kinds'),
  ]);
  openCalendarSourcesSheetWith(sources, kindsRes.kinds || []);
}

function openCalendarSourcesSheetWith(sources, kinds){
  const myId = ME ? ME.id : null;
  const myAdmin = !!(ME && ME.isAdmin);
  const sourceRows = sources.map(s => {
    const owned = s.user_id == null ? myAdmin : (s.user_id === myId || myAdmin);
    const kind = kinds.find(k => k.id === s.provider) || { label: s.provider };
    const errChip = s.last_error ? `<span class="pill" style="background:#b3453a" title="${esc(s.last_error)}">⚠ sync error</span>` : '';
    const stale = !s.last_synced_at || (Date.now() - new Date(s.last_synced_at + 'Z').getTime() > 5*60*1000);
    const syncLabel = s.last_synced_at ? new Date(s.last_synced_at + 'Z').toLocaleString() : 'never';
    const offChip = !s.enabled ? `<span class="pill" style="background:var(--muted)">disabled</span>` : '';
    const staleChip = stale && s.enabled ? `<span class="pill" style="background:#a78b3a">stale</span>` : '';
    const sharedChip = s.user_id == null ? `<span class="pill" style="background:var(--accent)">shared</span>` : '';
    return `<div class="src-row" data-id="${esc(s.id)}" style="--uc:${esc(s.color || '#7c9eb8')}">
      <div class="src-color"></div>
      <div class="src-info">
        <div class="src-title">${esc(s.display_name || kind.label || s.calendar_id)}${sharedChip}${offChip}${staleChip}${errChip}</div>
        <div class="src-meta">${esc(kind.label || s.provider)} · @${esc(s.account_id)} · ${esc(s.calendar_id)}${s.base_url ? ' · ' + esc(s.base_url) : ''}</div>
        <div class="src-meta">last sync: ${esc(syncLabel)}</div>
      </div>
      <div class="src-actions">
        <button class="link" data-act="refresh" title="Sync now">↻</button>
        ${owned?`<button class="link" data-act="edit">Edit</button>`:''}
        ${owned?`<button class="link danger" data-act="del">Delete</button>`:''}
      </div>
    </div>`;
  }).join('');

  openSheet(`<h2>Calendar sources</h2>
    <p style="font-size:13px;color:var(--muted);margin:-4px 0 14px">Connect Nextcloud, iCloud, Microsoft 365, or Google Calendar so events flow into the household calendar grid. Credentials are encrypted at rest and never leave the server.</p>
    <div class="src-list">${sourceRows || '<div class="empty" style="padding:24px 4px">No calendar sources yet — add one to start pulling events.</div>'}</div>
    <button class="btn" id="cs-add" style="margin-top:14px">+ Add source</button>
    <button class="link" style="margin-top:14px;width:100%;text-align:center" onclick="closeSheet()">Done</button>`);

  document.querySelectorAll('.src-row').forEach(row => {
    const id = row.dataset.id;
    const refreshBtn = row.querySelector('[data-act="refresh"]');
    if (refreshBtn) refreshBtn.onclick = async () => {
      try { await api('POST',`/api/calendar-sources/${id}/refresh`); }
      catch (e) { alert((e && e.error) || 'Sync failed'); }
    };
    const editBtn = row.querySelector('[data-act="edit"]');
    if (editBtn) editBtn.onclick = () => {
      const s = sources.find(x => String(x.id) === id);
      openCalendarSourceEditSheet(s, kinds, async () => {
        await refresh();
        await openCalendarSourcesSheet();
      });
    };
    const delBtn = row.querySelector('[data-act="del"]');
    if (delBtn) delBtn.onclick = async () => {
      if (!confirm('Delete this calendar source? Cached events will be removed.')) return;
      try {
        await api('DELETE',`/api/calendar-sources/${id}`);
        await refresh();
        await openCalendarSourcesSheet();
      } catch (e) { alert((e && e.error) || 'Failed'); }
    };
  });

  $('#cs-add').onclick = () => openCalendarSourceEditSheet(null, kinds, async () => {
    await refresh();
    await openCalendarSourcesSheet();
  });
}

// Provider-aware add/edit form. Edit is restricted to display_name,
// color, and enabled (provider / account / calendar / credentials are
// immutable from PATCH — the user can delete + re-add to change those).
function openCalendarSourceEditSheet(src, kinds, afterSave){
  const isEdit = !!src;
  const initialKind = isEdit ? kinds.find(k => k.id === src.provider) : kinds.find(k => !k.disabled);
  const state = {
    provider: initialKind ? initialKind.id : (kinds[0] && kinds[0].id),
    account_id: src ? src.account_id : '',
    calendar_id: src ? src.calendar_id : '',
    base_url: src ? (src.base_url || '') : (initialKind ? (initialKind.baseUrlPlaceholder || '') : ''),
    display_name: src ? (src.display_name || '') : '',
    color: src ? (src.color || '#7c9eb8') : '#7c9eb8',
    enabled: src ? !!src.enabled : true,
    shared: src ? (src.user_id == null) : false,
  };

  function render(){
    const kind = kinds.find(k => k.id === state.provider) || kinds.find(k => !k.disabled);
    if (!kind) {
      openSheet('<h2>No providers available</h2><button class="link" onclick="closeSheet()">Close</button>');
      return;
    }
    const credFields = (kind.credentialFields || []).map(f => {
      const inputType = f.secret ? 'password' : (f.type === 'datetime' ? 'datetime-local' : 'text');
      const ph = f.placeholder ? ` placeholder="${esc(f.placeholder)}"` : '';
      return `<div><label>${esc(f.label)}${f.required ? ' *' : ''}</label>
        <input class="field" type="${inputType}" id="cred-${esc(f.id)}" autocomplete="off"${ph}></div>`;
    }).join('');
    const providerOpts = kinds.filter(k => !k.disabled).map(k =>
      `<button type="button" data-v="${esc(k.id)}" class="${k.id===state.provider?'sel':''}">${esc(k.label)}</button>`
    ).join('');
    const disabledOpts = kinds.filter(k => k.disabled).map(k =>
      `<button type="button" disabled style="opacity:.45">${esc(k.label)} <small>(coming soon)</small></button>`
    ).join('');
    const kindHint = kind.comingSoon ? `<p style="font-size:12px;color:var(--muted);margin-top:6px">${esc(kind.comingSoon)}</p>` : '';

    openSheet(`<h2>${isEdit ? 'Edit calendar source' : 'Add calendar source'}</h2>
      ${isEdit ? '' : `<label>Provider</label><div class="seg" id="prov-seg">${providerOpts}${disabledOpts}</div>${kindHint}`}
      <label>${esc(kind.accountIdLabel || 'Account ID')}</label>
      <input class="field" id="f-acct" value="${esc(state.account_id)}" placeholder="${esc(kind.accountIdPlaceholder || '')}" ${isEdit ? 'readonly style="opacity:.6;cursor:not-allowed"' : ''}>
      <label>${esc(kind.calendarIdLabel || 'Calendar ID')}</label>
      <input class="field" id="f-calid" value="${esc(state.calendar_id)}" placeholder="${esc(kind.calendarIdPlaceholder || '')}" ${isEdit ? 'readonly style="opacity:.6;cursor:not-allowed"' : ''}>
      <label>Base URL ${isEdit ? '' : '(optional)'}</label>
      <input class="field" id="f-base" value="${esc(state.base_url)}" placeholder="${esc(kind.baseUrlPlaceholder || '')}" ${isEdit ? 'readonly style="opacity:.6;cursor:not-allowed"' : ''}>
      <label>Display name</label>
      <input class="field" id="f-name" value="${esc(state.display_name)}" placeholder="Personal, Work, Family…">
      <label>Color</label>
      <input class="field" type="color" id="f-color" value="${esc(state.color)}">
      ${isEdit ? '' : `<h3>Credentials</h3>${credFields}`}
      ${!isEdit && ME && ME.isAdmin ? `<label class="checkbox"><input type="checkbox" id="f-shared" ${state.shared?'checked':''}> Shared (visible to everyone in the household)</label>` : ''}
      ${isEdit ? `<label class="checkbox"><input type="checkbox" id="f-enabled" ${state.enabled?'checked':''}> Enabled (uncheck to pause syncing without deleting)</label>` : ''}
      <button class="btn" style="margin-top:16px" id="f-save">${isEdit ? 'Save' : 'Add it'}</button>
      ${!isEdit ? `<p style="font-size:12px;color:var(--muted);margin-top:10px">Credentials are encrypted with AES-256-GCM (key from <code>CALENDAR_CRED_KEY</code>) and never leave the server.</p>` : ''}
      <button class="link" style="margin-top:14px;width:100%;text-align:center" onclick="openCalendarSourcesSheet()">← Back to sources</button>
      <div class="err" id="f-err"></div>`);

    if (!isEdit) {
      segWire('prov-seg');
      document.querySelectorAll('#prov-seg button[data-v]').forEach(b => {
        b.addEventListener('click', () => {
          state.provider = b.dataset.v;
          const newKind = kinds.find(k => k.id === state.provider);
          if (newKind && newKind.baseUrlPlaceholder && !state.base_url) {
            state.base_url = newKind.baseUrlPlaceholder;
          }
          render();
        }, { once: true });
      });
    }
    $('#f-save').onclick = async () => {
      const body = {
        display_name: $('#f-name').value.trim() || null,
        color: $('#f-color').value,
      };
      if (!isEdit) {
        body.provider = state.provider;
        body.account_id = $('#f-acct').value.trim();
        body.calendar_id = $('#f-calid').value.trim();
        body.base_url = $('#f-base').value.trim() || null;
        if (!body.account_id || !body.calendar_id) {
          $('#f-err').textContent = 'Account ID and Calendar ID are required';
          return;
        }
        const k = kinds.find(k => k.id === state.provider);
        for (const f of (k.credentialFields || [])) {
          const v = $('#cred-' + f.id).value.trim();
          if (f.required && !v) {
            $('#f-err').textContent = f.label + ' is required';
            return;
          }
          if (v) body[f.id] = v;
        }
        if (ME && ME.isAdmin && $('#f-shared').checked) body.shared = true;
      } else {
        body.enabled = $('#f-enabled').checked;
      }
      try {
        if (isEdit) await api('PATCH',`/api/calendar-sources/${src.id}`,body);
        else await api('POST','/api/calendar-sources',body);
        closeSheet();
        if (afterSave) await afterSave();
      } catch (e) { $('#f-err').textContent = (e && e.error) || 'Failed'; }
    };
  }
  render();
}

/* ---- connected agents / token manager (PHA-1896 / PHA-1617.3) ----
//
// Surfaces the /api/agent-tokens endpoints added in PHA-1617.1 (.1 ships
// the schema + routes; this is .3, the user-facing UI).
//
// Design-doc reference: PHA-1617 doc 'meta-agent-socket-design' rev 1,
// §9.1 (User settings UI) — and §4.3 for the REST contract the sheets
// consume. Copy-once plaintext modal follows §4.2 (token format /
// `homestead_pat_<43-char base64url>`).
//
// Three sheets:
//   1. openConnectedAgentsSheet() — top-level list. Shows the user's
//      PAT rows (label, 16-char prefix chip, scopes, created, last_used,
//      revoked state). "+ New token" button opens the issue flow.
//   2. openTokenIssueSheet() — label entry. POSTs to /api/agent-tokens,
//      then opens the copy-once reveal modal with the returned plaintext.
//   3. openTokenRevealSheet(token) — copy-once modal. Plaintext is shown
//      in a dark monospace card with a Copy button. The "I've stored it,
//      close" acknowledge button is enabled only after Copy fires (or the
//      user toggles a checkbox fallback for browsers that block
//      clipboard writes). Closes on acknowledge; the plaintext is gone
//      for good once the modal is dismissed (the server only stored the
//      bcrypt hash).
*/
async function openConnectedAgentsSheet(){
  const tokens = await api('GET','/api/agent-tokens');
  openConnectedAgentsSheetWith(tokens);
}

function openConnectedAgentsSheetWith(tokens){
  const myAdmin = !!(ME && ME.isAdmin);
  const rows = tokens.map(t => {
    const isRevoked = !!t.revoked_at;
    const isExpired = t.expires_at && new Date(t.expires_at + 'Z').getTime() < Date.now();
    const stateChip = isRevoked
      ? '<span class="pill" style="background:var(--muted)">revoked</span>'
      : isExpired
        ? '<span class="pill" style="background:#a78b3a">expired</span>'
        : (t.scopes === 'admin'
            ? '<span class="pill" style="background:var(--accent)">admin</span>'
            : '<span class="pill" style="background:#7c9a72">active</span>');
    const lastUsed = t.last_used_at
      ? `last used ${esc(new Date(t.last_used_at + 'Z').toLocaleString())}`
      : 'never used';
    const expiresAt = t.expires_at
      ? ` · expires ${esc(new Date(t.expires_at + 'Z').toLocaleDateString())}`
      : '';
    const createdAt = t.created_at
      ? `created ${esc(new Date(t.created_at + 'Z').toLocaleDateString())}`
      : '';
    return `<div class="tok-row" data-id="${esc(t.id)}">
      <div class="tok-mark" aria-hidden="true">🔑</div>
      <div class="tok-info">
        <div class="tok-label">${esc(t.label)}${stateChip}</div>
        <div class="tok-meta"><span class="tok-prefix">${esc(t.token_prefix)}…</span> · ${createdAt}${expiresAt}</div>
        <div class="tok-meta">${lastUsed}</div>
      </div>
      <div class="tok-actions">
        ${isRevoked ? '' : `<button class="link danger" data-act="revoke">Revoke</button>`}
      </div>
    </div>`;
  }).join('');

  openSheet(`<h2>Connected agents</h2>
    <p style="font-size:13px;color:var(--muted);margin:-4px 0 14px">Personal access tokens let your own agent (OpenClaw, scripts, anything MCP-speaking) call Homestead with the same powers your session has. The plaintext is shown <b>once</b> at creation &mdash; store it in your password manager. Revoking a token is immediate.</p>
    <div class="tok-list">${rows || '<div class="empty" style="padding:24px 4px">No tokens yet &mdash; mint one to wire up your harness.</div>'}</div>
    <button class="btn" id="tok-add" style="margin-top:14px">+ New token</button>
    <button class="link" style="margin-top:14px;width:100%;text-align:center" onclick="closeSheet()">Done</button>`);

  document.querySelectorAll('.tok-row').forEach(row => {
    const id = row.dataset.id;
    const revokeBtn = row.querySelector('[data-act="revoke"]');
    if (revokeBtn) revokeBtn.onclick = async () => {
      const token = tokens.find(x => String(x.id) === id);
      if (!token) return;
      if (!confirm(`Revoke "${token.label}"?\n\nAny harness using this token will lose access immediately. This cannot be undone.`)) return;
      try {
        await api('DELETE', `/api/agent-tokens/${id}`);
        await openConnectedAgentsSheet();
      } catch (e) {
        alert((e && e.error) || 'Revoke failed');
      }
    };
  });

  $('#tok-add').onclick = () => openTokenIssueSheet(async () => {
    await openConnectedAgentsSheet();
  });
}

function openTokenIssueSheet(afterIssue){
  openSheet(`<h2>New agent token</h2>
    <p style="font-size:13px;color:var(--muted);margin:-4px 0 14px">Pick a label that tells future-you what this token is <em>for</em> (e.g. <code>Laptop OpenClaw</code>, <code>Phone automation</code>, <code>MCP test</code>). The plaintext is shown <b>once</b> on the next screen &mdash; Homestead never stores it.</p>
    <label>Label</label>
    <input class="field" id="tok-label" placeholder="e.g. Laptop OpenClaw" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="64">
    <label>Expires <span style="color:var(--muted);font-weight:500">(optional, ISO 8601 date)</span></label>
    <input class="field" id="tok-expires" type="date" autocomplete="off">
    <button class="btn" id="tok-issue" style="margin-top:14px">Generate token</button>
    <button class="link" style="margin-top:14px;width:100%;text-align:center" onclick="closeSheet()">Cancel</button>
    <div class="err" id="tok-err"></div>`);

  // Suggest a label based on User-Agent / platform (small touch, but
  // shaves a step off the most common case: "Laptop OpenClaw").
  if (!$('#tok-label').value) {
    const guess = platformTokenLabel();
    if (guess) $('#tok-label').value = guess;
  }

  $('#tok-issue').onclick = async () => {
    const label = ($('#tok-label').value || '').trim();
    if (!label) { $('#tok-err').textContent = 'Label is required'; return; }
    if (label.length > 64) { $('#tok-err').textContent = 'Label is too long (max 64 chars)'; return; }
    const expiresRaw = $('#tok-expires').value || '';
    let expires_at = null;
    if (expiresRaw) {
      const d = new Date(expiresRaw + 'T23:59:59');
      if (isNaN(d.getTime())) { $('#tok-err').textContent = 'Invalid expiry date'; return; }
      expires_at = d.toISOString();
    }
    try {
      const issued = await api('POST', '/api/agent-tokens', { label, expires_at });
      // Open the copy-once reveal modal. The label round-trips back so
      // the modal can echo "Stored under: <label>" as a confirmation
      // breadcrumb.
      openTokenRevealSheet({ label: issued.label, token_prefix: issued.token_prefix, token_plaintext: issued.token_plaintext }, async () => {
        if (afterIssue) await afterIssue();
        else closeSheet();
      });
    } catch (e) {
      $('#tok-err').textContent = (e && e.error) || 'Failed to issue token';
    }
  };
}

function openTokenRevealSheet(token, onAcknowledge){
  // Copy-once modal. The plaintext lives in a dark monospace block;
  // the Copy button fires navigator.clipboard.writeText() and toggles a
  // green ✓ for ~2s. The acknowledge button is enabled only after the
  // user has copied OR manually checked the fallback checkbox (covers
  // browsers that block programmatic clipboard writes on insecure
  // origins). Once acknowledged, the modal closes — the plaintext is
  // gone for good (server only stored the bcrypt hash, per design doc
  // §4.1 / §4.2).
  const plaintext = token.token_plaintext || '';
  let copied = false;
  let acknowledged = false;
  openSheet(`<h2>Save your new token</h2>
    <p style="font-size:13px;color:var(--muted);margin:-4px 0 14px">Homestead only stored a hash, so this is the <b>only time</b> you'll see the plaintext. Copy it now into your password manager or paste it into your harness config. Prefix <span class="tok-prefix">${esc(token.token_prefix)}…</span> identifies this row in the list.</p>
    <div class="secret-card" id="tok-secret">
      <div id="tok-secret-text">${esc(plaintext)}</div>
      <div class="copy-row">
        <span class="copied" id="tok-copied">✓ Copied</span>
        <button class="link" id="tok-copy" type="button">Copy</button>
      </div>
    </div>
    <label class="checkbox" style="margin-top:18px"><input type="checkbox" id="tok-ack"> I've stored this token somewhere safe. I understand Homestead cannot show it again.</label>
    <button class="btn" id="tok-done" disabled style="margin-top:10px;opacity:.5">I've stored it &mdash; close</button>
    <button class="link" style="margin-top:14px;width:100%;text-align:center" onclick="closeSheet()">Cancel</button>`);

  const refreshEnabled = () => {
    const ok = copied || ($('#tok-ack') && $('#tok-ack').checked);
    const btn = $('#tok-done');
    btn.disabled = !ok;
    btn.style.opacity = ok ? '1' : '.5';
  };

  const flashCopied = () => {
    const el = $('#tok-copied');
    el.classList.add('on');
    setTimeout(() => el.classList.remove('on'), 2200);
  };

  $('#tok-copy').onclick = async () => {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(plaintext);
      } else {
        // Fallback for older browsers / insecure origins: select the
        // text in the secret block so the user can hit Cmd/Ctrl+C.
        const range = document.createRange();
        range.selectNodeContents($('#tok-secret-text'));
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }
      copied = true;
      flashCopied();
      refreshEnabled();
    } catch (e) {
      // Clipboard rejected (permission denied / insecure origin).
      // User can still tick the ack checkbox to proceed.
      alert('Clipboard write blocked — please select the text manually or tick the acknowledgement below.');
    }
  };

  $('#tok-ack').addEventListener('change', refreshEnabled);

  $('#tok-done').onclick = async () => {
    acknowledged = true;
    if (onAcknowledge) await onAcknowledge();
    else closeSheet();
  };
}

// Best-effort label guess based on UA hints. Just a tiny UX touch —
// keeps the field empty if no guess fits.
function platformTokenLabel(){
  try {
    const ua = (navigator.userAgent || '').toLowerCase();
    const plat = (navigator.platform || '').toLowerCase();
    if (/iphone|ipad|ipod/.test(ua)) return 'iPhone';
    if (/android/.test(ua)) return 'Android phone';
    if (/mac/.test(plat)) return 'Mac';
    if (/win/.test(plat)) return 'Windows';
    if (/linux/.test(plat)) return 'Linux';
    if (/cros/.test(ua)) return 'Chromebook';
  } catch {}
  return '';
}

/* ---- Settings → Apps (PHA-2201.4 / PHA-2232) ----
   Design note PHA-2201 §2 (install flow) / §5 (revoke). Three sheets:
     1. openAppsSheet() — every app the user has on, built-in AND
        third-party, from the same GET /api/apps registry read path
        (lib/app-install.js's listApps()).
     2. openAppDetailSheet(key) — "what this app can do" (scopes via
        the shared window.ScopeDisplay mapping, PHA-2230) + paginated
        activity (app_api_log, PHA-2231) + Revoke (third-party only —
        built-ins have no app-scoped token to revoke).
     3. openAppInstallSheet() → openAppConsentSheet() — paste a
        manifest URL, resolve, then render the SAME consent screen
        consent.html uses (window.HomesteadConsent.renderConsentScreen,
        PHA-2230) inside this sheet, then consent -> install. The
        newly-minted app token is shown exactly once via the existing
        copy-once reveal (openTokenRevealSheet, PHA-1617.3 pattern). */
async function openAppsSheet(){
  const apps = await api('GET','/api/apps');
  openAppsSheetWith(apps);
}

function openAppsSheetWith(apps){
  const rows = apps.map(a=>`
    <div class="tok-row app-row" data-key="${esc(a.key)}">
      <div class="tok-mark" aria-hidden="true">${esc(a.icon||'📦')}</div>
      <div class="tok-info">
        <div class="tok-label">${esc(a.name)}${a.builtin?' <span class="badge">built-in</span>':''}</div>
        <div class="tok-meta">v${esc(a.version||'?')} · ${esc(a.author||'unknown')}</div>
        <div class="tok-meta">installed ${a.installed_at?esc(new Date(a.installed_at+'Z').toLocaleDateString()):'—'}</div>
      </div>
      <div class="app-chevron" aria-hidden="true">›</div>
    </div>`).join('');

  openSheet(`<h2>Apps</h2>
    <p style="font-size:13px;color:var(--muted);margin:-4px 0 14px">Every app you've turned on — built-in and third-party. Tap one to see what it can do, its activity, or revoke access.</p>
    <div class="tok-list">${rows || '<div class="empty" style="padding:24px 4px">No apps installed yet.</div>'}</div>
    <button class="btn" id="app-add" style="margin-top:14px">+ Install app</button>
    <button class="link" style="margin-top:14px;width:100%;text-align:center" onclick="closeSheet()">Done</button>`);

  document.querySelectorAll('.app-row').forEach(row=>{
    row.onclick=()=>openAppDetailSheet(row.dataset.key);
  });
  $('#app-add').onclick=()=>openAppInstallSheet();
}

async function openAppDetailSheet(key){
  let app;
  try { app = await api('GET', `/api/apps/${encodeURIComponent(key)}`); }
  catch(e){ alert((e&&e.error)||'Could not load app'); return openAppsSheet(); }
  openAppDetailSheetWith(app);
}

function openAppDetailSheetWith(app){
  let willPhrases;
  try {
    willPhrases = window.ScopeDisplay.describeScopes(app.scopes||[], { entityKinds: app.entity_kinds||[] });
  } catch(e){
    willPhrases = (app.scopes||[]).map(s=>s); // shouldn't happen — install validates every scope
  }
  const scopesHtml = willPhrases.map(p=>`<li>${esc(p)}</li>`).join('') || '<li>No scopes granted</li>';

  const activityBlock = app.builtin

async function loadAppActivity(key, offset, priorItems){
  const box = $('#app-activity');
  if (!box) return;
  let page;
  try { page = await api('GET', `/api/apps/${encodeURIComponent(key)}/activity?limit=20&offset=${offset}`); }
  catch(e){ box.innerHTML = '<p class="empty">Could not load activity</p>'; return; }
  const items = priorItems.concat(page.items);
  const rows = items.map(it=>{
    const isErr = it.status >= 400;
    return `<div class="act-row">
      <span class="act-route">${esc(it.route)}</span>
      <span class="act-meta"><span class="act-status${isErr?' err':''}">${it.status}</span> · ${esc(new Date(it.created_at+'Z').toLocaleString())}</span>
    </div>`;
  }).join('');
  box.innerHTML = `<div class="act-list">${rows || '<div class="empty" style="padding:14px 0">No activity yet.</div>'}</div>
    ${page.nextOffset!=null?`<button class="link" id="app-activity-more" style="margin-top:10px;width:100%;text-align:center">Load more (${Math.max(page.total-items.length,0)} more)</button>`:''}`;
  const more = $('#app-activity-more');
  if (more) more.onclick = () => loadAppActivity(key, page.nextOffset, items);
}

/* ---- push notifications (PHA-1619) ---- */
function urlBase64ToUint8Array(b64){
  const pad='='.repeat((4-b64.length%4)%4);
  const b=(atob(b64+pad).split('')).map(c=>c.charCodeAt(0));
  return new Uint8Array(b);
}
async function pushSubscribe(){
  if(!('serviceWorker'in navigator)||!('PushManager'in window)||!('Notification'in window)){
    return{ok:false,error:'unsupported'};
  }
  if(Notification.permission==='denied')return{ok:false,error:'denied'};
  if(Notification.permission==='default'){
    const p=await Notification.requestPermission();
    if(p!=='granted')return{ok:false,error:p};
  }
  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub){
    const {publicKey}=await api('GET','/api/push/vapid-public-key');
    sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(publicKey)});
  }
  const json=sub.toJSON();
  await api('POST','/api/push/subscribe',{endpoint:json.endpoint,keys:json.keys});
  return{ok:true};
}
async function pushUnsubscribe(){
  if(!('serviceWorker'in navigator)||!('PushManager'in window))return{ok:false,error:'unsupported'};
  const reg=await navigator.serviceWorker.ready;
  const sub=await reg.pushManager.getSubscription();
  if(sub){
    const ep=sub.endpoint;
    await sub.unsubscribe();
    try{await api('POST','/api/push/unsubscribe',{endpoint:ep})}catch(_){}
  }
  return{ok:true};
}
async function pushState(){
  if(!('serviceWorker'in navigator)||!('PushManager'in window)||!('Notification'in window))return'unsupported';
  if(Notification.permission==='denied')return'denied';
  if(Notification.permission==='default')return'prompt';
  const reg=await navigator.serviceWorker.ready;
  const sub=await reg.pushManager.getSubscription();
  return sub?'granted':'default';
}
async function pushRenderButton(targetId){
  const btn=$(targetId);if(!btn)return;
  const st=await pushState();
  if(st==='unsupported'){
    btn.textContent='🔕 Push not supported in this browser';
    btn.disabled=true;btn.classList.add('btn-secondary');return;
  }
  if(st==='denied'){
    btn.textContent='🔕 Notifications blocked — enable in browser settings';
    btn.disabled=true;btn.classList.add('btn-secondary');return;
  }
  if(st==='granted'){
    btn.textContent='🔔 Disable push notifications';
    btn.onclick=async()=>{const r=await pushUnsubscribe();if(r.ok){pushRenderButton(targetId);if(typeof renderPushPrefs==='function')renderPushPrefs()}};
    return;
  }
  btn.textContent='🔔 Enable push notifications';
  btn.onclick=async()=>{
    const r=await pushSubscribe();
    if(r.ok){pushRenderButton(targetId);if(typeof renderPushPrefs==='function')renderPushPrefs()}
    else{alert('Could not enable notifications: '+(r.error||'unknown'))}
  };
}

/* ---- PHA-2219: PWA install coach ----
// First-login flow that helps non-technical friends get from
// "I have the URL in Safari" to "I get a real push notification."
// The PWA + VAPID pipeline (PHA-1619) already works; this layer
// closes the install-friction gap that the decision comment calls
// out as the actual blocker.
//
// Design rules (Brandon, 2026-08-19):
//   1. Platform-detected instructions (iOS Safari vs Android Chrome),
//      shown with a visual, not a paragraph.
//   2. One-line WHY: notifications do not work until installed.
//   3. Deferred, not dismissed-forever: a quiet chip remains in the
//      avatar menu after a dismiss; never a repeating modal.
//   4. Permission is requested ONLY after install AND after a
//      meaningful moment. The coach never calls
//      Notification.requestPermission() itself — that lives in the
//      avatar-menu push button, gated by the existing pushState().
//   5. Detect installed state and never show any of this to a
//      user who already installed.
//   6. Every step is funnel-instrumented so the analytics pipeline
//      (PHA-2210) can build the install funnel. Closed-enum steps
//      are validated server-side; see POST /api/funnel/install. */

// LS key for the dismissed-forever flag. We keep this per-browser
// (localStorage) rather than per-user so a friend who installs on
// their phone and then visits on a laptop doesn't see the coach
// again on the laptop — install detection handles that, but the
// dismissal flag is the second line of defence. NOT a flag for
// "saw once" (we want to keep showing it until installed, just
// without re-prompting if they explicitly hit Not now).
const INSTALL_DISMISSED_LS = 'homestead.installCoach.dismissed.v1';
// PHA-2498 (UX batch #1): "situated" rule — auto-open the coach only
// after a REAL signal of engagement (first action, a dwell, or a
// returning session), never on the login transition itself. We track
// three counters locally:
//   * `count`            — number of distinct app-launches in this browser.
//                          Second session ⇒ the "2nd-session" arm fires.
//   * `firstActionAt`    — wall-clock ms when the user did their first
//                          meaningful in-app action (tab switch, FAB
//                          tap, drawer chip tap, drawer Open, etc.).
//   * `bootStartedAt`    — wall-clock ms when the current session opened.
//                          A 60s dwell on this session is the "dwells"
//                          arm. Default per spec is 60–90s; we pick 75s.
const INSTALL_ARMS_LS = 'homestead.installCoach.arms.v1';
function loadArms(){
  try{
    const raw=localStorage.getItem(INSTALL_ARMS_LS);
    if(raw){
      const parsed=JSON.parse(raw);
      if(parsed && typeof parsed==='object') return parsed;
    }
  }catch(_){}
  return { count: 0, firstActionAt: null, bootStartedAt: null };
}
function saveArms(a){
  try{ localStorage.setItem(INSTALL_ARMS_LS, JSON.stringify(a)); }catch(_){}
}
// One-per-session dwell timer handle (so a returning user doesn't see
// overlapping timers firing the coach twice). The handle is held on
// `window` so other code paths can cancel it (e.g. if the user installs
// before the timer fires, we cancel).
let _installCoachDwellTimer = null;

function isInstalled(){
  // iOS Safari installs as standalone (navigator.standalone is the
  // historical check, still set on iOS 16.4+).
  if(typeof navigator!=='undefined'&&navigator.standalone===true)return true;
  // Android Chrome + desktop Chrome set display-mode via the manifest.
  if(typeof window!=='undefined'&&window.matchMedia){
    try{
      if(window.matchMedia('(display-mode: standalone)').matches)return true;
      if(window.matchMedia('(display-mode: fullscreen)').matches)return true;
      if(window.matchMedia('(display-mode: minimal-ui)').matches)return true;
    }catch(_){}
  }
  // Reference app detection (Android) — fires if Homestead is
  // installed via Play Store with the digital-asset-links check
  // wired (future work; harmless to call now).
  if(typeof navigator!=='undefined'&&navigator.getInstalledRelatedApps){
    try{
      // Promise-returning; can't await here synchronously, but the
      // sync path (matchMedia/navigator.standalone) covers the
      // vast majority of installs. The async variant is wired into
      // the boot path below.
    }catch(_){}
  }
  return false;
}

// Returns 'ios-safari' | 'android-chrome' | 'desktop-other' | 'unknown'.
// Drives which instruction card the coach shows. iPadOS 13+ reports
// as Mac (desktop) with Safari touch; we treat it as iOS for coach
// purposes because the Share-sheet install path is identical.
function installPlatform(){
  try{
    const ua=(navigator.userAgent||'').toLowerCase();
    const plat=(navigator.platform||'').toLowerCase();
    const isIPhone=/iphone|ipod/.test(ua);
    const isIPad=/ipad/.test(ua)||(/mac/.test(plat)&&typeof navigator.maxTouchPoints==='number'&&navigator.maxTouchPoints>1);
    if(isIPhone||isIPad)return 'ios-safari';
    if(/android/.test(ua))return 'android-chrome';
    if(/crios|chrome/.test(ua)&&!/android/.test(ua))return 'desktop-chrome';
    return 'desktop-other';
  }catch(_){return 'unknown'}
}

// Funnel emitter. Best-effort: errors swallowed because the coach
// is a UX nicety, not a critical path. The analytics worker reads
// these via the install_funnel_events table.
async function funnelEmit(step, extra){
  try{
    await api('POST','/api/funnel/install',Object.assign({
      step,
      platform:installPlatform(),
    },extra||{}));
  }catch(_){}
}

// Should the coach auto-open on this boot? Conservative — only when
// the user is genuinely not installed AND has never seen the coach
// in this browser AND hasn't explicitly dismissed it. (Eligibility
// gate. The actual "situated" timing is enforced by `maybeShowInstallCoach`,
// not here — this function answers "is the user a candidate at all?")
function installCoachShouldPrompt(){
if(isInstalled())return false;
  try{
    if(localStorage.getItem(INSTALL_DISMISSED_LS)==='1')return false;
    // Backwards compat: if the legacy key still marks "ever prompted",
    // honour it (avoid surprising existing users by re-firing).
    if(localStorage.getItem('homestead.installCoach.firstPrompted.v1')==='1')return false;
  }catch(_){}
  // No point prompting on a browser that can't install (e.g. desktop
  // Firefox). Desktop users get the chip on first attempt anyway.
  const p=installPlatform();
  if(p!=='ios-safari'&&p!=='android-chrome')return false;
  // Don't prompt if the user has already turned on push — they
  // either installed on their own or this is a desktop where push
  // is irrelevant.
  if(typeof Notification!=='undefined'&&Notification.permission==='granted')return false;
  return true;
}

// Open the coach sheet. The single entry point — boot auto-opens
// it (if !installCoachShouldPrompt) and the avatar-menu chip opens
// it on tap.
async function openInstallCoach(source){
  // source: 'first_boot' | 'chip' — used for funnel attribution.
  await funnelEmit('instructions_opened',{meta:{source:source||'manual'}});
  const platform=installPlatform();
  const whyLine=platform==='ios-safari'
    ?'Notifications only work once Homestead is on your Home Screen.'
    :platform==='android-chrome'
    ?'Notifications only work once Homestead is installed as an app.'
    :'Notifications only work once Homestead is installed to your device.';
  openSheet(`
    <h2>${platform==='ios-safari'?'Add Homestead to your Home Screen':platform==='android-chrome'?'Install Homestead as an app':'Set up notifications'}</h2>
    <p style="color:var(--muted);font-size:14px;margin:-4px 0 12px">${whyLine}</p>
    ${installCoachInstructions(platform)}
    <button class="btn" id="coach-done" style="margin-top:14px">Got it</button>
    <button class="link" style="margin-top:6px;width:100%;text-align:center;display:block" id="coach-later">Not now</button>
  `);
  $('#coach-done').onclick=()=>{
    // Mark the dismissed flag so we don't auto-open again on next
    // login from this browser. We do NOT mark installed — if the
    // friend didn't actually install, the chip still surfaces the
    // coach next time they tap it.
    try{localStorage.setItem(INSTALL_DISMISSED_LS,'1')}catch(_){}
    funnelEmit('dismissed',{meta:{outcome:'done'}});
    closeSheet();
  };
  $('#coach-later').onclick=()=>{
    try{localStorage.setItem(INSTALL_DISMISSED_LS,'1')}catch(_){}
    funnelEmit('dismissed',{meta:{outcome:'later'}});
    closeSheet();
  };
}

// Boot-time coach trigger. Called from boot() AFTER refresh() and
// the walls check have settled, so the friend sees the feed first
// ("after they are situated" — Brandon's directive). PHA-2498 (UX
// batch #1): we honour the "situated" rule from PHA-2219's decision,
// which the legacy one-shot boot prompt violated. Three arms qualify
// a session as "situated":
//   1. Second session on this device — count >= 2.
//   2. First meaningful in-app action in this session — firstActionAt set.
//   3. 75-second dwell on this session — bootStartedAt + 75s elapses.
// Whichever arm fires first wins. We install hooks (DOM listener for
// arm #2, setTimeout for arm #3) and the count bump for arm #1; they
// are cancellable when the user installs or dismisses.
async function maybeShowInstallCoach(){
  if(!installCoachShouldPrompt())return;
  // Set up the arm state for THIS session. If the user already saw
  // the coach via any of the three arms and dismissed it, persist the
  // dismissed flag — which installCoachShouldPrompt() already
  // honours at the top of this function. The arms only stay armed
  // until the coach opens OR until the user installs (then
  // isInstalled() short-circuits the check at next load).
  const arms = loadArms();
  arms.count = (Number(arms.count) || 0) + 1;
  arms.bootStartedAt = Date.now();
  arms.firstActionAt = arms.firstActionAt || null;
  saveArms(arms);

  // Coalesce to a single open call. Whoever wins the race fires the
  // coach; the rest bail.
  let opened = false;
  function fireCoachIfEligible(source){
    if(opened)return;
    if(!installCoachShouldPrompt())return;
    opened = true;
    funnelEmit('prompt_shown', { meta: { source } });
    // Small delay so the calling event (click / fade-in) settles
    // before the sheet animates over the home screen.
    setTimeout(()=>openInstallCoach(source), 80);
    // Clean up the dwell timer + action listener since we no longer
    // need them.
    cleanupArms();
  }
  function cleanupArms(){
    try{
      if(_installCoachDwellTimer) clearTimeout(_installCoachDwellTimer);
      _installCoachDwellTimer = null;
      document.removeEventListener('click', _firstActionListener, true);
      document.removeEventListener('keydown', _firstActionListener, true);
    }catch(_){}
  }

  // Arm #1: Second session on this device.
  if(arms.count >= 2){
    // Defer one tick so the first-paint of the home screen lands
    // before the coach animates over it (per Brandon's "land on the
    // feed → look around → THEN prompt" rule — even on the second
    // session, don't smother the first paint).
    setTimeout(()=>fireCoachIfEligible('second_session'), 1200);
  }

  // Arm #2: First meaningful in-app action. Capture-phase listener
  // so we catch taps even on elements that stop propagation later
  // (the FAB on Home/Tasks, any nav button, the drawer chip in the
  // avatar menu, etc.). The capture-phase trick is the same as
  // PHA-2494's defensive pattern.
  function _firstActionListener(){
    if(arms.firstActionAt)return;
    arms.firstActionAt = Date.now();
    saveArms(arms);
    fireCoachIfEligible('first_action');
  }
  document.addEventListener('click', _firstActionListener, true);
  document.addEventListener('keydown', _firstActionListener, true);

  // Arm #3: 75s dwell (the brandon-directive midpoint of the
  // 60-90s band). Cancellable via the cleanupArms() path above.
  _installCoachDwellTimer = setTimeout(()=>{
    fireCoachIfEligible('dwell');
  }, 75 * 1000);
}

// Renders the quiet persistent chip in the avatar menu when the
// browser is not installed yet. Per Brandon's directive ("never a
// repeating modal" + "a quiet, findable affordance remains"),
// the chip is small, sits below the helper paragraph, and only
// shows when there is genuinely work left to do.
function renderInstallChip(){
  const host=$('#install-chip-host');
  if(!host)return;
  if(isInstalled()){
    host.innerHTML='';
    return;
  }
  // If notifications are already granted but the app isn't
  // installed (desktop Chrome with a granted exception, or a
  // user who subscribed via the legacy flow), don't show the
  // chip — push works for them as-is.
  if(typeof Notification!=='undefined'&&Notification.permission==='granted'){
    host.innerHTML='';
    return;
  }
  const platform=installPlatform();
  const label=platform==='ios-safari'
    ?'\ud83d\udcf1 Set up notifications on iPhone'
    :platform==='android-chrome'
    ?'\ud83d\udcf1 Set up notifications on Android'
    :'\ud83d\udcf1 Set up notifications';
  host.innerHTML=`
    <button class="install-chip" id="install-chip-btn" type="button"
      style="display:inline-flex;align-items:center;gap:8px;padding:7px 12px;
        margin:2px 0 10px;border-radius:99px;border:1px solid var(--accent-soft);
        background:var(--accent-soft);color:var(--accent);font-size:12px;
        font-weight:700;letter-spacing:.01em">
      ${label}
    </button>`;
  $('#install-chip-btn').onclick=()=>{
    funnelEmit('install_chip_tapped',{meta:{platform}});
    openInstallCoach('chip');
  };
}

// Install-completed detection. When the user backgrounds the app
// (e.g. goes to install), then returns, the display-mode may have
// flipped to standalone. We poll on `visibilitychange` so the
// funnel gets a clean `install_completed` event without waiting
// for the next page load. Best-effort.
//
// PHA-2498 (UX batch #1): the legacy gate was the FIRSTPROMPT localStorage
// key — once the coach auto-opened, we had a marker to flip when the
// user came back installed. With the "situated" rule, the arms
// structure is the new marker: the user is in the arms path once
// arms.bootStartedAt has been set on this session. If the user has
// progressed to the second session OR done a first action, treat
// them as "in the funnel" for the install_completed emission.
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState!=='visible')return;
  try{
    const arms = loadArms();
    const inFunnel = !!(arms && (arms.count >= 2 || arms.firstActionAt || arms.bootStartedAt));
    if(inFunnel && isInstalled()){
      localStorage.setItem(INSTALL_DISMISSED_LS,'1');
      funnelEmit('install_completed');
      cleanupArms();
    }
  }catch(_){}
});

/* ---- PHA-1872: entity graph — entity page + cmd-k search palette ---- */
/* Route: /entity/:id (design doc §10.2 deep_links + nav are id-based). */
const EDGE_GROUP_LABELS={
  available_as:'Available as', available_via:'Available via', authored_by:'Authored by',
  directed_by:'Directed by', tagged_with:'Tagged with', adaptation_of:'Adaptation of',
  part_of:'Part of', member_of:'Member of', attended:'Attended', added:'Added',
  owns:'Owns', lives_at:'Lives at', located_in:'Located in', set_in:'Set in',
  mentioned_in:'Mentioned in', shared_in_list:'Shared in lists', requested_in:'Requested in',
  created:'Created',
};
function entGroupLabel(t){return EDGE_GROUP_LABELS[t]||t.replace(/_/g,' ')}
function entKindIcon(k){return {work:'📚',person:'🧑',place:'📍',thing:'🧰',event:'📅',concept:'🏷️'}[k]||'•'}

async function openEntityPage(id,push){
  if(push!==false) history.pushState({entity:id},'','/entity/'+encodeURIComponent(id));
  $('#shell').classList.remove('on');
  closePalette();
  const body=$('#entBody');
  body.innerHTML='<div class="ent-empty">Loading…</div>';
  $('#entityPage').classList.add('on');
  let entity,edgesRes,backlinksRes,reviewQueue;
  try{
    entity=await api('GET','/api/entities/'+encodeURIComponent(id));
    [edgesRes,backlinksRes,reviewQueue]=await Promise.all([
      api('GET','/api/entities/'+encodeURIComponent(id)+'/edges?direction=out&stale=false'),
      api('GET','/api/entities/'+encodeURIComponent(id)+'/backlinks'),
      api('GET','/api/entities/'+encodeURIComponent(id)+'/review-queue'),
    ]);
  }catch(e){
    body.innerHTML=`<div class="ent-empty">Couldn't load this entity (${esc((e&&e.error)||'error')}).</div>`;
    return;
  }
  renderEntityPage(entity,edgesRes,backlinksRes,reviewQueue);
}
function closeEntityPage(){
  $('#entityPage').classList.remove('on');
  history.pushState({},'','/');
}
function renderEntityPage(entity,edgesRes,backlinksRes,reviewQueue){
  const metaBits=[entity.kind];
  if(entity.meta&&entity.meta.year)metaBits.push(String(entity.meta.year));
  const actions=Object.entries(entity.deep_links||{}).filter(([,url])=>url).map(([svc,url])=>
    `<a href="${esc(url)}" target="_blank" rel="noopener">🔗 Open in ${esc(svc)}</a>`).join('');
  // PHA-1876: "needs review" indicator + per-item Merge/Don't merge
  // buttons. reviewQueue.items is the per-entity list of pending
  // review rows where this entity is candidate_a or candidate_b.
  const pendingReviews = (reviewQueue && Array.isArray(reviewQueue.items))
    ? reviewQueue.items.filter(r => r.status === 'pending')
    : [];
  const reviewBadge = pendingReviews.length
    ? `<div class="ent-review-badge" title="This entity has ${pendingReviews.length} pending review item(s)">⚠️ Needs review (${pendingReviews.length})</div>`
    : '';
  const reviewSectionHtml = pendingReviews.length
    ? `<div class="sec">Review queue</div>${pendingReviews.map(r => {
        const otherId = r.candidate_a === entity.id ? r.candidate_b : r.candidate_a;
        const conf = (typeof r.confidence === 'number') ? r.confidence.toFixed(2) : '?';
        return `<div class="ent-review-row" data-review-id="${esc(r.id)}" data-other-id="${esc(otherId)}">
          <div class="ent-review-meta">
            <span class="kind">${esc(r.kind||'review')}</span>
            <span>confidence ${conf}</span>
            <button onclick="openEntityPage('${esc(otherId)}')">view candidate →</button>
          </div>
          <div class="ent-review-reason">${esc(r.reason||'')}</div>
          <div class="ent-review-actions">
            <button class="ent-merge" data-action="merge">Merge into this</button>
            <button class="ent-reject" data-action="reject">Don't merge</button>
          </div>
        </div>`;
      }).join('')}`
    : '';
  const groupOrder=['available_as','available_via','authored_by','directed_by','tagged_with','adaptation_of','part_of','shared_in_list','mentioned_in'];
  const grouped=edgesRes.grouped||{};
  const groupKeys=[...groupOrder.filter(k=>grouped[k]),...Object.keys(grouped).filter(k=>!groupOrder.includes(k))];
  const groupsHtml=groupKeys.length?groupKeys.map(type=>{
    const rows=grouped[type].map(e=>`<div class="ent-edge-row">
        <span>${entKindIcon(entity.kind)} ${esc(e.meta&&e.meta.format?e.meta.format+' · ':'')}${esc(e.source_service)}</span>
        ${e.deep_link?`<a href="${esc(e.deep_link)}" target="_blank" rel="noopener">open →</a>`:`<button onclick="openEntityPage('${esc(e.to_id)}')">view →</button>`}
      </div>`).join('');
    return `<details class="ent-group" open><summary>${esc(entGroupLabel(type))} (${grouped[type].length})</summary>${rows}</details>`;
  }).join(''):'<div class="ent-empty">No edges yet.</div>';
  const backGrouped=backlinksRes.grouped||{};
  const backKeys=Object.keys(backGrouped);
  const backHtml=backKeys.length?backKeys.map(type=>{
    const rows=backGrouped[type].map(e=>`<div class="ent-edge-row">
        <button onclick="openEntityPage('${esc(e.from_id)}')">${esc(e.from_id)} →</button>
        <span class="kind">${esc(e.source_service)}</span>
      </div>`).join('');
    return `<details class="ent-group"><summary>${esc(entGroupLabel(type))} (${backGrouped[type].length})</summary>${rows}</details>`;
  }).join(''):'<div class="ent-empty">No backlinks yet.</div>';
  const sourceIds=[`${esc(entity.source.service||'—')}: ${esc(entity.source.id||'—')}`];
  $('#entBody').innerHTML=`
    <div class="ent-head">
      <h1>${entKindIcon(entity.kind)} ${esc(entity.name)}</h1>
      <div class="ent-meta-strip">${esc(metaBits.join(' · '))}</div>
      ${reviewBadge}
    </div>
    ${actions?`<div class="ent-actions">${actions}</div>`:''}
    ${reviewSectionHtml}
    <div class="sec">Edges</div>
    ${groupsHtml}
    <div class="sec">Backlinks</div>
    ${backHtml}
    <div class="ent-footer">
      Aliases: ${entity.aliases&&entity.aliases.length?esc(entity.aliases.join(', ')):'none'}<br>
      Source: ${sourceIds.join(' · ')}<br>
      Updated: ${esc(entity.updated_at||'')}
    </div>`;
  // Wire up merge/reject buttons. Re-renders the page after a decision
  // so the row count updates without a full re-load. `into` is always
  // this entity's id when the user clicks "Merge into this" — the API
  // will figure out which candidate side to keep.
  $('#entBody').querySelectorAll('.ent-review-row').forEach(row => {
    const reviewId = row.dataset.reviewId;
    row.querySelectorAll('button[data-action]').forEach(btn => {
      btn.onclick = async () => {
        const action = btn.dataset.action;
        btn.disabled = true;
        try {
          if (action === 'merge') {
            await api('POST', '/api/review-queue/' + encodeURIComponent(reviewId) + '/merge',
                      { into: entity.id });
          } else if (action === 'reject') {
            await api('POST', '/api/review-queue/' + encodeURIComponent(reviewId) + '/reject',
                      { reason: 'dismissed from entity page' });
          }
          // Re-open the page to reflect the new state.
          openEntityPage(entity.id, false);
        } catch (e) {
          alert('Failed: ' + ((e && e.error) || 'error'));
          btn.disabled = false;
        }
      };
    });
  });
}
$('#entBack').onclick=closeEntityPage;
window.addEventListener('popstate',()=>{
  const m=location.pathname.match(/^\/entity\/([^/]+)/);
  if(m&&ME) openEntityPage(decodeURIComponent(m[1]),false);
  else $('#entityPage').classList.remove('on');
});

/* ---- cmd-k palette ---- */
let paletteSel=-1,paletteHitsCache=[];
function openPalette(){
  if(!ME)return;
  $('#palette').classList.add('on');
  $('#paletteInput').value='';
  $('#paletteHits').innerHTML='';
  paletteSel=-1;paletteHitsCache=[];
  setTimeout(()=>$('#paletteInput').focus(),0);
}
function closePalette(){$('#palette').classList.remove('on')}
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){
    e.preventDefault();
    $('#palette').classList.contains('on')?closePalette():openPalette();
  } else if(e.key==='Escape'&&$('#palette').classList.contains('on')){
    closePalette();
  }
});
$('#palette').addEventListener('click',e=>{if(e.target.id==='palette')closePalette()});
let paletteDebounce=null;
$('#paletteInput').addEventListener('input',()=>{
  clearTimeout(paletteDebounce);
  const q=$('#paletteInput').value.trim();
  if(!q){$('#paletteHits').innerHTML='';paletteHitsCache=[];return}
  paletteDebounce=setTimeout(async()=>{
    try{
      const r=await api('GET','/api/entities/search?q='+encodeURIComponent(q)+'&limit=10');
      paletteHitsCache=r.hits||[];
      paletteSel=-1;
      renderPaletteHits();
    }catch(e){$('#paletteHits').innerHTML=`<div class="palette-empty">Search failed</div>`}
  },150);
});
function renderPaletteHits(){
  const host=$('#paletteHits');
  if(!paletteHitsCache.length){host.innerHTML='<div class="palette-empty">No matches</div>';return}
  host.innerHTML=paletteHitsCache.map((h,i)=>
    `<div class="palette-hit${i===paletteSel?' sel':''}" data-i="${i}">
      <span>${entKindIcon(h.entity.kind)} ${esc(h.entity.name)}${h.matched_alias?` <span class="kind">(${esc(h.matched_alias)})</span>`:''}</span>
      <span class="kind">${esc(h.entity.kind)}</span>
    </div>`).join('');
  host.querySelectorAll('.palette-hit').forEach(el=>{
    el.onclick=()=>{openEntityPage(paletteHitsCache[Number(el.dataset.i)].entity.id)};
  });
}
$('#paletteInput').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();paletteSel=Math.min(paletteSel+1,paletteHitsCache.length-1);renderPaletteHits()}
  else if(e.key==='ArrowUp'){e.preventDefault();paletteSel=Math.max(paletteSel-1,0);renderPaletteHits()}
  else if(e.key==='Enter'){
    const pick=paletteHitsCache[paletteSel>=0?paletteSel:0];
    if(pick)openEntityPage(pick.entity.id);
  }
});

// Initial route check: deep-link straight to /entity/:id once logged in.
(function initEntityRoute(){
  const m=location.pathname.match(/^\/entity\/([^/]+)/);
  if(!m)return;
  const check=setInterval(()=>{
    if(ME){clearInterval(check);openEntityPage(decodeURIComponent(m[1]),false)}
  },150);
})();

/* ---- PHA-1898: meta-agent chat drawer (design doc §6.3) ----
   Frontend-only shell: composer + SSE/JSON consumer. Talks to the
   stub /api/drawer backend (PHA-1617.6 will replace the stub with the
   HMAC-signed outbound forwarder; the wire shape stays the same). */
const DRAWER = {
  open: false,
  endpoints: [],
  selectedId: null,
  conversationId: null,
  busy: false,
  loaded: false,
};

function openDrawer() {
  DRAWER.open = true;
  $('#drawer').classList.add('on');
  $('#drawer').setAttribute('aria-hidden', 'false');
  $('#drawerFab').classList.add('off');
  // Always refresh the endpoint list on open (cheap, in case the user added
  // a new harness in another tab or after re-login).
  loadDrawerEndpoints();
  setTimeout(() => $('#drawerInput').focus(), 380);
}
function closeDrawer() {
  DRAWER.open = false;
  $('#drawer').classList.remove('on');
  $('#drawer').setAttribute('aria-hidden', 'true');
  $('#drawerFab').classList.remove('off');
}
$('#drawerFab').onclick = openDrawer;
$('#drawerClose').onclick = closeDrawer;
// ESC closes the drawer — standard dialog UX.
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && DRAWER.open) closeDrawer();
});

async function loadDrawerEndpoints() {
  DRAWER.loaded = true;
  try {
    const res = await fetch('/api/agent-endpoints', { credentials: 'same-origin' });
    if (res.ok) {
      const data = await res.json().catch(() => []);
      DRAWER.endpoints = (data || []).filter(e => e.kind === 'drawer' && e.enabled);
    } else {
      DRAWER.endpoints = [];
    }
  } catch (_) {
    DRAWER.endpoints = [];
  }
  renderDrawerHarness();
  renderDrawerEmpty();
}

function renderDrawerHarness() {
  const slot = $('#drawerHarness');
  const eps = DRAWER.endpoints;
  if (!eps.length) { slot.innerHTML = ''; return; }
  if (!DRAWER.selectedId || !eps.find(e => e.id === DRAWER.selectedId)) {
    DRAWER.selectedId = eps[0].id;
  }
  slot.innerHTML = `<label for="drawerHarnessSel">Harness</label>
    <select id="drawerHarnessSel" aria-label="Harness">
      ${eps.map(e => `<option value="${e.id}" ${e.id===DRAWER.selectedId?'selected':''}>${esc(e.harness_label)}</option>`).join('')}
    </select>`;
  const sel = $('#drawerHarnessSel');
  if (sel) sel.onchange = (ev) => { DRAWER.selectedId = Number(ev.target.value); };
}

function renderDrawerEmpty() {
  const slot = $('#drawerMsgs');
  // Don't clobber an existing conversation.
  if (slot.querySelector('.drawer-msg')) {
    $('#drawerForm').style.display = '';
    return;
  }
  if (!DRAWER.endpoints.length) {
    slot.innerHTML = `<div class="drawer-empty">
      <div class="ico">💬</div>
      <div>No drawer endpoint configured yet.</div>
      <div class="hint">Add one via <code>POST /api/agent-endpoints</code> with <code>kind: "drawer"</code> to point this drawer at your harness.</div>
    </div>`;
    $('#drawerForm').style.display = 'none';
  } else {
    slot.innerHTML = `<div class="drawer-empty">
      <div class="ico">👋</div>
      <div>Ask your agent anything.</div>
    </div>`;
    $('#drawerForm').style.display = '';
  }
}

function appendDrawerMsg(role, text) {
  const slot = $('#drawerMsgs');
  const empty = slot.querySelector('.drawer-empty');
  if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = `drawer-msg ${role}`;
  div.textContent = text;
  slot.appendChild(div);
  slot.scrollTop = slot.scrollHeight;
  return div;
}

function appendDrawerStreaming(role) {
  const slot = $('#drawerMsgs');
  const empty = slot.querySelector('.drawer-empty');
  if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = `drawer-msg ${role}`;
  div.innerHTML = '<span class="drawer-typing"><span></span><span></span><span></span></span>';
  slot.appendChild(div);
  slot.scrollTop = slot.scrollHeight;
  return div;
}

function finalizeStreaming(el, text) {
  // textContent so user input never gets interpreted as HTML (defense in depth).
  el.textContent = text || '';
  const slot = $('#drawerMsgs');
  slot.scrollTop = slot.scrollHeight;
}

function drawerUid() {
  return 'c-' + Math.random().toString(36).slice(2, 10) + '-' + Date.now().toString(36);
}

async function sendDrawerMessage(text) {
  if (DRAWER.busy) return;
  if (!DRAWER.selectedId) { appendDrawerMsg('system', 'Pick a harness to chat with.'); return; }
  if (!DRAWER.conversationId) DRAWER.conversationId = drawerUid();

  appendDrawerMsg('user', text);
  DRAWER.busy = true;
  $('#drawerInput').value = '';
  autosizeDrawerInput();
  $('#drawerSend').disabled = true;
  $('#drawerInput').disabled = true;

  const streaming = appendDrawerStreaming('agent');
  let acc = '';

  try {
    const res = await fetch('/api/drawer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({
        message: text,
        endpoint_id: DRAWER.selectedId,
        conversation_id: DRAWER.conversationId,
      }),
    });
    if (!res.ok) {
      let err = '';
      try { err = (await res.json()).error || ''; } catch (_) { err = `HTTP ${res.status}`; }
      streaming.remove();
      appendDrawerMsg('error', `Failed to send: ${err || res.status}`);
      return;
    }
    const ct = (res.headers.get('content-type') || '').toLowerCase();
    if (ct.includes('text/event-stream')) {
      await consumeSseStream(res, streaming, acc);
    } else if (ct.includes('application/json')) {
      const data = await res.json().catch(() => ({}));
      finalizeStreaming(streaming, data.text || JSON.stringify(data));
    } else {
      const raw = await res.text();
      finalizeStreaming(streaming, raw);
    }
  } catch (err) {
    streaming.remove();
    appendDrawerMsg('error', `Network error: ${err && err.message ? err.message : err}`);
  } finally {
    DRAWER.busy = false;
    $('#drawerSend').disabled = false;
    $('#drawerInput').disabled = false;
    $('#drawerInput').focus();
  }
}

// SSE consumer (design doc §6.3A): reads chunks from the response stream,
// parses `event:` / `data:` lines separated by double-newlines, and pipes
// `event: chunk` data into the streaming agent bubble.
async function consumeSseStream(res, el, acc) {
  if (!res.body || !res.body.getReader) {
    // Browser without ReadableStream (very old) — fall back to text().
    const raw = await res.text();
    finalizeStreaming(el, raw);
    return;
  }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  let text = acc;
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n\n')) !== -1) {
      const block = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      const ev = parseSseBlock(block);
      if (!ev) continue;
      if (ev.event === 'done') return;
      if (ev.event === 'chunk' && ev.data && typeof ev.data.text === 'string') {
        text += ev.data.text;
        finalizeStreaming(el, text);
      } else if (ev.event === 'message' && typeof ev.data === 'string') {
        text += ev.data;
        finalizeStreaming(el, text);
      }
    }
  }
}

function parseSseBlock(block) {
  let event = 'message';
  const dataLines = [];
  for (const rawLine of block.split('\n')) {
    const line = rawLine.replace(/\r$/, '');
    if (!line) continue;
    if (line.startsWith(':')) continue; // SSE comment
    const colon = line.indexOf(':');
    const field = colon === -1 ? line : line.slice(0, colon);
    let val = colon === -1 ? '' : line.slice(colon + 1);
    if (val.startsWith(' ')) val = val.slice(1);
    if (field === 'event') event = val;
    else if (field === 'data') dataLines.push(val);
  }
  if (!dataLines.length) return null;
  let parsed = null;
  const joined = dataLines.join('\n');
  try { parsed = JSON.parse(joined); } catch (_) { parsed = joined; }
  return { event, data: parsed };
}

function autosizeDrawerInput() {
  const el = $('#drawerInput');
  el.style.height = 'auto';
  el.style.height = Math.min(140, el.scrollHeight) + 'px';
}

$('#drawerForm').onsubmit = (e) => {
  e.preventDefault();
  const input = $('#drawerInput');
  const text = (input.value || '').trim();
  if (!text || DRAWER.busy) return;
  sendDrawerMessage(text);
};
$('#drawerInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    $('#drawerForm').requestSubmit();
  }
});
$('#drawerInput').addEventListener('input', autosizeDrawerInput);

// PHA-2200.5 / PHA-2206: load the wall feed component. This script
// tag MUST come after the SPA's own script so boot() (defined above)
// is callable when the component mounts. The component itself is
// pure DOM — it doesn't reach back into this script's scope; it
// only uses window.HomesteadFeed.mount(target, opts).
//
// Loaded as an external <script src> rather than inlined because the
// component is shared with /porch.html — one canonical file, two
// placements. service worker (sw.js) precaches this URL.
(function () {
  const s = document.createElement('script');
  s.src = '/components/feed.js';
  s.async = false; // mount-on-boot needs the component bound first.
  document.head.appendChild(s);
})();
</script>
