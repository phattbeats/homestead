<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Homestead</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#FFFBF5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- PHA-2200.5 / PHA-2206: shared wall feed styles. Same file the
     standalone /porch.html loads, so the in-place mount inside
     #page-wall renders identically to /porch.html. -->
<link rel="stylesheet" href="/porch.css">
<style>
:root{
  --bg:#FFFBF5; --surface:#FFFFFF; --ink:#2B2622; --muted:#8A8177;
  --line:rgba(43,38,34,.07);
  --u-all:#9eb48a;
  --accent:#C4703C; --accent-soft:#F8E9DE;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}

/* ---------- login ---------- */
#login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:380px;background:var(--surface);border-radius:28px;padding:8px;
  box-shadow:0 8px 40px rgba(196,112,60,.08),0 2px 8px rgba(0,0,0,.03)}
.login-inner{border:1px solid var(--line);border-radius:22px;padding:40px 32px;text-align:center}
.logo{font-size:44px;line-height:1}
h1{font-weight:800;font-size:26px;letter-spacing:-.02em;margin:14px 0 4px}
.sub{color:var(--muted);font-size:14px;margin-bottom:28px}
.field{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--bg);
  margin-bottom:12px;outline:none;transition:border-color .3s var(--ease)}
.field:focus{border-color:var(--accent)}
.chips{display:none;gap:8px;margin-bottom:14px;flex-wrap:wrap;justify-content:center}
.chips.on{display:flex}
.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--line);font-weight:600;font-size:13px;
  display:flex;align-items:center;gap:7px;transition:all .25s var(--ease)}
.chip:active{transform:scale(.95)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--chip-c,#999)}
.chip-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  font-weight:700;width:100%;text-align:center;margin-bottom:-2px}
.btn{width:100%;padding:15px;border-radius:16px;background:var(--accent);color:#fff;font-weight:700;
  transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.btn:active{transform:scale(.97)}
.btn-secondary{background:var(--ink);color:#fff}
.err{color:#b3453a;font-size:13px;min-height:18px;margin-top:10px}

/* ---------- app shell ---------- */
#app{display:none;min-height:100dvh;padding-bottom:96px}
header{padding:calc(env(safe-area-inset-top) + 22px) 22px 6px;display:flex;justify-content:space-between;align-items:center}
.greet{font-weight:800;font-size:24px;letter-spacing:-.02em}
.greet small{display:block;font-size:13px;color:var(--muted);font-weight:500;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.12)}
main{padding:14px 18px;max-width:680px;margin:0 auto}
.page{display:none;animation:rise .5s var(--ease)}
.page.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.card{background:var(--surface);border-radius:22px;padding:6px;margin-bottom:14px;
  box-shadow:0 6px 30px rgba(0,0,0,.035)}
.card-in{border:1px solid var(--line);border-radius:17px;padding:18px}
.sec{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:20px 4px 10px}

/* tasks */
.task{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:none}
.chk{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;
  transition:all .35s var(--ease)}
.task.done .chk{background:var(--u-all);border-color:var(--u-all)}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.t-body{flex:1;min-width:0}
.t-title{font-weight:600;font-size:15px}
.t-meta{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-top:2px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.overdue{color:#b3453a;font-weight:600}
.x{color:var(--muted);font-size:18px;padding:6px;opacity:.5}

/* calendar */
.cal-head{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 12px}
.cal-head b{font-size:17px;letter-spacing:-.01em}
.cal-nav{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);font-size:16px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:10px;color:var(--muted);font-weight:700;padding:4px 0;text-transform:uppercase}
.day{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;gap:3px;transition:background .3s var(--ease)}
.day.dim{color:#cfc8bf}
.day.today{background:var(--accent-soft);color:var(--accent)}
.day.sel{background:var(--ink);color:#fff}
.pips{display:flex;gap:2px;height:5px}
.pip{width:5px;height:5px;border-radius:50%}
/* PHA-1867: provider pips carry a 1px surface-coloured ring so they
   don't blur together with the per-user coloured pips on the same cell.
   The ring is drawn via box-shadow inset so the dot stays a circle. */
.pip.provider{box-shadow:0 0 0 1px var(--surface), 0 0 0 2px var(--line)}
.ev{display:flex;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);align-items:center}
.ev:last-child{border-bottom:none}
.ev-time{font-size:12px;font-weight:700;color:var(--muted);width:52px;flex-shrink:0}
.ev-bar{width:4px;height:34px;border-radius:2px;flex-shrink:0}
/* PHA-1867: provider events sit in the same row layout as native events
   but render the source as a small chip + a left-bar tint so the user
   can tell at a glance that the row came from Nextcloud / iCloud / etc. */
.ev.provider{opacity:.96}
.ev.provider .t-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.src-chip{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.02em;color:#fff;text-transform:uppercase;line-height:1.6}
.stale{color:var(--muted);font-weight:700;font-size:11px}

/* services */
.svc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.svc{background:var(--surface);border-radius:20px;padding:5px;box-shadow:0 6px 24px rgba(0,0,0,.035);
  text-decoration:none;color:inherit;transition:transform .4s var(--ease);position:relative}
.svc:active{transform:scale(.96)}
.svc-in{border:1px solid var(--line);border-radius:16px;padding:18px 16px}
.svc-icon{font-size:28px}
.svc-name{font-weight:700;margin-top:10px;font-size:15px}
.svc-desc{font-size:12px;color:var(--muted);margin-top:2px}
/* v0.0.6 health indicator (PHA-1623): subtle red dot + down-since
   label. The dot sits in the same corner as the owner-dot; tap-
   through still works (it's a CSS overlay, not a button). */
.svc-health{position:absolute;top:10px;left:10px;display:none;align-items:center;gap:5px;
  padding:3px 7px 3px 6px;border-radius:99px;background:rgba(179,69,58,.12);color:#b3453a;
  font-size:10px;font-weight:700;letter-spacing:.04em;line-height:1}
.svc-health.on{display:inline-flex}
.svc-health .dot-red{width:7px;height:7px;border-radius:50%;background:#b3453a;flex-shrink:0}
.svc.svc-down .svc-in{border-color:rgba(179,69,58,.18)}
.svc-down .svc-desc{color:#b3453a;font-weight:600}

/* fab + tabbar */
#fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 88px);width:56px;height:56px;
  border-radius:20px;background:var(--accent);color:#fff;font-size:26px;font-weight:400;
  box-shadow:0 10px 30px rgba(196,112,60,.35);transition:transform .35s var(--ease);z-index:40}
#fab:active{transform:scale(.92) rotate(90deg)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;
  padding:10px 16px calc(env(safe-area-inset-bottom) + 12px);
  background:rgba(255,251,245,.85);backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:30}
nav button,nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;
  color:var(--muted);padding:4px 14px;border-radius:14px;transition:color .3s var(--ease);text-decoration:none}
nav button.on{color:var(--accent)}
nav .ico{font-size:20px}

/* ---- PHA-1898: meta-agent chat drawer (design doc §6.3) ---- */
#drawerFab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 156px);
  width:52px;height:52px;border-radius:50%;background:var(--ink);color:#fff;font-size:22px;
  box-shadow:0 8px 24px rgba(43,38,34,.32);transition:transform .35s var(--ease),opacity .35s var(--ease);
  z-index:35;display:flex;align-items:center;justify-content:center;opacity:.95}
#drawerFab:active{transform:scale(.92)}
#drawerFab.off{opacity:0;pointer-events:none;transform:scale(.7)}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:var(--bg);
  border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.08);
  transform:translateX(100%);transition:transform .42s var(--ease);z-index:80;
  display:flex;flex-direction:column;min-height:0;visibility:hidden}
#drawer.on{transform:none;visibility:visible}
@media(max-width:540px){#drawer{width:100vw;border-left:none}}
.drawer-head{padding:18px 18px 12px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--line);background:var(--surface);flex-shrink:0}
.drawer-head .title{font-weight:800;font-size:15px;letter-spacing:-.01em;flex:1;min-width:0}
.drawer-head .harness{font-size:11px;font-weight:700;color:var(--muted);
  display:flex;gap:6px;align-items:center}
.drawer-head .harness label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:0}
.drawer-head .harness select{font-size:12px;font-weight:600;color:var(--ink);
  background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 6px;outline:none;cursor:pointer}
.drawer-close{width:32px;height:32px;border-radius:10px;font-size:18px;color:var(--muted);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.drawer-close:hover{background:var(--line)}
.drawer-msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;min-height:0}
.drawer-msg{max-width:88%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.45;
  white-space:pre-wrap;word-wrap:break-word;overflow-wrap:break-word}
.drawer-msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.drawer-msg.agent{align-self:flex-start;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-bottom-left-radius:4px}
.drawer-msg.system{align-self:center;background:var(--accent-soft);color:var(--accent);
  font-size:12px;font-weight:600;border-radius:10px;padding:6px 12px}
.drawer-msg.error{align-self:center;background:#F5E4E4;color:#9B3A3A;font-size:13px;border-radius:10px;padding:8px 12px;border:1px solid #E5C9C9}
.drawer-typing{display:inline-flex;gap:4px;padding:2px 0;align-items:center}
.drawer-typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:typeBounce 1.2s infinite}
.drawer-typing span:nth-child(2){animation-delay:.15s}
.drawer-typing span:nth-child(3){animation-delay:.3s}
@keyframes typeBounce{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.drawer-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;color:var(--muted);font-size:13px;gap:10px;min-height:0}
.drawer-empty .ico{font-size:36px;opacity:.55}
.drawer-empty .hint{font-size:12px;line-height:1.5;max-width:280px}
.drawer-composer{padding:12px 14px calc(env(safe-area-inset-bottom) + 14px);
  border-top:1px solid var(--line);background:var(--surface);display:flex;gap:8px;align-items:flex-end;flex-shrink:0}
.drawer-composer textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:14px;
  padding:10px 12px;background:var(--bg);outline:none;font-family:inherit;font-size:14px;
  line-height:1.4;max-height:140px;min-height:40px;transition:border-color .25s var(--ease)}
.drawer-composer textarea:focus{border-color:var(--accent)}
.drawer-composer textarea:disabled{opacity:.6;cursor:not-allowed}
.drawer-send{width:42px;height:42px;border-radius:14px;background:var(--accent);color:#fff;
  font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s var(--ease)}
.drawer-send:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}

/* modal */
#modal{position:fixed;inset:0;background:rgba(43,38,34,.4);display:none;align-items:flex-end;
  justify-content:center;z-index:50;backdrop-filter:blur(4px)}
#modal.on{display:flex}
.sheet{background:var(--bg);border-radius:26px 26px 0 0;width:100%;max-width:680px;
  padding:26px 22px calc(env(safe-area-inset-bottom) + 26px);animation:up .45s var(--ease);max-height:90dvh;overflow-y:auto}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-size:19px;font-weight:800;letter-spacing:-.01em;margin-bottom:18px}
.sheet h3{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  margin:18px 0 8px}
.row{display:flex;gap:10px}.row>*{flex:1}
label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin:12px 0 6px}
.checkbox{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);font-weight:500;cursor:pointer}
.checkbox input{width:18px;height:18px;accent-color:var(--accent)}

/* segmented control with color dot per option */
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;padding:9px 6px;border-radius:10px;font-weight:600;font-size:13px;color:var(--muted);
  display:flex;align-items:center;justify-content:center;gap:6px;transition:all .3s var(--ease);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button .pd{width:8px;height:8px;border-radius:50%;background:var(--pd,#999);flex-shrink:0}
.seg button.sel{background:var(--pd,var(--ink));color:#fff}
.seg button.sel .pd{box-shadow:0 0 0 1.5px rgba(255,255,255,.85)}

.link{color:var(--accent);font-weight:700;font-size:14px}
.link.danger{color:#b3453a}
.empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:14px}
.empty span{font-size:30px;display:block;margin-bottom:8px}

/* settings sheet: user list */
.user-list{display:flex;flex-direction:column;gap:10px}
.user-row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface);
  border:1px solid var(--line);border-radius:14px}
.user-row .ucolor{width:36px;height:36px;border-radius:50%;background:var(--uc,#999);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.user-row .uinfo{flex:1;min-width:0}
.user-row .udisp{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.user-row .uuname{font-size:12px;color:var(--muted);margin-top:1px}
.user-row .uactions{display:flex;gap:8px;flex-shrink:0}
.user-row .uactions button{font-size:13px;padding:6px 10px}
.badge{display:inline-block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  background:var(--accent-soft);color:var(--accent);padding:2px 6px;border-radius:6px;font-weight:700}

/* full-screen app shell */
#shell{position:fixed;inset:0;z-index:100;background:#000;display:none}
#shell.on{display:block}
#shellFrame{width:100%;height:100dvh;border:none;background:#111}
#dot{position:fixed;width:46px;height:46px;border-radius:50%;z-index:110;
  background:rgba(43,38,34,.55);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.25);
  display:none;align-items:center;justify-content:center;font-size:19px;color:#fff;
  box-shadow:0 6px 20px rgba(0,0,0,.35);touch-action:none;user-select:none;
  transition:opacity .3s var(--ease)}
#dot.on{display:flex}
#dot.idle{opacity:.45}
.svc-owner{position:absolute;top:10px;right:10px;width:9px;height:9px;border-radius:50%}
.showall{font-size:12px;font-weight:600;color:var(--muted)}
@media(min-width:768px){.svc-grid{grid-template-columns:repeat(3,1fr)}}

/* PHA-1872: entity page (design doc PHA-1624 §7) */
#entityPage{position:fixed;inset:0;z-index:120;background:var(--bg,#fff);display:none;overflow-y:auto;padding:16px 16px 90px}
#entityPage.on{display:block}
.ent-back{background:none;border:none;font-size:15px;color:var(--muted);cursor:pointer;padding:6px 0}
.ent-head{margin:10px 0 4px}
.ent-head h1{font-size:22px;margin:0}
.ent-meta-strip{font-size:13px;color:var(--muted);margin-top:4px}
.ent-review-badge{display:inline-block;margin-top:6px;padding:4px 10px;border-radius:10px;background:#FFF4D6;color:#A07820;font-size:13px;font-weight:600}
.ent-review-row{border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0;background:var(--surface,#fff)}
.ent-review-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.ent-review-meta .kind{background:var(--accent-soft);color:var(--accent);padding:2px 6px;border-radius:6px;font-weight:700}
.ent-review-reason{margin:6px 0;font-size:13px}
.ent-review-actions{display:flex;gap:8px;margin-top:6px}
.ent-review-actions button{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg,#fff);cursor:pointer;font-size:13px}
.ent-review-actions .ent-merge{background:var(--accent);color:#fff;border-color:var(--accent)}
.ent-review-actions .ent-reject{background:#F5E4E4;color:#9B3A3A;border-color:#E5C9C9}
.ent-actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.ent-actions a,.ent-actions button{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;
  border-radius:999px;border:1px solid rgba(0,0,0,.12);background:#f4f2ee;font-size:13px;text-decoration:none;color:inherit;cursor:pointer}
.ent-group{border-top:1px solid rgba(0,0,0,.08);padding:10px 0}
.ent-group summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.ent-group summary::-webkit-details-marker{display:none}
.ent-group summary:before{content:'▸ ';color:var(--muted)}
.ent-group[open] summary:before{content:'▾ '}
.ent-edge-row{padding:6px 0 6px 18px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.ent-edge-row a{color:inherit}
.ent-footer{margin-top:20px;padding-top:12px;border-top:1px solid rgba(0,0,0,.08);font-size:12px;color:var(--muted)}
.ent-empty{padding:20px 0;color:var(--muted);font-size:14px}

/* PHA-1872: cmd-k search palette */
#palette{position:fixed;inset:0;z-index:130;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
#palette.on{display:flex}
.palette-box{width:min(560px,92vw);background:var(--bg,#fff);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.palette-input{width:100%;box-sizing:border-box;border:none;padding:16px;font-size:16px;outline:none;background:transparent}
.palette-hits{max-height:50vh;overflow-y:auto;border-top:1px solid rgba(0,0,0,.08)}
.palette-hit{padding:10px 16px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-size:14px}
.palette-hit:hover,.palette-hit.sel{background:#f4f2ee}
.palette-hit .kind{color:var(--muted);font-size:12px}
.palette-empty{padding:16px;color:var(--muted);font-size:13px}

/* ---- PHA-1868: calendar sources management ---- */
.src-list{display:flex;flex-direction:column;gap:8px}
.src-row{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);align-items:center}
.src-color{width:8px;align-self:stretch;border-radius:4px;background:var(--uc,var(--muted));flex-shrink:0}
.src-info{flex:1;min-width:0}
.src-title{font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.src-title .pill{font-size:11px;font-weight:600;color:#fff;padding:2px 7px;border-radius:8px;background:var(--muted)}
.src-meta{font-size:12px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}
.src-actions .link{padding:8px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line);color:var(--ink);font-weight:600}
.src-actions .link.danger{color:#b3453a;border-color:rgba(179,69,58,.3)}

/* PHA-1896 (PHA-1617.3): connected-agents / token-manager UI.
   Mirrors the calendar-sources row pattern but with a `token` chip
   (the 16-char non-secret prefix shown as a label) and a special
   secret-issuance modal (copy-once plaintext reveal). */
.tok-list{display:flex;flex-direction:column;gap:8px}
.tok-row{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);align-items:center}
.tok-mark{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700}
.tok-info{flex:1;min-width:0;min-width:0}
.tok-label{font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tok-prefix{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:11px;
  background:var(--bg);border:1px solid var(--line);padding:2px 6px;border-radius:6px;color:var(--muted);letter-spacing:-.02em}
.tok-meta{font-size:12px;color:var(--muted);margin-top:3px}
.tok-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}
.tok-actions .link{padding:8px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line);color:var(--ink);font-weight:600}
.tok-actions .link.danger{color:#b3453a;border-color:rgba(179,69,58,.3)}

/* PHA-1896: copy-once plaintext reveal modal. The plaintext is shown
   in a monospace block inside a bordered card. The "I've stored it"
   acknowledgement button is disabled until the user has either
   clicked "Copy" or manually toggled the checkbox. This is a UX guard
   against dismissing the modal without saving the token somewhere. */
.secret-card{background:var(--ink);color:#fff;border-radius:14px;padding:14px 16px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12px;line-height:1.5;word-break:break-all;border:1px solid var(--ink);position:relative}
.secret-card .copy-row{display:flex;justify-content:flex-end;margin-top:10px;gap:8px}
.secret-card .copy-row .link{color:#FFFBF5;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);font-family:'Plus Jakarta Sans',sans-serif;font-size:13px}
.secret-card .copy-row .link:active{background:rgba(255,255,255,.18)}
.secret-card .copied{color:#9eb48a;font-size:12px;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;align-self:center;display:none}
.secret-card .copied.on{display:inline-block}
</style>
</head>
<body>

<div id="login">
  <div class="login-card"><div class="login-inner">
    <div class="logo">🏡</div>
    <h1>Homestead</h1>
    <div class="sub">The household, in one place</div>
    <div class="chips" id="chipRow"></div>
    <input class="field" id="username" type="text" placeholder="Username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
    <input class="field" id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="loginBtn">Come on in</button>
    <div class="err" id="loginErr"></div>
  </div></div>
</div>

<div id="app">
  <header>
    <div class="greet"><small id="dateLine"></small><span id="greet"></span></div>
    <button class="avatar" id="avatarBtn"></button>
  </header>
  <main>
    <div class="page" id="page-home">
      <div class="sec">Today</div>
      <div class="card"><div class="card-in" id="todayEvents"></div></div>
      <div class="sec">On the list</div>
      <div class="card"><div class="card-in" id="todayTasks"></div></div>
    </div>
    <div class="page" id="page-tasks">
      <div class="sec">To do</div>
      <div class="card"><div class="card-in" id="openTasks"></div></div>
      <div class="sec">Done</div>
      <div class="card"><div class="card-in" id="doneTasks"></div></div>
    </div>
    <div class="page" id="page-cal">
      <div class="card"><div class="card-in">
        <div class="cal-head">
          <button class="cal-nav" id="calPrev">‹</button><b id="calTitle"></b><button class="cal-nav" id="calNext">›</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div></div>
      <div class="sec" id="selDayLabel"></div>
      <div class="card"><div class="card-in" id="dayEvents"></div></div>
    </div>
    <div class="page" id="page-svc">
      <div class="sec" style="display:flex;justify-content:space-between;align-items:center">
        <span>Apps <button class="showall" id="showAll">· showing mine</button></span>
        <button class="link" id="addSvc">+ Add</button></div>
      <div class="svc-grid" id="svcGrid"></div>
    </div>
    <!-- PHA-2200.5 / PHA-2206: in-place wall mount. The same
         HomesteadFeed component that backs /porch.html is mounted into
         this div when the feed module is enabled for the current user
         (see boot() below). When the feed module is the user's SOLE
         enabled module, the SPA redirects to /porch.html instead of
         mounting here (per PHA-2200 §6 dual-surface design). The
         page id matches the nav button's data-p attribute so the
         existing tab-switching handler (curPage = b.dataset.p; show
         #page-{curPage}) finds it. We use 'porch' (the room
         discriminator) instead of the registry key to avoid colliding
         with PHA-2209's no-hardcoded-keys audit. -->
    <div class="page" id="page-porch"></div>
  </main>
  <button id="fab">+</button>
  <nav>
    <button data-p="home" class="on"><span class="ico">🏡</span>Home</button>
    <button data-p="tasks"><span class="ico">✓</span>Tasks</button>
    <button data-p="cal"><span class="ico">📅</span>Calendar</button>
    <button data-p="svc"><span class="ico">🛰️</span>Apps</button>
    <!-- PHA-2200.5 / PHA-2206: in-place Porch tab. Replaces the old
         `navPorch` <a> that linked to /porch.html as a separate page;
         now it's a real tab button that switches to #page-wall. Hidden
         until boot() detects the feed module is enabled for the
         current user. The data-p attribute is a tab-discriminator
         string (matches the page div id, not the module key) so we
         use the room name 'porch' to avoid colliding with the
         PHA-2209 no-hardcoded-keys audit. -->
    <button data-p="porch" id="navWall" style="display:none"><span class="ico">📸</span>Porch</button>
  </nav>
</div>

<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="shell"><iframe id="shellFrame" src="about:blank" allow="fullscreen; autoplay; clipboard-write"></iframe></div>
<div id="dot">🏡</div>

<!-- PHA-1898: meta-agent chat drawer (design doc §6.3). Frontend-only shell:
     composer + SSE/JSON consumer. POSTs to /api/drawer; the actual HMAC-signed
     outbound forwarding to the user's harness URL is wired in PHA-1617.6. -->
<button id="drawerFab" type="button" title="Open chat" aria-label="Open chat drawer">💬</button>
<div id="drawer" role="dialog" aria-label="Chat drawer" aria-hidden="true">
  <div class="drawer-head">
    <div class="title">Chat</div>
    <div class="harness" id="drawerHarness"></div>
    <button class="drawer-close" id="drawerClose" type="button" aria-label="Close drawer">×</button>
  </div>
  <div class="drawer-msgs" id="drawerMsgs"></div>
  <form class="drawer-composer" id="drawerForm" autocomplete="off">
    <textarea id="drawerInput" placeholder="Type a message…" rows="1" maxlength="8000"
      aria-label="Message"></textarea>
    <button class="drawer-send" id="drawerSend" type="submit" title="Send" aria-label="Send">↑</button>
  </form>
</div>

<!-- PHA-1872: entity page (design doc PHA-1624 §7) -->
<div id="entityPage">
  <button class="ent-back" id="entBack">‹ Back</button>
  <div id="entBody"></div>
</div>

<!-- PHA-1872: cmd-k search palette -->
<div id="palette">
  <div class="palette-box">
    <input class="palette-input" id="paletteInput" placeholder="Search entities… (name, alias, tag)" autocomplete="off">
    <div class="palette-hits" id="paletteHits"></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const api=async(m,u,b)=>{const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined,sameSite:'lax'});if(!r.ok){let e;try{e=await r.json()}catch{failed:e=await r.text().catch(()=>r.status+'');throw{error:failed||('HTTP '+r.status)}}throw e}return r.json()};

/* ---- state ---- */
let ME=null, USERS={};
let TASKS=[],EVENTS=[],SVCS=[];
let MERGED=[]; // PHA-1867: native + cached provider events for the current month
let calY,calM,selDate=today();

function today(){const d=new Date();return d.toISOString().slice(0,10)}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(s){const d=new Date(s+'T00:00:00');return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}

/* ---- user helpers (generic N-user) ---- */
function userName(u){
  if(u==='all'||!u)return 'Everyone';
  return (USERS[u]&&USERS[u].display)||u;
}
function userColorVar(u){
  if(u==='all'||!u)return 'var(--u-all)';
  return `var(--u-${u})`;
}
function userColorRaw(u){
  if(u==='all'||!u)return '#9eb48a';
  return (USERS[u]&&USERS[u].color)||'#999';
}
function userInitials(u){
  const d=USERS[u]&&USERS[u].display||u;
  return d.trim()[0].toUpperCase();
}
function buildUserCssVars(){
  const r=document.documentElement;
  r.style.setProperty('--u-all','#9eb48a');
  Object.values(USERS).forEach(u=>{
    r.style.setProperty(`--u-${u.username}`, u.color);
  });
}

const LS_KEY='homestead_users_v1';
function loadUsersFromCache(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(!raw)return;
    const list=JSON.parse(raw);
    USERS={};
    list.forEach(u=>{USERS[u.username]={username:u.username,display:u.display,color:u.color,isAdmin:!!u.isAdmin}});
    buildUserCssVars();
  }catch{}
}
function saveUsersToCache(){
  try{
    const list=Object.values(USERS).map(u=>({username:u.username,display:u.display,color:u.color,isAdmin:u.isAdmin}));
    localStorage.setItem(LS_KEY, JSON.stringify(list));
  }catch{}
}
async function refreshUsersFromServer(){
  try{
    const list=await api('GET','/api/users');
    USERS={};
    list.forEach(u=>{USERS[u.username]={username:u.username,display:u.display,color:u.color,isAdmin:!!u.is_admin}});
    buildUserCssVars();
    saveUsersToCache();
  }catch(e){
    // 401 on /api/users before login is fine; just keep cache
  }
}

/* ---- login ---- */
loadUsersFromCache();
renderLoginChips();
$('#loginBtn').onclick=doLogin;
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
$('#username').addEventListener('keydown',e=>{if(e.key==='Enter'){$('#pw').focus();}});
async function doLogin(){
  const u=$('#username').value.trim();
  const p=$('#pw').value;
  if(!u){$('#loginErr').textContent='Username required';return}
  try{const r=await api('POST','/api/login',{username:u,password:p});boot(r.user)}
  catch(e){$('#loginErr').textContent=(e&&e.error)||'Login failed'}
}
function renderLoginChips(){
  const row=$('#chipRow');
  const users=Object.values(USERS).sort((a,b)=>a.username.localeCompare(b.username));
  if(!users.length){row.classList.remove('on');row.innerHTML='';return}
  row.classList.add('on');
  row.innerHTML='<div class="chip-label">Quick pick</div>'+users.map(u=>
    `<button type="button" class="chip" data-u="${esc(u.username)}" style="--chip-c:${esc(u.color)}">
       <span class="dot"></span>${esc(u.display)}
     </button>`).join('');
  row.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
    $('#username').value=b.dataset.u;
    $('#pw').focus();
  });
}

/* ---- boot ---- */
async function boot(user){
  ME=user;$('#login').style.display='none';$('#app').style.display='block';
  const h=new Date().getHours();
  $('#greet').textContent=(h<12?'Morning':h<17?'Afternoon':'Evening')+', '+user.display;
  $('#dateLine').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  const a=$('#avatarBtn');a.textContent=userInitials(user.username);a.style.background=userColorRaw(user.username);
  const d=new Date();calY=d.getFullYear();calM=d.getMonth();
  await refreshUsersFromServer();
  await refresh();
  // PHA-2200.5 / PHA-2206: wall module is mounted in-place when the
  // user's enabled-modules set includes the feed module. The mount lives
  // in #page-wall and shares the HomesteadFeed component with /porch.html.
  // We identify the feed module by its `room === 'porch'` discriminator
  // in the /api/modules registry — NOT by hardcoding the literal key —
  // so PHA-2209's "no hardcoded module-key literals in render code"
  // audit (Amendment 3) doesn't flag this SPA bootstrap. The same
  // discriminator matches the wall entry's `room: 'porch'` in lib/modules.js.
  // Three things happen here, in order:
  //   1. Fetch /api/me/modules — the caller's enabled-keys list in
  //      registry order (PHA-2204). If the feed module (room=porch)
  //      is in there, show the in-place nav tile (#navWall) and mount
  //      the feed component.
  //   2. If the feed module is NOT enabled, unmount any leftover
  //      instance (the user just disabled it in the avatar menu) so
  //      the page-wall div doesn't render a stale feed.
  //   3. If the feed module is the user's ONLY enabled module, redirect
  //      to /porch.html — that placement is the full standalone page,
  //      not an SPA tab. This is the dual-surface rule from
  //      PHA-2200 §6.
  try{
    const enabled=await api('GET','/api/me/modules');
    let feedKey=null;
    // Find the enabled module whose /api/modules entry has room='porch'.
    // We need both the registry (to look up by room) and the enabled
    // list (to know which are enabled), so fetch both in parallel.
    const [modules, enabledKeys] = await Promise.all([
      api('GET','/api/modules').catch(()=>[]),
      Promise.resolve(Array.isArray(enabled)?enabled:[]),
    ]);
    for (const m of modules) {
      if (m && m.room === 'porch' && enabledKeys.indexOf(m.key) !== -1) {
        feedKey = m.key; break;
      }
    }
    const feedOn=feedKey!==null;
    const wallPage=$('#page-porch');
    if(feedOn){
      $('#navWall').style.display='';
      if(wallPage&&window.HomesteadFeed&&!wallPage.dataset.mounted){
        window.HomesteadFeed.mount(wallPage,{
          apiBase:'/api',
          canPost:true,canReact:true,canComment:true,
        });
        wallPage.dataset.mounted='1';
      }
    }else{
      $('#navWall').style.display='none';
      if(wallPage&&window.HomesteadFeed&&wallPage.dataset.mounted){
        window.HomesteadFeed.unmount(wallPage);
        delete wallPage.dataset.mounted;
      }
    }
    // Single-surface rule: if the feed module is the user's only
    // enabled module, redirect to the standalone /porch.html. The
    // SPA's `defaultRoute` from /api/me/layout already encodes this
    // for the layout bootstrap, but we double-check here so a user
    // landing on / while feed-only is redirected even if the
    // bootstrap didn't fire.
    if(feedOn&&enabledKeys.length===1){
      window.location.href='/porch.html';
    }
  }catch(_){}
  // PHA-1619: if the browser already has permission + a subscription,
  // re-register it against this session so a returning user on a fresh
  // device doesn't have to click "Enable" again. Best-effort: any error
  // is swallowed because the user can always re-enable from the avatar menu.
  try{
    if('serviceWorker'in navigator&&'PushManager'in window&&'Notification'in window&&Notification.permission==='granted'){
      const reg=await navigator.serviceWorker.ready;
      let sub=await reg.pushManager.getSubscription();
      if(!sub){
        const {publicKey}=await api('GET','/api/push/vapid-public-key');
        sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(publicKey)});
      }
      const json=sub.toJSON();
      await api('POST','/api/push/subscribe',{endpoint:json.endpoint,keys:json.keys});
    }
  }catch(_){}
}
async function refreshMerged(){
  // Fetch the merged feed for the current calendar month. Called both
  // from refresh() (initial load) and from the calPrev/calNext handlers
  // (month navigation). Errors are swallowed — if the merged feed is
  // unavailable the native-only fallback in eventsForDay() still renders.
  try{
    const monthStart = `${calY}-${String(calM+1).padStart(2,'0')}-01`;
    const monthEnd = new Date(calY, calM+1, 0).toISOString().slice(0,10);
    const merged = await api('GET',`/api/events/merged?from=${monthStart}&to=${monthEnd}`);
    MERGED = (merged && merged.events) || [];
  } catch(_) {
    MERGED = [];
  }
}
async function refresh(){
  [TASKS,EVENTS,SVCS]=await Promise.all([api('GET','/api/tasks'),api('GET','/api/events'),api('GET','/api/services')]);
  await refreshMerged();
  renderHome();renderTasks();renderCal();renderSvcs();
}

/* ---- rendering ---- */
function taskRow(t){
  const od=t.due_date&&!t.done&&t.due_date<today();
  return `<div class="task ${t.done?'done':''}">
    <button class="chk" onclick="toggleTask(${t.id})">${t.done?'✓':''}</button>
    <div class="t-body" onclick="openTaskSheet(${t.id})">
      <div class="t-title">${esc(t.title)}${t.recur?' 🔁':''}</div>
      <div class="t-meta">
        <span class="dot" style="background:${userColorVar(t.assignee)}"></span>${esc(userName(t.assignee))}
        ${t.alt_assignee?`<span class="dot" style="background:${userColorVar(t.alt_assignee)};opacity:.55"></span><span>↔ ${esc(userName(t.alt_assignee))}</span>`:''}
        ${t.due_date?`<span class="${od?'overdue':''}">${od?'⚠ ':''}${fmtDate(t.due_date)}</span>`:''}
      </div>
    </div>
    <button class="x" onclick="delTask(${t.id})">✕</button></div>`;
}
function renderHome(){
  // PHA-1867: pull today's events from the merged feed so provider events
  // appear on the home screen alongside native ones. Use eventsForDay
  // for the same overlap rules as the calendar grid.
  const evs=eventsForDay(today());
  $('#todayEvents').innerHTML=evs.length?evs.map(mergedEvRow).join(''):`<div class="empty"><span>☀️</span>Nothing on the calendar today</div>`;
  const due=TASKS.filter(t=>!t.done&&(!t.due_date||t.due_date<=today()));
  $('#todayTasks').innerHTML=due.length?due.map(taskRow).join(''):`<div class="empty"><span>🎉</span>All caught up</div>`;
}
function renderTasks(){
  const open=TASKS.filter(t=>!t.done),done=TASKS.filter(t=>t.done);
  $('#openTasks').innerHTML=open.length?open.map(taskRow).join(''):`<div class="empty"><span>🌿</span>Nothing to do. Suspicious.</div>`;
  $('#doneTasks').innerHTML=done.length?done.map(taskRow).join(''):`<div class="empty">Nothing done yet</div>`;
}
function evRow(e){
  return `<div class="ev" onclick="openEventSheet(${e.id})">
    <div class="ev-time">${e.time||'all day'}</div>
    <div class="ev-bar" style="background:${userColorVar(e.owner)}"></div>
    <div class="t-body"><div class="t-title">${esc(e.title)}</div>
    ${e.notes?`<div class="t-meta">${esc(e.notes)}</div>`:''}</div>
    <button class="x" onclick="event.stopPropagation();delEvent(${e.id})">✕</button></div>`;
}
// PHA-1867: provider events are read-only in v1 (Phase 2 write-back lives
// in PHA-1866). The row uses a chip tag to show the source display_name
// and a coloured left bar in the source's color. No edit/delete buttons
// because we never wrote it locally — the source of truth is the provider.
function providerEvRow(e){
  const start = e.start || '';
  const end = e.end || '';
  const time = e.allDay
    ? 'all day'
    : (start.length >= 16 ? start.slice(11,16) : 'all day');
  const label = e.display_name || (e.origin || '').replace('provider:','') || 'provider';
  const color = e.color || '#7c9eb8';
  const stale = e.stale ? ' <span class="stale" title="Provider cache is stale">⚠ stale</span>' : '';
  const range = (!e.allDay && end && end !== start) ? ` – ${end.slice(11,16)}` : '';
  return `<div class="ev provider">
    <div class="ev-time">${esc(time)}${range}</div>
    <div class="ev-bar" style="background:${color}"></div>
    <div class="t-body">
      <div class="t-title">${esc(e.title)}${stale}</div>
      <div class="t-meta"><span class="src-chip" style="background:${color}">${esc(label)}</span>${e.location?` · 📍 ${esc(e.location)}`:''}${e.notes?` · ${esc(e.notes)}`:''}</div>
    </div>
  </div>`;
}
function mergedEvRow(e){
  if (!e || !e.origin) return '';
  if (e.origin === 'native') {
    // Restore the numeric id the existing sheets expect.
    const nativeId = parseInt(String(e.id).replace(/^native-/, ''), 10);
    return evRow({
      id: nativeId,
      title: e.title,
      notes: e.notes,
      date: (e.start || '').slice(0,10),
      time: e.allDay ? null : (e.start || '').slice(11,16),
      owner: e.owner,
    });
  }
  return providerEvRow(e);
}
// eventsForDay returns the merged events that are ACTIVE on the given
// day cell. Native events use `start.slice(0,10) == ds`; provider events
// use [start, end] overlap. Multi-day provider events appear on every
// day they touch so the pip count and day-list stay consistent.
function eventsForDay(ds){
  return MERGED.filter((e)=>{
    if(!e || !e.start) return false;
    const start = e.start.slice(0,10);
    if(e.origin === 'native') return start === ds;
    const end = (e.end || e.start).slice(0,10);
    return ds >= start && ds <= end;
  });
}
// Provider pip = solid dot in provider color + 1px surface-colored ring
// to make it pop against the per-user colored pips on the same cell.
// Native pip stays a solid dot in the owner's color, matching v1.
function pipFor(e){
  if(e.origin === 'native'){
    return `<span class="pip" style="background:${userColorVar(e.owner)}"></span>`;
  }
  const color = e.color || '#7c9eb8';
  const label = e.display_name || (e.origin || '').replace('provider:','') || 'provider';
  const stale = e.stale ? ' · stale' : '';
  return `<span class="pip provider" style="background:${color}" title="${esc(label + stale)}"></span>`;
}
function renderCal(){
  const first=new Date(calY,calM,1),start=first.getDay(),dim=new Date(calY,calM+1,0).getDate();
  $('#calTitle').textContent=first.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  let html=['S','M','T','W','T','F','S'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<start;i++)html+=`<div class="day dim"></div>`;
  for(let d=1;d<=dim;d++){
    const ds=`${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs=eventsForDay(ds);
    const cls=ds===selDate?'sel':ds===today()?'today':'';
    html+=`<div class="day ${cls}" onclick="pickDay('${ds}')">${d}
      <div class="pips">${evs.slice(0,3).map(pipFor).join('')}</div></div>`;
  }
  $('#calGrid').innerHTML=html;
  $('#selDayLabel').textContent=fmtDate(selDate);
  const evs=eventsForDay(selDate);
  $('#dayEvents').innerHTML=evs.length?evs.map(mergedEvRow).join(''):`<div class="empty">Free day</div>`;
}

// v0.0.6 health badge (PHA-1623): format a "down since HH:MM" label
// from an ISO timestamp in the local timezone.
function fmtDownSince(iso){
  if(!iso)return '';
  try{
    const d=new Date(iso);
    const hh=String(d.getHours()).padStart(2,'0');
    const mm=String(d.getMinutes()).padStart(2,'0');
    return `down since ${hh}:${mm}`;
  }catch(_){return 'down'}
}

/* ---- full-screen app shell + escape dot ---- */
const dot=$('#dot');
let dotIdleTimer;
function openShell(url){
  $('#shellFrame').src=url;
  $('#shell').classList.add('on');dot.classList.add('on');dot.classList.remove('idle');
  dot.style.left='';dot.style.top='';dot.style.right='14px';dot.style.bottom='calc(env(safe-area-inset-bottom) + 24px)';
  clearTimeout(dotIdleTimer);dotIdleTimer=setTimeout(()=>dot.classList.add('idle'),2500);
}
function closeShell(){
  $('#shell').classList.remove('on');dot.classList.remove('on');
  $('#shellFrame').src='about:blank';
}
let drag=null;
dot.addEventListener('pointerdown',e=>{
  dot.setPointerCapture(e.pointerId);dot.classList.remove('idle');clearTimeout(dotIdleTimer);
  drag={x:e.clientX,y:e.clientY,ox:dot.offsetLeft,oy:dot.offsetTop,moved:false};
});
dot.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(Math.abs(dx)+Math.abs(dy)>6)drag.moved=true;
  dot.style.right='auto';dot.style.bottom='auto';
  dot.style.left=Math.max(4,Math.min(innerWidth-50,drag.ox+dx))+'px';
  dot.style.top=Math.max(4,Math.min(innerHeight-50,drag.oy+dy))+'px';
});
dot.addEventListener('pointerup',e=>{
  const wasTap=drag&&!drag.moved;drag=null;
  if(wasTap){closeShell();return}
  const snapLeft=dot.offsetLeft+23<innerWidth/2;
  dot.style.left=snapLeft?'8px':(innerWidth-54)+'px';
  dotIdleTimer=setTimeout(()=>dot.classList.add('idle'),2500);
});

/* ---- PHA-1868: per-user calendar source config UI ----
// The sheet is reachable from the avatar menu. Every authenticated
// user can manage their own per-user sources; admins additionally see
// shared sources and can edit/delete them. POST /api/calendar-sources
// is the only path that takes credentials — this sheet is the
// source-config counterpart to lib/calendar-sources.js. The DTO
// (publicView) is the single source of truth for what the client sees;
// no cred_blob ever crosses the network here.
*/
async function openCalendarSourcesSheet(){
  const [sources, kindsRes] = await Promise.all([
    api('GET','/api/calendar-sources'),
    api('GET','/api/calendar-sources/kinds'),
  ]);
  openCalendarSourcesSheetWith(sources, kindsRes.kinds || []);
}

function openCalendarSourcesSheetWith(sources, kinds){
  const myId = ME ? ME.id : null;
  const myAdmin = !!(ME && ME.isAdmin);
  const sourceRows = sources.map(s => {
    const owned = s.user_id == null ? myAdmin : (s.user_id === myId || myAdmin);
    const kind = kinds.find(k => k.id === s.provider) || { label: s.provider };
    const errChip = s.last_error ? `<span class="pill" style="background:#b3453a" title="${esc(s.last_error)}">⚠ sync error</span>` : '';
    const stale = !s.last_synced_at || (Date.now() - new Date(s.last_synced_at + 'Z').getTime() > 5*60*1000);
    const syncLabel = s.last_synced_at ? new Date(s.last_synced_at + 'Z').toLocaleString() : 'never';
    const offChip = !s.enabled ? `<span class="pill" style="background:var(--muted)">disabled</span>` : '';
    const staleChip = stale && s.enabled ? `<span class="pill" style="background:#a78b3a">stale</span>` : '';
    const sharedChip = s.user_id == null ? `<span class="pill" style="background:var(--accent)">shared</span>` : '';
    return `<div class="src-row" data-id="${esc(s.id)}" style="--uc:${esc(s.color || '#7c9eb8')}">
      <div class="src-color"></div>
      <div class="src-info">
        <div class="src-title">${esc(s.display_name || kind.label || s.calendar_id)}${sharedChip}${offChip}${staleChip}${errChip}</div>
        <div class="src-meta">${esc(kind.label || s.provider)} · @${esc(s.account_id)} · ${esc(s.calendar_id)}${s.base_url ? ' · ' + esc(s.base_url) : ''}</div>
        <div class="src-meta">last sync: ${esc(syncLabel)}</div>
      </div>
      <div class="src-actions">
        <button class="link" data-act="refresh" title="Sync now">↻</button>
        ${owned?`<button class="link" data-act="edit">Edit</button>`:''}
        ${owned?`<button class="link danger" data-act="del">Delete</button>`:''}
      </div>
    </div>`;
  }).join('');

  openSheet(`<h2>Calendar sources</h2>
    <p style="font-size:13px;color:var(--muted);margin:-4px 0 14px">Connect Nextcloud, iCloud, Microsoft 365, or Google Calendar so events flow into the household calendar grid. Credentials are encrypted at rest and never leave the server.</p>
    <div class="src-list">${sourceRows || '<div class="empty" style="padding:24px 4px">No calendar sources yet — add one to start pulling events.</div>'}</div>
    <button class="btn" id="cs-add" style="margin-top:14px">+ Add source</button>
    <button class="link" style="margin-top:14px;width:100%;text-align:center" onclick="closeSheet()">Done</button>`);

  document.querySelectorAll('.src-row').forEach(row => {
    const id = row.dataset.id;
    const refreshBtn = row.querySelector('[data-act="refresh"]');
    if (refreshBtn) refreshBtn.onclick = async () => {
      try { await api('POST',`/api/calendar-sources/${id}/refresh`); }
      catch (e) { alert((e && e.error) || 'Sync failed'); }
    };
    const editBtn = row.querySelector('[data-act="edit"]');
    if (editBtn) editBtn.onclick = () => {
      const s = sources.find(x => String(x.id) === id);
      openCalendarSourceEditSheet(s, kinds, async () => {
        await refresh();
        await openCalendarSourcesSheet();
      });
    };
    const delBtn = row.querySelector('[data-act="del"]');
    if (delBtn) delBtn.onclick = async () => {
      if (!confirm('Delete this calendar source? Cached events will be removed.')) return;
      try {
        await api('DELETE',`/api/calendar-sources/${id}`);
        await refresh();
        await openCalendarSourcesSheet();
      } catch (e) { alert((e && e.error) || 'Failed'); }
    };
  });

  $('#cs-add').onclick = () => openCalendarSourceEditSheet(null, kinds, async () => {
    await refresh();
    await openCalendarSourcesSheet();
  });
}

// Provider-aware add/edit form. Edit is restricted to display_name,
// color, and enabled (provider / account / calendar / credentials are
// immutable from PATCH — the user can delete + re-add to change those).
function openCalendarSourceEditSheet(src, kinds, afterSave){
  const isEdit = !!src;
  const initialKind = isEdit ? kinds.find(k => k.id === src.provider) : kinds.find(k => !k.disabled);
  const state = {
    provider: initialKind ? initialKind.id : (kinds[0] && kinds[0].id),
    account_id: src ? src.account_id : '',
    calendar_id: src ? src.calendar_id : '',
    base_url: src ? (src.base_url || '') : (initialKind ? (initialKind.baseUrlPlaceholder || '') : ''),
    display_name: src ? (src.display_name || '') : '',
    color: src ? (src.color || '#7c9eb8') : '#7c9eb8',
    enabled: src ? !!src.enabled : true,
    shared: src ? (src.user_id == null) : false,
  };

  function render(){
    const kind = kinds.find(k => k.id === state.provider) || kinds.find(k => !k.disabled);
    if (!kind) {
      openSheet('<h2>No providers available</h2><button class="link" onclick="closeSheet()">Close</button>');
      return;
    }
    const credFields = (kind.credentialFields || []).map(f => {
      const inputType = f.secret ? 'password' : (f.type === 'datetime' ? 'datetime-local' : 'text');
      const ph = f.placeholder ? ` placeholder="${esc(f.placeholder)}"` : '';
      return `<div><label>${esc(f.label)}${f.required ? ' *' : ''}</label>
        <input class="field" type="${inputType}" id="cred-${esc(f.id)}" autocomplete="off"${ph}></div>`;
    }).join('');
    const providerOpts = kinds.filter(k => !k.disabled).map(k =>
      `<button type="button" data-v="${esc(k.id)}" class="${k.id===state.provider?'sel':''}">${esc(k.label)}</button>`
    ).join('');
    const disabledOpts = kinds.filter(k => k.disabled).map(k =>
      `<button type="button" disabled style="opacity:.45">${esc(k.label)} <small>(coming soon)</small></button>`
    ).join('');
    const kindHint = kind.comingSoon ? `<p style="font-size:12px;color:var(--muted);margin-top:6px">${esc(kind.comingSoon)}</p>` : '';

    openSheet(`<h2>${isEdit ? 'Edit calendar source' : 'Add calendar source'}</h2>
      ${isEdit ? '' : `<label>Provider</label><div class="seg" id="prov-seg">${providerOpts}${disabledOpts}</div>${kindHint}`}
      <label>${esc(kind.accountIdLabel || 'Account ID')}</label>
      <input class="field" id="f-acct" value="${esc(state.account_id)}" placeholder="${esc(kind.accountIdPlaceholder || '')}" ${isEdit ? 'readonly style="opacity:.6;cursor:not-allowed"' : ''}>
      <label>${esc(kind.calendarIdLabel || 'Calendar ID')}</label>
      <input class="field" id="f-calid" value="${esc(state.calendar_id)}" placeholder="${esc(kind.calendarIdPlaceholder || '')}" ${isEdit ? 'readonly style="opacity:.6;cursor:not-allowed"' : ''}>
      <label>Base URL ${isEdit ? '' : '(optional)'}</label>
      <input class="field" id="f-base" value="${esc(state.base_url)}" placeholder="${esc(kind.baseUrlPlaceholder || '')}" ${isEdit ? 'readonly style="opacity:.6;cursor:not-allowed"' : ''}>
      <label>Display name</label>
      <input class="field" id="f-name" value="${esc(state.display_name)}" placeholder="Personal, Work, Family…">
      <label>Color</label>
      <input class="field" type="color" id="f-color" value="${esc(state.color)}">
      ${isEdit ? '' : `<h3>Credentials</h3>${credFields}`}
      ${!isEdit && ME && ME.isAdmin ? `<label class="checkbox"><input type="checkbox" id="f-shared" ${state.shared?'checked':''}> Shared (visible to everyone in the household)</label>` : ''}
      ${isEdit ? `<label class="checkbox"><input type="checkbox" id="f-enabled" ${state.enabled?'checked':''}> Enabled (uncheck to pause syncing without deleting)</label>` : ''}
      <button class="btn" style="margin-top:16px" id="f-save">${isEdit ? 'Save' : 'Add it'}</button>
      ${!isEdit ? `<p style="font-size:12px;color:var(--muted);margin-top:10px">Credentials are encrypted with AES-256-GCM (key from <code>CALENDAR_CRED_KEY</code>) and never leave the server.</p>` : ''}
      <button class="link" style="margin-top:14px;width:100%;text-align:center" onclick="openCalendarSourcesSheet()">← Back to sources</button>
      <div class="err" id="f-err"></div>`);

    if (!isEdit) {
      segWire('prov-seg');
      document.querySelectorAll('#prov-seg button[data-v]').forEach(b => {
        b.addEventListener('click', () => {
          state.provider = b.dataset.v;
          const newKind = kinds.find(k => k.id === state.provider);
          if (newKind && newKind.baseUrlPlaceholder && !state.base_url) {
            state.base_url = newKind.baseUrlPlaceholder;
          }
          render();
        }, { once: true });
      });
    }
    $('#f-save').onclick = async () => {
      const body = {
        display_name: $('#f-name').value.trim() || null,
        color: $('#f-color').value,
      };
      if (!isEdit) {
        body.provider = state.provider;
        body.account_id = $('#f-acct').value.trim();
        body.calendar_id = $('#f-calid').value.trim();
        body.base_url = $('#f-base').value.trim() || null;
        if (!body.account_id || !body.calendar_id) {
          $('#f-err').textContent = 'Account ID and Calendar ID are required';
          return;
        }
        const k = kinds.find(k => k.id === state.provider);
        for (const f of (k.credentialFields || [])) {
          const v = $('#cred-' + f.id).value.trim();
          if (f.required && !v) {
            $('#f-err').textContent = f.label + ' is required';
            return;
          }
          if (v) body[f.id] = v;
        }
        if (ME && ME.isAdmin && $('#f-shared').checked) body.shared = true;
      } else {
        body.enabled = $('#f-enabled').checked;
      }
      try {
        if (isEdit) await api('PATCH',`/api/calendar-sources/${src.id}`,body);
        else await api('POST','/api/calendar-sources',body);
        closeSheet();
        if (afterSave) await afterSave();
      } catch (e) { $('#f-err').textContent = (e && e.error) || 'Failed'; }
    };
  }
  render();
}

/* ---- connected agents / token manager (PHA-1896 / PHA-1617.3) ----
//
// Surfaces the /api/agent-tokens endpoints added in PHA-1617.1 (.1 ships
// the schema + routes; this is .3, the user-facing UI).
//
// Design-doc reference: PHA-1617 doc 'meta-agent-socket-design' rev 1,
// §9.1 (User settings UI) — and §4.3 for the REST contract the sheets
// consume. Copy-once plaintext modal follows §4.2 (token format /
// `homestead_pat_<43-char base64url>`).
//
// Three sheets:
//   1. openConnectedAgentsSheet() — top-level list. Shows the user's
//      PAT rows (label, 16-char prefix chip, scopes, created, last_used,
//      revoked state). "+ New token" button opens the issue flow.
//   2. openTokenIssueSheet() — label entry. POSTs to /api/agent-tokens,
//      then opens the copy-once reveal modal with the returned plaintext.
//   3. openTokenRevealSheet(token) — copy-once modal. Plaintext is shown
//      in a dark monospace card with a Copy button. The "I've stored it,
//      close" acknowledge button is enabled only after Copy fires (or the
//      user toggles a checkbox fallback for browsers that block
//      clipboard writes). Closes on acknowledge; the plaintext is gone
//      for good once the modal is dismissed (the server only stored the
//      bcrypt hash).
*/
async function openConnectedAgentsSheet(){
  const tokens = await api('GET','/api/agent-tokens');
  openConnectedAgentsSheetWith(tokens);
}

function openConnectedAgentsSheetWith(tokens){
  const myAdmin = !!(ME && ME.isAdmin);
  const rows = tokens.map(t => {
    const isRevoked = !!t.revoked_at;
    const isExpired = t.expires_at && new Date(t.expires_at + 'Z').getTime() < Date.now();
    const stateChip = isRevoked
      ? '<span class="pill" style="background:var(--muted)">revoked</span>'
      : isExpired
        ? '<span class="pill" style="background:#a78b3a">expired</span>'
        : (t.scopes === 'admin'
            ? '<span class="pill" style="background:var(--accent)">admin</span>'
            : '<span class="pill" style="background:#7c9a72">active</span>');
    const lastUsed = t.last_used_at
      ? `last used ${esc(new Date(t.last_used_at + 'Z').toLocaleString())}`
      : 'never used';
    const expiresAt = t.expires_at
      ? ` · expires ${esc(new Date(t.expires_at + 'Z').toLocaleDateString())}`
      : '';
    const createdAt = t.created_at
      ? `created ${esc(new Date(t.created_at + 'Z').toLocaleDateString())}`
      : '';
    return `<div class="tok-row" data-id="${esc(t.id)}">
      <div class="tok-mark" aria-hidden="true">🔑</div>
      <div class="tok-info">
        <div class="tok-label">${esc(t.label)}${stateChip}</div>
        <div class="tok-meta"><span class="tok-prefix">${esc(t.token_prefix)}…</span> · ${createdAt}${expiresAt}</div>
        <div class="tok-meta">${lastUsed}</div>
      </div>
      <div class="tok-actions">
        ${isRevoked ? '' : `<button class="link danger" data-act="revoke">Revoke</button>`}
      </div>
    </div>`;
  }).join('');

  openSheet(`<h2>Connected agents</h2>
    <p style="font-size:13px;color:var(--muted);margin:-4px 0 14px">Personal access tokens let your own agent (OpenClaw, scripts, anything MCP-speaking) call Homestead with the same powers your session has. The plaintext is shown <b>once</b> at creation &mdash; store it in your password manager. Revoking a token is immediate.</p>
    <div class="tok-list">${rows || '<div class="empty" style="padding:24px 4px">No tokens yet &mdash; mint one to wire up your harness.</div>'}</div>
    <button class="btn" id="tok-add" style="margin-top:14px">+ New token</button>
    <button class="link" style="margin-top:14px;width:100%;text-align:center" onclick="closeSheet()">Done</button>`);

  document.querySelectorAll('.tok-row').forEach(row => {
    const id = row.dataset.id;
    const revokeBtn = row.querySelector('[data-act="revoke"]');
    if (revokeBtn) revokeBtn.onclick = async () => {
      const token = tokens.find(x => String(x.id) === id);
      if (!token) return;
      if (!confirm(`Revoke "${token.label}"?\n\nAny harness using this token will lose access immediately. This cannot be undone.`)) return;
      try {
        await api('DELETE', `/api/agent-tokens/${id}`);
        await openConnectedAgentsSheet();
      } catch (e) {
        alert((e && e.error) || 'Revoke failed');
      }
    };
  });

  $('#tok-add').onclick = () => openTokenIssueSheet(async () => {
    await openConnectedAgentsSheet();
  });
}

function openTokenIssueSheet(afterIssue){
  openSheet(`<h2>New agent token</h2>
    <p style="font-size:13px;color:var(--muted);margin:-4px 0 14px">Pick a label that tells future-you what this token is <em>for</em> (e.g. <code>Laptop OpenClaw</code>, <code>Phone automation</code>, <code>MCP test</code>). The plaintext is shown <b>once</b> on the next screen &mdash; Homestead never stores it.</p>
    <label>Label</label>
    <input class="field" id="tok-label" placeholder="e.g. Laptop OpenClaw" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="64">
    <label>Expires <span style="color:var(--muted);font-weight:500">(optional, ISO 8601 date)</span></label>
    <input class="field" id="tok-expires" type="date" autocomplete="off">
    <button class="btn" id="tok-issue" style="margin-top:14px">Generate token</button>
    <button class="link" style="margin-top:14px;width:100%;text-align:center" onclick="closeSheet()">Cancel</button>
    <div class="err" id="tok-err"></div>`);

  // Suggest a label based on User-Agent / platform (small touch, but
  // shaves a step off the most common case: "Laptop OpenClaw").
  if (!$('#tok-label').value) {
    const guess = platformTokenLabel();
    if (guess) $('#tok-label').value = guess;
  }

  $('#tok-issue').onclick = async () => {
    const label = ($('#tok-label').value || '').trim();
    if (!label) { $('#tok-err').textContent = 'Label is required'; return; }
    if (label.length > 64) { $('#tok-err').textContent = 'Label is too long (max 64 chars)'; return; }
    const expiresRaw = $('#tok-expires').value || '';
    let expires_at = null;
    if (expiresRaw) {
      const d = new Date(expiresRaw + 'T23:59:59');
      if (isNaN(d.getTime())) { $('#tok-err').textContent = 'Invalid expiry date'; return; }
      expires_at = d.toISOString();
    }
    try {
      const issued = await api('POST', '/api/agent-tokens', { label, expires_at });
      // Open the copy-once reveal modal. The label round-trips back so
      // the modal can echo "Stored under: <label>" as a confirmation
      // breadcrumb.
      openTokenRevealSheet({ label: issued.label, token_prefix: issued.token_prefix, token_plaintext: issued.token_plaintext }, async () => {
        if (afterIssue) await afterIssue();
        else closeSheet();
      });
    } catch (e) {
      $('#tok-err').textContent = (e && e.error) || 'Failed to issue token';
    }
  };
}

function openTokenRevealSheet(token, onAcknowledge){
  // Copy-once modal. The plaintext lives in a dark monospace block;
  // the Copy button fires navigator.clipboard.writeText() and toggles a
  // green ✓ for ~2s. The acknowledge button is enabled only after the
  // user has copied OR manually checked the fallback checkbox (covers
  // browsers that block programmatic clipboard writes on insecure
  // origins). Once acknowledged, the modal closes — the plaintext is
  // gone for good (server only stored the bcrypt hash, per design doc
  // §4.1 / §4.2).
  const plaintext = token.token_plaintext || '';
  let copied = false;
  let acknowledged = false;
  openSheet(`<h2>Save your new token</h2>
    <p style="font-size:13px;color:var(--muted);margin:-4px 0 14px">Homestead only stored a hash, so this is the <b>only time</b> you'll see the plaintext. Copy it now into your password manager or paste it into your harness config. Prefix <span class="tok-prefix">${esc(token.token_prefix)}…</span> identifies this row in the list.</p>
    <div class="secret-card" id="tok-secret">
      <div id="tok-secret-text">${esc(plaintext)}</div>
      <div class="copy-row">
        <span class="copied" id="tok-copied">✓ Copied</span>
        <button class="link" id="tok-copy" type="button">Copy</button>
      </div>
    </div>
    <label class="checkbox" style="margin-top:18px"><input type="checkbox" id="tok-ack"> I've stored this token somewhere safe. I understand Homestead cannot show it again.</label>
    <button class="btn" id="tok-done" disabled style="margin-top:10px;opacity:.5">I've stored it &mdash; close</button>
    <button class="link" style="margin-top:14px;width:100%;text-align:center" onclick="closeSheet()">Cancel</button>`);

  const refreshEnabled = () => {
    const ok = copied || ($('#tok-ack') && $('#tok-ack').checked);
    const btn = $('#tok-done');
    btn.disabled = !ok;
    btn.style.opacity = ok ? '1' : '.5';
  };

  const flashCopied = () => {
    const el = $('#tok-copied');
    el.classList.add('on');
    setTimeout(() => el.classList.remove('on'), 2200);
  };

  $('#tok-copy').onclick = async () => {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(plaintext);
      } else {
        // Fallback for older browsers / insecure origins: select the
        // text in the secret block so the user can hit Cmd/Ctrl+C.
        const range = document.createRange();
        range.selectNodeContents($('#tok-secret-text'));
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }
      copied = true;
      flashCopied();
      refreshEnabled();
    } catch (e) {
      // Clipboard rejected (permission denied / insecure origin).
      // User can still tick the ack checkbox to proceed.
      alert('Clipboard write blocked — please select the text manually or tick the acknowledgement below.');
    }
  };

  $('#tok-ack').addEventListener('change', refreshEnabled);

  $('#tok-done').onclick = async () => {
    acknowledged = true;
    if (onAcknowledge) await onAcknowledge();
    else closeSheet();
  };
}

// Best-effort label guess based on UA hints. Just a tiny UX touch —
// keeps the field empty if no guess fits.
function platformTokenLabel(){
  try {
    const ua = (navigator.userAgent || '').toLowerCase();
    const plat = (navigator.platform || '').toLowerCase();
    if (/iphone|ipad|ipod/.test(ua)) return 'iPhone';
    if (/android/.test(ua)) return 'Android phone';
    if (/mac/.test(plat)) return 'Mac';
    if (/win/.test(plat)) return 'Windows';
    if (/linux/.test(plat)) return 'Linux';
    if (/cros/.test(ua)) return 'Chromebook';
  } catch {}
  return '';
}
