<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Homestead</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#FFFBF5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFBF5; --surface:#FFFFFF; --ink:#2B2622; --muted:#8A8177;
  --line:rgba(43,38,34,.07);
  --u-all:#9eb48a;
  --accent:#C4703C; --accent-soft:#F8E9DE;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}

/* ---------- login ---------- */
#login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:380px;background:var(--surface);border-radius:28px;padding:8px;
  box-shadow:0 8px 40px rgba(196,112,60,.08),0 2px 8px rgba(0,0,0,.03)}
.login-inner{border:1px solid var(--line);border-radius:22px;padding:40px 32px;text-align:center}
.logo{font-size:44px;line-height:1}
h1{font-weight:800;font-size:26px;letter-spacing:-.02em;margin:14px 0 4px}
.sub{color:var(--muted);font-size:14px;margin-bottom:28px}
.field{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--bg);
  margin-bottom:12px;outline:none;transition:border-color .3s var(--ease)}
.field:focus{border-color:var(--accent)}
.chips{display:none;gap:8px;margin-bottom:14px;flex-wrap:wrap;justify-content:center}
.chips.on{display:flex}
.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--line);font-weight:600;font-size:13px;
  display:flex;align-items:center;gap:7px;transition:all .25s var(--ease)}
.chip:active{transform:scale(.95)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--chip-c,#999)}
.chip-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  font-weight:700;width:100%;text-align:center;margin-bottom:-2px}
.btn{width:100%;padding:15px;border-radius:16px;background:var(--accent);color:#fff;font-weight:700;
  transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.btn:active{transform:scale(.97)}
.btn-secondary{background:var(--ink);color:#fff}
.err{color:#b3453a;font-size:13px;min-height:18px;margin-top:10px}

/* ---------- app shell ---------- */
#app{display:none;min-height:100dvh;padding-bottom:96px}
header{padding:calc(env(safe-area-inset-top) + 22px) 22px 6px;display:flex;justify-content:space-between;align-items:center}
.greet{font-weight:800;font-size:24px;letter-spacing:-.02em}
.greet small{display:block;font-size:13px;color:var(--muted);font-weight:500;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.12)}
main{padding:14px 18px;max-width:680px;margin:0 auto}
.page{display:none;animation:rise .5s var(--ease)}
.page.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.card{background:var(--surface);border-radius:22px;padding:6px;margin-bottom:14px;
  box-shadow:0 6px 30px rgba(0,0,0,.035)}
.card-in{border:1px solid var(--line);border-radius:17px;padding:18px}
.sec{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:20px 4px 10px}

/* tasks */
.task{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:none}
.chk{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;
  transition:all .35s var(--ease)}
.task.done .chk{background:var(--u-all);border-color:var(--u-all)}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.t-body{flex:1;min-width:0}
.t-title{font-weight:600;font-size:15px}
.t-meta{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-top:2px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.overdue{color:#b3453a;font-weight:600}
.x{color:var(--muted);font-size:18px;padding:6px;opacity:.5}

/* calendar */
.cal-head{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 12px}
.cal-head b{font-size:17px;letter-spacing:-.01em}
.cal-nav{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);font-size:16px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:10px;color:var(--muted);font-weight:700;padding:4px 0;text-transform:uppercase}
.day{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;gap:3px;transition:background .3s var(--ease)}
.day.dim{color:#cfc8bf}
.day.today{background:var(--accent-soft);color:var(--accent)}
.day.sel{background:var(--ink);color:#fff}
.pips{display:flex;gap:2px;height:5px}
.pip{width:5px;height:5px;border-radius:50%}
.ev{display:flex;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);align-items:center}
.ev:last-child{border-bottom:none}
.ev-time{font-size:12px;font-weight:700;color:var(--muted);width:52px;flex-shrink:0}
.ev-bar{width:4px;height:34px;border-radius:2px;flex-shrink:0}

/* services */
.svc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.svc{background:var(--surface);border-radius:20px;padding:5px;box-shadow:0 6px 24px rgba(0,0,0,.035);
  text-decoration:none;color:inherit;transition:transform .4s var(--ease);position:relative}
.svc:active{transform:scale(.96)}
.svc-in{border:1px solid var(--line);border-radius:16px;padding:18px 16px}
.svc-icon{font-size:28px}
.svc-name{font-weight:700;margin-top:10px;font-size:15px}
.svc-desc{font-size:12px;color:var(--muted);margin-top:2px}

/* fab + tabbar */
#fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 88px);width:56px;height:56px;
  border-radius:20px;background:var(--accent);color:#fff;font-size:26px;font-weight:400;
  box-shadow:0 10px 30px rgba(196,112,60,.35);transition:transform .35s var(--ease);z-index:40}
#fab:active{transform:scale(.92) rotate(90deg)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;
  padding:10px 16px calc(env(safe-area-inset-bottom) + 12px);
  background:rgba(255,251,245,.85);backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:30}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;
  color:var(--muted);padding:4px 14px;border-radius:14px;transition:color .3s var(--ease)}
nav button.on{color:var(--accent)}
nav .ico{font-size:20px}

/* modal */
#modal{position:fixed;inset:0;background:rgba(43,38,34,.4);display:none;align-items:flex-end;
  justify-content:center;z-index:50;backdrop-filter:blur(4px)}
#modal.on{display:flex}
.sheet{background:var(--bg);border-radius:26px 26px 0 0;width:100%;max-width:680px;
  padding:26px 22px calc(env(safe-area-inset-bottom) + 26px);animation:up .45s var(--ease);max-height:90dvh;overflow-y:auto}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-size:19px;font-weight:800;letter-spacing:-.01em;margin-bottom:18px}
.sheet h3{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  margin:18px 0 8px}
.row{display:flex;gap:10px}.row>*{flex:1}
label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin:12px 0 6px}
.checkbox{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);font-weight:500;cursor:pointer}
.checkbox input{width:18px;height:18px;accent-color:var(--accent)}

/* segmented control with color dot per option */
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;padding:9px 6px;border-radius:10px;font-weight:600;font-size:13px;color:var(--muted);
  display:flex;align-items:center;justify-content:center;gap:6px;transition:all .3s var(--ease);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button .pd{width:8px;height:8px;border-radius:50%;background:var(--pd,#999);flex-shrink:0}
.seg button.sel{background:var(--pd,var(--ink));color:#fff}
.seg button.sel .pd{box-shadow:0 0 0 1.5px rgba(255,255,255,.85)}

.link{color:var(--accent);font-weight:700;font-size:14px}
.link.danger{color:#b3453a}
.empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:14px}
.empty span{font-size:30px;display:block;margin-bottom:8px}

/* settings sheet: user list */
.user-list{display:flex;flex-direction:column;gap:10px}
.user-row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface);
  border:1px solid var(--line);border-radius:14px}
.user-row .ucolor{width:36px;height:36px;border-radius:50%;background:var(--uc,#999);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.user-row .uinfo{flex:1;min-width:0}
.user-row .udisp{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.user-row .uuname{font-size:12px;color:var(--muted);margin-top:1px}
.user-row .uactions{display:flex;gap:8px;flex-shrink:0}
.user-row .uactions button{font-size:13px;padding:6px 10px}
.badge{display:inline-block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  background:var(--accent-soft);color:var(--accent);padding:2px 6px;border-radius:6px;font-weight:700}

/* full-screen app shell */
#shell{position:fixed;inset:0;z-index:100;background:#000;display:none}
#shell.on{display:block}
#shellFrame{width:100%;height:100dvh;border:none;background:#111}
#dot{position:fixed;width:46px;height:46px;border-radius:50%;z-index:110;
  background:rgba(43,38,34,.55);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.25);
  display:none;align-items:center;justify-content:center;font-size:19px;color:#fff;
  box-shadow:0 6px 20px rgba(0,0,0,.35);touch-action:none;user-select:none;
  transition:opacity .3s var(--ease)}
#dot.on{display:flex}
#dot.idle{opacity:.45}
.svc-owner{position:absolute;top:10px;right:10px;width:9px;height:9px;border-radius:50%}
.showall{font-size:12px;font-weight:600;color:var(--muted)}
@media(min-width:768px){.svc-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>

<div id="login">
  <div class="login-card"><div class="login-inner">
    <div class="logo">🏡</div>
    <h1>Homestead</h1>
    <div class="sub">The household, in one place</div>
    <div class="chips" id="chipRow"></div>
    <input class="field" id="username" type="text" placeholder="Username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
    <input class="field" id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="loginBtn">Come on in</button>
    <div class="err" id="loginErr"></div>
  </div></div>
</div>

<div id="app">
  <header>
    <div class="greet"><small id="dateLine"></small><span id="greet"></span></div>
    <button class="avatar" id="avatarBtn"></button>
  </header>
  <main>
    <div class="page" id="page-home">
      <div class="sec">Today</div>
      <div class="card"><div class="card-in" id="todayEvents"></div></div>
      <div class="sec">On the list</div>
      <div class="card"><div class="card-in" id="todayTasks"></div></div>
    </div>
    <div class="page" id="page-tasks">
      <div class="sec">To do</div>
      <div class="card"><div class="card-in" id="openTasks"></div></div>
      <div class="sec">Done</div>
      <div class="card"><div class="card-in" id="doneTasks"></div></div>
    </div>
    <div class="page" id="page-cal">
      <div class="card"><div class="card-in">
        <div class="cal-head">
          <button class="cal-nav" id="calPrev">‹</button><b id="calTitle"></b><button class="cal-nav" id="calNext">›</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div></div>
      <div class="sec" id="selDayLabel"></div>
      <div class="card"><div class="card-in" id="dayEvents"></div></div>
    </div>
    <div class="page" id="page-svc">
      <div class="sec" style="display:flex;justify-content:space-between;align-items:center">
        <span>Apps <button class="showall" id="showAll">· showing mine</button></span>
        <button class="link" id="addSvc">+ Add</button></div>
      <div class="svc-grid" id="svcGrid"></div>
    </div>
  </main>
  <button id="fab">+</button>
  <nav>
    <button data-p="home" class="on"><span class="ico">🏡</span>Home</button>
    <button data-p="tasks"><span class="ico">✓</span>Tasks</button>
    <button data-p="cal"><span class="ico">📅</span>Calendar</button>
    <button data-p="svc"><span class="ico">🛰️</span>Apps</button>
  </nav>
</div>

<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="shell"><iframe id="shellFrame" src="about:blank" allow="fullscreen; autoplay; clipboard-write"></iframe></div>
<div id="dot">🏡</div>

<script>
const $=s=>document.querySelector(s);
const api=async(m,u,b)=>{const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined,sameSite:'lax'});if(!r.ok){let e;try{e=await r.json()}catch{failed:e=await r.text().catch(()=>r.status+'');throw{error:failed||('HTTP '+r.status)}}throw e}return r.json()};

/* ---- state ---- */
let ME=null, USERS={};
let TASKS=[],EVENTS=[],SVCS=[];
let calY,calM,selDate=today();

function today(){const d=new Date();return d.toISOString().slice(0,10)}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(s){const d=new Date(s+'T00:00:00');return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}

/* ---- user helpers (generic N-user) ---- */
function userName(u){
  if(u==='all'||!u)return 'Everyone';
  return (USERS[u]&&USERS[u].display)||u;
}
function userColorVar(u){
  if(u==='all'||!u)return 'var(--u-all)';
  return `var(--u-${u})`;
}
function userColorRaw(u){
  if(u==='all'||!u)return '#9eb48a';
  return (USERS[u]&&USERS[u].color)||'#999';
}
function userInitials(u){
  const d=USERS[u]&&USERS[u].display||u;
  return d.trim()[0].toUpperCase();
}
function buildUserCssVars(){
  const r=document.documentElement;
  r.style.setProperty('--u-all','#9eb48a');
  Object.values(USERS).forEach(u=>{
    r.style.setProperty(`--u-${u.username}`, u.color);
  });
}

const LS_KEY='homestead_users_v1';
function loadUsersFromCache(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(!raw)return;
    const list=JSON.parse(raw);
    USERS={};
    list.forEach(u=>{USERS[u.username]={username:u.username,display:u.display,color:u.color,isAdmin:!!u.isAdmin}});
    buildUserCssVars();
  }catch{}
}
function saveUsersToCache(){
  try{
    const list=Object.values(USERS).map(u=>({username:u.username,display:u.display,color:u.color,isAdmin:u.isAdmin}));
    localStorage.setItem(LS_KEY, JSON.stringify(list));
  }catch{}
}
async function refreshUsersFromServer(){
  try{
    const list=await api('GET','/api/users');
    USERS={};
    list.forEach(u=>{USERS[u.username]={username:u.username,display:u.display,color:u.color,isAdmin:!!u.is_admin}});
    buildUserCssVars();
    saveUsersToCache();
  }catch(e){
    // 401 on /api/users before login is fine; just keep cache
  }
}

/* ---- login ---- */
loadUsersFromCache();
renderLoginChips();
$('#loginBtn').onclick=doLogin;
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
$('#username').addEventListener('keydown',e=>{if(e.key==='Enter'){$('#pw').focus();}});
async function doLogin(){
  const u=$('#username').value.trim();
  const p=$('#pw').value;
  if(!u){$('#loginErr').textContent='Username required';return}
  try{const r=await api('POST','/api/login',{username:u,password:p});boot(r.user)}
  catch(e){$('#loginErr').textContent=(e&&e.error)||'Login failed'}
}
function renderLoginChips(){
  const row=$('#chipRow');
  const users=Object.values(USERS).sort((a,b)=>a.username.localeCompare(b.username));
  if(!users.length){row.classList.remove('on');row.innerHTML='';return}
  row.classList.add('on');
  row.innerHTML='<div class="chip-label">Quick pick</div>'+users.map(u=>
    `<button type="button" class="chip" data-u="${esc(u.username)}" style="--chip-c:${esc(u.color)}">
       <span class="dot"></span>${esc(u.display)}
     </button>`).join('');
  row.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
    $('#username').value=b.dataset.u;
    $('#pw').focus();
  });
}

/* ---- boot ---- */
async function boot(user){
  ME=user;$('#login').style.display='none';$('#app').style.display='block';
  const h=new Date().getHours();
  $('#greet').textContent=(h<12?'Morning':h<17?'Afternoon':'Evening')+', '+user.display;
  $('#dateLine').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  const a=$('#avatarBtn');a.textContent=userInitials(user.username);a.style.background=userColorRaw(user.username);
  const d=new Date();calY=d.getFullYear();calM=d.getMonth();
  await refreshUsersFromServer();
  await refresh();
}
async function refresh(){
  [TASKS,EVENTS,SVCS]=await Promise.all([api('GET','/api/tasks'),api('GET','/api/events'),api('GET','/api/services')]);
  renderHome();renderTasks();renderCal();renderSvcs();
}

/* ---- rendering ---- */
function taskRow(t){
  const od=t.due_date&&!t.done&&t.due_date<today();
  return `<div class="task ${t.done?'done':''}">
    <button class="chk" onclick="toggleTask(${t.id})">${t.done?'✓':''}</button>
    <div class="t-body" onclick="openTaskSheet(${t.id})">
      <div class="t-title">${esc(t.title)}${t.recur?' 🔁':''}</div>
      <div class="t-meta">
        <span class="dot" style="background:${userColorVar(t.assignee)}"></span>${esc(userName(t.assignee))}
        ${t.alt_assignee?`<span class="dot" style="background:${userColorVar(t.alt_assignee)};opacity:.55"></span><span>↔ ${esc(userName(t.alt_assignee))}</span>`:''}
        ${t.due_date?`<span class="${od?'overdue':''}">${od?'⚠ ':''}${fmtDate(t.due_date)}</span>`:''}
      </div>
    </div>
    <button class="x" onclick="delTask(${t.id})">✕</button></div>`;
}
function renderHome(){
  const evs=EVENTS.filter(e=>e.date===today());
  $('#todayEvents').innerHTML=evs.length?evs.map(evRow).join(''):`<div class="empty"><span>☀️</span>Nothing on the calendar today</div>`;
  const due=TASKS.filter(t=>!t.done&&(!t.due_date||t.due_date<=today()));
  $('#todayTasks').innerHTML=due.length?due.map(taskRow).join(''):`<div class="empty"><span>🎉</span>All caught up</div>`;
}
function renderTasks(){
  const open=TASKS.filter(t=>!t.done),done=TASKS.filter(t=>t.done);
  $('#openTasks').innerHTML=open.length?open.map(taskRow).join(''):`<div class="empty"><span>🌿</span>Nothing to do. Suspicious.</div>`;
  $('#doneTasks').innerHTML=done.length?done.map(taskRow).join(''):`<div class="empty">Nothing done yet</div>`;
}
function evRow(e){
  return `<div class="ev" onclick="openEventSheet(${e.id})">
    <div class="ev-time">${e.time||'all day'}</div>
    <div class="ev-bar" style="background:${userColorVar(e.owner)}"></div>
    <div class="t-body"><div class="t-title">${esc(e.title)}</div>
    ${e.notes?`<div class="t-meta">${esc(e.notes)}</div>`:''}</div>
    <button class="x" onclick="event.stopPropagation();delEvent(${e.id})">✕</button></div>`;
}
function renderCal(){
  const first=new Date(calY,calM,1),start=first.getDay(),dim=new Date(calY,calM+1,0).getDate();
  $('#calTitle').textContent=first.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  let html=['S','M','T','W','T','F','S'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<start;i++)html+=`<div class="day dim"></div>`;
  for(let d=1;d<=dim;d++){
    const ds=`${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs=EVENTS.filter(e=>e.date===ds);
    const cls=ds===selDate?'sel':ds===today()?'today':'';
    html+=`<div class="day ${cls}" onclick="pickDay('${ds}')">${d}
      <div class="pips">${evs.slice(0,3).map(e=>`<span class="pip" style="background:${userColorVar(e.owner)}"></span>`).join('')}</div></div>`;
  }
  $('#calGrid').innerHTML=html;
  $('#selDayLabel').textContent=fmtDate(selDate);
  const evs=EVENTS.filter(e=>e.date===selDate);
  $('#dayEvents').innerHTML=evs.length?evs.map(evRow).join(''):`<div class="empty">Free day</div>`;
}
function pickDay(ds){selDate=ds;renderCal()}
$('#calPrev').onclick=()=>{calM--;if(calM<0){calM=11;calY--}renderCal()};
$('#calNext').onclick=()=>{calM++;if(calM>11){calM=0;calY++}renderCal()};
let showAll=false;
function renderSvcs(){
  const mine=SVCS.filter(s=>showAll||!s.owner||s.owner==='all'||s.owner===ME.username);
  $('#showAll').textContent=showAll?'· showing all':'· showing mine';
  $('#svcGrid').innerHTML=mine.map(s=>`
    <a class="svc" href="${esc(s.url)}" onclick="return launchSvc(event,${s.id})"
       oncontextmenu="event.preventDefault();openSvcSheet(${s.id})">
      <span class="svc-owner" style="background:${userColorVar(s.owner)}"></span>
      <div class="svc-in"><div class="svc-icon">${s.icon||'🔗'}</div>
      <div class="svc-name">${esc(s.name)}</div><div class="svc-desc">${esc(s.descr)}&nbsp;</div></div></a>`).join('');
}
function launchSvc(ev,id){
  const s=SVCS.find(x=>x.id===id);
  if(!s)return false;
  if(s.open_mode==='tab'){ev.preventDefault();window.open(s.url,'_blank');return false}
  ev.preventDefault();openShell(s.url);return false;
}

/* ---- full-screen app shell + escape dot ---- */
const dot=$('#dot');
let dotIdleTimer;
function openShell(url){
  $('#shellFrame').src=url;
  $('#shell').classList.add('on');dot.classList.add('on');dot.classList.remove('idle');
  dot.style.left='';dot.style.top='';dot.style.right='14px';dot.style.bottom='calc(env(safe-area-inset-bottom) + 24px)';
  clearTimeout(dotIdleTimer);dotIdleTimer=setTimeout(()=>dot.classList.add('idle'),2500);
}
function closeShell(){
  $('#shell').classList.remove('on');dot.classList.remove('on');
  $('#shellFrame').src='about:blank';
}
let drag=null;
dot.addEventListener('pointerdown',e=>{
  dot.setPointerCapture(e.pointerId);dot.classList.remove('idle');clearTimeout(dotIdleTimer);
  drag={x:e.clientX,y:e.clientY,ox:dot.offsetLeft,oy:dot.offsetTop,moved:false};
});
dot.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(Math.abs(dx)+Math.abs(dy)>6)drag.moved=true;
  dot.style.right='auto';dot.style.bottom='auto';
  dot.style.left=Math.max(4,Math.min(innerWidth-50,drag.ox+dx))+'px';
  dot.style.top=Math.max(4,Math.min(innerHeight-50,drag.oy+dy))+'px';
});
dot.addEventListener('pointerup',e=>{
  const wasTap=drag&&!drag.moved;drag=null;
  if(wasTap){closeShell();return}
  const snapLeft=dot.offsetLeft+23<innerWidth/2;
  dot.style.left=snapLeft?'8px':(innerWidth-54)+'px';
  dotIdleTimer=setTimeout(()=>dot.classList.add('idle'),2500);
});
$('#showAll').onclick=()=>{showAll=!showAll;renderSvcs()};

/* ---- actions ---- */
async function toggleTask(id){await api('POST',`/api/tasks/${id}/toggle`);await refresh()}
async function delTask(id){if(confirm('Delete this task?')){await api('DELETE',`/api/tasks/${id}`);await refresh()}}
async function delEvent(id){if(confirm('Delete this event?')){await api('DELETE',`/api/events/${id}`);await refresh()}}

/* ---- navigation ---- */
let curPage='home';
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  curPage=b.dataset.p;$('#page-'+curPage).classList.add('on');
});
$('#page-home').classList.add('on');

/* ---- sheets ---- */
function openSheet(html){$('#sheet').innerHTML=html;$('#modal').classList.add('on')}
function closeSheet(){$('#modal').classList.remove('on')}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeSheet()};

/* Generic user picker: Everyone + every USERS entry, with color dot per option.
   Selection: the picked button's background becomes the user's color. */
function userPickerHtml(id, sel){
  const opts=[['all','Everyone','#9eb48a']];
  Object.values(USERS).sort((a,b)=>a.username.localeCompare(b.username))
    .forEach(u=>opts.push([u.username, u.display, u.color]));
  return `<div class="seg" id="${id}">${opts.map(([v,label,color])=>
    `<button type="button" data-v="${esc(v)}" class="${v===sel?'sel':''}" style="--pd:${esc(color)}"><span class="pd"></span>${esc(label)}</button>`
  ).join('')}</div>`;
}
function segWire(id){
  document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
  });
}
function segVal(id){return document.querySelector('#'+id+' .sel')?.dataset.v}

/* Repeats picker (reused, no per-user colors). */
function recurPickerHtml(id, sel){
  const opts=[['','No'],['daily','Daily'],['weekly','Weekly'],['monthly','Monthly']];
  return `<div class="seg" id="${id}">${opts.map(([v,label])=>
    `<button type="button" data-v="${esc(v)}" class="${v===(sel||'')?'sel':''}">${label}</button>`
  ).join('')}</div>`;
}
/* Open-mode picker (reused). */
function modePickerHtml(id, sel){
  const opts=[['frame','Full screen'],['tab','New tab']];
  return `<div class="seg" id="${id}">${opts.map(([v,label])=>
    `<button type="button" data-v="${esc(v)}" class="${v===(sel||'frame')?'sel':''}">${label}</button>`
  ).join('')}</div>`;
}

$('#fab').onclick=()=>{
  if(curPage==='svc')return openSvcSheet();
  if(curPage==='cal')return openEventSheet(null,selDate);
  if(curPage==='home')return openPicker();
  openTaskSheet();
};
function openPicker(){
  openSheet(`<h2>Add something</h2>
  <div class="row"><button class="btn" onclick="closeSheet();openTaskSheet()">✓ Task</button>
  <button class="btn btn-secondary" onclick="closeSheet();openEventSheet()">📅 Event</button></div>`);
}
function openTaskSheet(id){
  const t=TASKS.find(x=>x.id===id)||{title:'',notes:'',assignee:'all',alt_assignee:null,due_date:'',recur:'',rotate:0};
  const altSel=t.rotate?(t.alt_assignee||'all'):null;
  openSheet(`<h2>${id?'Edit task':'New task'}</h2>
    <input class="field" id="f-title" placeholder="What needs doing?" value="${esc(t.title)}">
    <label>Whose is it?</label>${userPickerHtml('f-who', t.assignee||'all')}
    <div id="f-alt-wrap" style="display:${t.rotate?'block':'none'}">
      <label>Then swaps to</label>${userPickerHtml('f-alt', altSel||'all')}
    </div>
    <div class="row"><div><label>Due</label><input class="field" type="date" id="f-due" value="${t.due_date||''}"></div>
    <div><label>Repeats</label>${recurPickerHtml('f-recur', t.recur||'')}</div></div>
    <label class="checkbox"><input type="checkbox" id="f-rotate" ${t.rotate?'checked':''}> Take turns (swap each time it comes up)</label>
    <input class="field" id="f-notes" placeholder="Notes (optional)" value="${esc(t.notes)}" style="margin-top:12px">
    <button class="btn" style="margin-top:16px" id="f-save">${id?'Save':'Add it'}</button>`);
  segWire('f-who');segWire('f-alt');segWire('f-recur');
  const updateAlt=()=>{
    $('#f-alt-wrap').style.display=$('#f-rotate').checked?'block':'none';
  };
  $('#f-rotate').addEventListener('change',updateAlt);
  $('#f-save').onclick=async()=>{
    const body={title:$('#f-title').value.trim(),notes:$('#f-notes').value,assignee:segVal('f-who'),
      alt_assignee:$('#f-rotate').checked?(segVal('f-alt')||null):null,
      due_date:$('#f-due').value||null,recur:segVal('f-recur')||null,rotate:$('#f-rotate').checked?1:0};
    if(!body.title)return;
    try{
      if(id)await api('PUT',`/api/tasks/${id}`,body);else await api('POST','/api/tasks',body);
      closeSheet();await refresh();
    }catch(e){$('#f-save').textContent=(e&&e.error)||'Failed';setTimeout(()=>{$('#f-save').textContent=id?'Save':'Add it'},1500)}
  };
}
function openEventSheet(id,date){
  const e=EVENTS.find(x=>x.id===id)||{title:'',date:date||today(),time:'',notes:'',owner:'all'};
  openSheet(`<h2>${id?'Edit event':'New event'}</h2>
    <input class="field" id="f-title" placeholder="What's happening?" value="${esc(e.title)}">
    <div class="row"><div><label>Date</label><input class="field" type="date" id="f-date" value="${e.date}"></div>
    <div><label>Time</label><input class="field" type="time" id="f-time" value="${e.time||''}"></div></div>
    <label>Whose?</label>${userPickerHtml('f-own', e.owner||'all')}
    <input class="field" id="f-notes" placeholder="Notes (optional)" value="${esc(e.notes)}" style="margin-top:12px">
    <button class="btn" style="margin-top:16px" id="f-save">${id?'Save':'Add it'}</button>`);
  segWire('f-own');
  $('#f-save').onclick=async()=>{
    const body={title:$('#f-title').value.trim(),date:$('#f-date').value,time:$('#f-time').value,
      notes:$('#f-notes').value,owner:segVal('f-own')||'all'};
    if(!body.title||!body.date)return;
    try{
      if(id)await api('PUT',`/api/events/${id}`,body);else await api('POST','/api/events',body);
      closeSheet();await refresh();
    }catch(e){$('#f-save').textContent=(e&&e.error)||'Failed';setTimeout(()=>{$('#f-save').textContent=id?'Save':'Add it'},1500)}
  };
}
function openSvcSheet(id){
  const s=SVCS.find(x=>x.id===id)||{name:'',url:'',icon:'🔗',descr:'',owner:'all',open_mode:'frame'};
  openSheet(`<h2>${id?'Edit app':'Add an app'}</h2>
    <div class="row"><input class="field" id="f-icon" placeholder="🔗" value="${esc(s.icon||'🔗')}" style="flex:0 0 70px;text-align:center">
    <input class="field" id="f-name" placeholder="Name" value="${esc(s.name)}"></div>
    <input class="field" id="f-url" placeholder="https://…" value="${esc(s.url)}">
    <input class="field" id="f-descr" placeholder="Short description" value="${esc(s.descr||'')}">
    <label>Whose app?</label>${userPickerHtml('f-owner', s.owner||'all')}
    <label>Opens</label>${modePickerHtml('f-mode', s.open_mode||'frame')}
    <button class="btn" style="margin-top:16px" id="f-save">${id?'Save':'Add it'}</button>
    ${id?`<button class="link danger" style="margin-top:14px;width:100%" onclick="delSvc(${id})">Remove app</button>`:''}`);
  segWire('f-owner');segWire('f-mode');
  $('#f-save').onclick=async()=>{
    const body={name:$('#f-name').value.trim(),url:$('#f-url').value.trim(),icon:$('#f-icon').value||'🔗',descr:$('#f-descr').value,
      owner:segVal('f-owner')||'all',open_mode:segVal('f-mode')||'frame'};
    if(!body.name||!body.url)return;
    try{
      if(id)await api('PUT',`/api/services/${id}`,body);else await api('POST','/api/services',body);
      closeSheet();await refresh();
    }catch(e){$('#f-save').textContent=(e&&e.error)||'Failed';setTimeout(()=>{$('#f-save').textContent=id?'Save':'Add it'},1500)}
  };
}
async function delSvc(id){if(confirm('Remove this service?')){await api('DELETE',`/api/services/${id}`);closeSheet();await refresh()}}
$('#addSvc').onclick=()=>openSvcSheet();

/* ---- avatar menu / settings ---- */
$('#avatarBtn').onclick=()=>{
  const isAdmin=!!(ME&&ME.isAdmin);
  openSheet(`<h2>${esc(ME.display)}</h2>
    ${isAdmin?`<button class="link" style="display:block;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--line)" id="f-settings">⚙️ Settings · manage household</button>`:''}
    <h3>Change your password</h3>
    <input class="field" type="password" id="f-cur" placeholder="Current password" autocomplete="current-password">
    <input class="field" type="password" id="f-new" placeholder="New password" autocomplete="new-password">
    <button class="btn" id="f-pw">Update password</button>
    <button class="link" style="margin-top:16px;width:100%;text-align:center" id="f-out">Log out</button>
    <div class="err" id="f-err"></div>`);
  if(isAdmin){
    $('#f-settings').onclick=()=>openSettingsSheet();
  }
  $('#f-pw').onclick=async()=>{
    try{await api('POST','/api/password',{current:$('#f-cur').value,next:$('#f-new').value});closeSheet()}
    catch(e){$('#f-err').textContent=(e&&e.error)||'Failed'}
  };
  $('#f-out').onclick=async()=>{await api('POST','/api/logout');location.reload()};
};

/* ---- settings sheet (admin) ---- */
function openSettingsSheet(){
  if(!ME||!ME.isAdmin){
    // Non-admin: only password change (already on avatar sheet)
    return;
  }
  const users=Object.values(USERS).sort((a,b)=>{
    if((b.isAdmin?1:0)!==(a.isAdmin?1:0))return(b.isAdmin?1:0)-(a.isAdmin?1:0);
    return a.username.localeCompare(b.username);
  });
  const listHtml=users.map(u=>`
    <div class="user-row" data-u="${esc(u.username)}" style="--uc:${esc(u.color)}">
      <div class="ucolor">${esc((u.display||u.username)[0].toUpperCase())}</div>
      <div class="uinfo">
        <div class="udisp">${esc(u.display)}${u.isAdmin?' <span class="badge">admin</span>':''}</div>
        <div class="uuname">@${esc(u.username)}</div>
      </div>
      <div class="uactions">
        <button class="link" data-act="edit">Edit</button>
        ${u.username===ME.username?'':`<button class="link danger" data-act="del">Delete</button>`}
      </div>
    </div>`).join('');

  openSheet(`<h2>Settings</h2>
    <h3>Household members</h3>
    <div class="user-list">${listHtml||'<div class="empty">No users yet</div>'}</div>
    <h3>Add user</h3>
    <input class="field" id="f-newuser" placeholder="Username (a-z, 0-9, _, -)" autocapitalize="none" autocorrect="off" spellcheck="false">
    <input class="field" id="f-newdisplay" placeholder="Display name">
    <div class="row"><input class="field" type="password" id="f-newpass" placeholder="Password (4+ chars)" style="flex:2">
    <input class="field" type="color" id="f-newcolor" value="#7c9a72" style="flex:1;padding:6px"></div>
    <button class="btn" id="f-add">+ Add user</button>
    <div class="err" id="f-err"></div>
    <button class="link" style="margin-top:18px;width:100%;text-align:center" onclick="closeSheet()">Done</button>`);

  document.querySelectorAll('.user-row').forEach(row=>{
    const username=row.dataset.u;
    const editBtn=row.querySelector('[data-act="edit"]');
    if(editBtn)editBtn.onclick=()=>openUserEditSheet(username);
    const delBtn=row.querySelector('[data-act="del"]');
    if(delBtn)delBtn.onclick=async()=>{
      if(!confirm(`Delete @${username}? Tasks and events assigned to them will be reassigned to Everyone.`))return;
      try{
        await api('DELETE',`/api/users/${username}`);
        await refreshUsersFromServer();
        await refresh();
        openSettingsSheet();
      }catch(e){alert((e&&e.error)||'Failed')}
    };
  });

  $('#f-add').onclick=async()=>{
    const body={
      username:$('#f-newuser').value,
      display:$('#f-newdisplay').value,
      password:$('#f-newpass').value,
      color:$('#f-newcolor').value
    };
    try{
      await api('POST','/api/users',body);
      await refreshUsersFromServer();
      await refresh();
      renderLoginChips();
      openSettingsSheet();
    }catch(e){$('#f-err').textContent=(e&&e.error)||'Failed'}
  };
}

function openUserEditSheet(username){
  const u=USERS[username];
  if(!u)return;
  const isSelf=ME&&ME.username===username;
  openSheet(`<h2>${isSelf?'Your account':'Edit @'+esc(username)}</h2>
    <h3>Display</h3>
    <input class="field" id="f-display" placeholder="Display name" value="${esc(u.display)}">
    <div class="row"><div><label>Color</label><input class="field" type="color" id="f-color" value="${esc(u.color)}"></div></div>
    <button class="btn" id="f-save" style="margin-top:6px">Save changes</button>
    <h3>Password</h3>
    ${isSelf?`<input class="field" type="password" id="f-curpw" placeholder="Current password" autocomplete="current-password">`:''}
    <input class="field" type="password" id="f-newp" placeholder="New password" autocomplete="new-password">
    <button class="link" id="f-resetpw" style="margin-top:10px;width:100%;text-align:center">
      ${isSelf?'Change my password':'Reset password (admin override)'}
    </button>
    <div class="err" id="f-err"></div>
    <button class="link" style="margin-top:14px;width:100%;text-align:center" onclick="openSettingsSheet()">← Back to settings</button>`);

  $('#f-save').onclick=async()=>{
    try{
      await api('PUT',`/api/users/${username}`,{display:$('#f-display').value,color:$('#f-color').value});
      await refreshUsersFromServer();
      await refresh();
      renderLoginChips();
      openUserEditSheet(username);
    }catch(e){$('#f-err').textContent=(e&&e.error)||'Failed'}
  };
  $('#f-resetpw').onclick=async()=>{
    const next=$('#f-newp').value;
    if(!next||next.length<4){$('#f-err').textContent='Password must be 4+ characters';return}
    try{
      const body={next};
      if(isSelf){
        const cur=$('#f-curpw')?.value||'';
        if(!cur){$('#f-err').textContent='Current password required';return}
        body.current=cur;
      }
      await api('POST',`/api/users/${username}/password`,body);
      $('#f-newp').value='';
      if(isSelf)$('#f-curpw').value='';
      $('#f-err').style.color='#2B2622';
      $('#f-err').textContent='Password updated';
      setTimeout(()=>{$('#f-err').textContent='';$('#f-err').style.color=''},1500);
    }catch(e){$('#f-err').textContent=(e&&e.error)||'Failed'}
  };
}

/* ---- init ---- */
api('GET','/api/me').then(r=>{if(r.user)boot(r.user)});
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
