<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Porch — Homestead</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#FFFBF5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- PHA-2200.5 / PHA-2206: shared wall feed styles. Same file is also
     used by index.html's #page-wall mount so both placements render
     identically. -->
<link rel="stylesheet" href="/porch.css">
</head>
<body>

<!-- PHA-2200.5 / PHA-2206: thin shell. The full feed (composer, post
     list, reactions, comments, "Older" pagination) is rendered into
     #porch-mount by public/components/feed.js — the SAME component
     mounted inside index.html's #page-wall for the meadow layout. The
     chrome (header.back link, single-page wrapper) lives here; everything
     else comes from the component. -->

<div id="porch-mount"></div>

<!-- Load order: shared porch.css first (defines the tokens + chrome
     styles), then components/feed.js (mounts into #porch-mount on
     DOMContentLoaded / window load — see the IIFE in feed.js). -->
<script src="/components/feed.js"></script>
<script>
  // Mount the shared feed component into this thin shell. Same call
  // signature as index.html's #page-wall mount — placement is just
  // a target div.
  (function () {
    function mountPorch() {
      if (window.HomesteadFeed && document.getElementById('porch-mount')) {
        window.HomesteadFeed.mount(document.getElementById('porch-mount'), {
          apiBase: '/api',
          canPost: true,
          canReact: true,
          canComment: true,
          // PHA-2727: this standalone shell is what a wall-only user lands
          // on (no other modules enabled, no bottom bar, no profile access
          // at all). The index.html #page-wall mount leaves these off since
          // it already has its own fab/avatar/nav chrome.
          primaryFab: true,
          utilityChip: true,
        });
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', mountPorch);
    } else {
      mountPorch();
    }
  })();
</script>

</body>
</html>
