name: test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run test suite
        run: npm test

      - name: Run smoke suite
        run: npm run test:smoke
