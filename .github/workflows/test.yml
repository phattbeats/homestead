name: test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run unit test suite
        run: npm test

      # PHA-2501 standing policy — Definition of Done guard. Runs the
      # browser smoke chain (includes both the SPA page-error regression
      # and the post-login mobile-viewport screenshot smoke) on every PR
      # so a closed green check requires artifact-grade evidence. The
      # browser smoke saves a 390x844 PNG of the post-login home surface
      # into verify-out/ for human cross-check on the PR page.
      - name: Run browser smoke suite
        run: npm run test:smoke

      - name: Upload verify-out screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-out
          path: verify-out/
