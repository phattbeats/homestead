name: test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run unit test suite
        run: npm test

      # PHA-2501 standing policy — Definition of Done guard. Two browser
      # smokes run on every PR: (1) the SPA page-error regression guard
      # (catches duplicate top-level declarations like PHA-2494), and
      # (2) the post-login mobile-viewport screenshot smoke (catches
      # broken renders of the login surface). Both must pass for the
      # PR to merge. The wider `npm run test:smoke` chain is left for
      # local + release-gate use; it includes deployment-secret-bound
      # smokes that don't run in PR-only CI.
      - name: Run SPA page-error regression smoke
        run: node scripts/smoke-spa-pageerrors.js

      - name: Run post-login mobile screenshot smoke
        run: node scripts/smoke-postlogin-screenshot.js

      - name: PHA-2658 — entity deep-link refresh smoke
        run: node scripts/smoke-entity-deeplink.js

      # PHA-2498 (P2 UX batch): the three mobile smokes below are the
      # DoD evidence the walking report cited to close the parent issue.
      # They're additive to the PHA-2501 standing smokes — same harness,
      # same fixtures, same screenshot outputs as the post-login smoke,
      # each asserting one of the four fix points:
      #   1. install coach does NOT auto-fire on login transition
      #   2. drawerFab docks into header (no bottom-right FAB pileup)
      #   3. drawerFab does NOT leak onto the login screen
      - name: PHA-2498 — install-coach deferral smoke
        run: node scripts/smoke-2498-install-coach-deferral.js

      - name: PHA-2498 — FAB pileup smoke
        run: node scripts/smoke-2498-fab-pileup.js

      - name: PHA-2498 — pre-auth drawer-gate smoke
        run: node scripts/smoke-2498-preauth-drawer.js

      # PHA-2585: Home / Today landing is always-visible after
      # applyLayout. Boots a fresh instance, logs in as brandon,
      # asserts Home is visible in the bottom nav regardless of
      # which modules the user has enabled, and captures two 390x844
      # mobile-viewport screenshots (all-modules + reduced-layout).
      - name: PHA-2585 — Home always-visible smoke
        run: node scripts/smoke-2585-home-always-visible.js

      - name: PHA-2586 — Lists fresh-install journey smoke
        run: node scripts/smoke-2586-lists-ui.js

      - name: Upload verify-out screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-out
          path: verify-out/
