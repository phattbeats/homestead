name: auto-tag

# PHA-2971: continuous deployment. Every merge to main gets a fresh
# vX.Y.Z tag (PATCH auto-increments) so release.yml publishes a new
# image automatically. MAJOR/MINOR bumps stay manual via a PR that
# tags itself before merging (this job only ever bumps PATCH).

on:
  push:
    branches:
      - main

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next patch version
        id: next
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            latest="v0.0.0"
          fi
          ver="${latest#v}"
          major=$(echo "$ver" | cut -d. -f1)
          minor=$(echo "$ver" | cut -d. -f2)
          patch=$(echo "$ver" | cut -d. -f3)
          next="v${major}.${minor}.$((patch + 1))"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Push tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.next.outputs.next }}" -m "Auto-tag on merge to main (${{ github.sha }})"
          git push origin "${{ steps.next.outputs.next }}"

      # A push made with GITHUB_TOKEN never fires other workflows' tag
      # triggers (GitHub's anti-recursion rule), so release.yml would
      # never see this tag land. Dispatch it directly instead — that
      # API call is not a "push" and IS allowed for GITHUB_TOKEN.
      #
      # Observed live during PHA-2971 rollout: two dispatch calls fired
      # ~3 minutes apart and GitHub silently dropped one (no run, no
      # error) -- so we verify a run actually shows up and retry once
      # before failing loudly.
      - name: Dispatch release workflow (with verify + retry)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.next.outputs.next }}
        run: |
          verify() {
            for i in $(seq 1 6); do
              sleep 5
              found=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?event=workflow_dispatch&per_page=10" \
                --jq ".workflow_runs[] | select(.created_at > \"${dispatched_at}\") | .id" | head -n1)
              if [ -n "$found" ]; then
                echo "Confirmed release run $found for $TAG"
                return 0
              fi
            done
            return 1
          }

          dispatched_at=$(date -u +%Y-%m-%dT%H:%M:%S)
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" -f ref=main -f "inputs[tag]=${TAG}"
          if verify; then
            exit 0
          fi

          echo "::warning::No release.yml run appeared for $TAG after first dispatch, retrying once"
          dispatched_at=$(date -u +%Y-%m-%dT%H:%M:%S)
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" -f ref=main -f "inputs[tag]=${TAG}"
          if verify; then
            exit 0
          fi

          echo "::error::release.yml never picked up dispatch for $TAG after 2 attempts"
          exit 1
