services:
  homestead:
    image: ghcr.io/phattbeats/homestead:latest
    container_name: homestead
    restart: unless-stopped
    # Adjust the network name to match your environment. On Unraid the
    # `phattvip` network is whatever you've named the bridge your other
    # self-hosted services share.
    networks:
      - phattvip
    ports:
      - "3081:3080"   # host:container — change the host side as you like
    volumes:
      # SQLite lives here. Mount a host path so the DB survives image upgrades.
      - /mnt/user/appdata/homestead:/data
    environment:
      # Long random string — used to sign session cookies. Generate one with
      # `openssl rand -hex 32` and replace before first run.
      - SESSION_SECRET=change-this-to-something-long-and-random
      # REQUIRED before the first run. Set a long unique value; Homestead
      # refuses to start if this is blank or left as the old `changeme`
      # default. It only seeds the database once; rotate later in-app.
      - ADMIN_PASSWORD=replace-with-a-long-unique-password

networks:
  phattvip:
    external: true
