<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Homestead identity network</title>
<style>
  :root {
    --bg: #f7f2e9;
    --paper: #fffdf8;
    --ink: #2b2924;
    --muted: #6f6a60;
    --line: #766f64;
    --zone: #d7cdbf;
    --input: #dce8d3;
    --process: #f1d5bd;
    --storage: #cddfdc;
    --external: #e2d8ed;
    --risk: #f1caca;
    --rule: #efe7d7;
    --accent: #a9562c;
    --link: #665191;
    --success: #386b56;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main { max-width: 1640px; margin: 0 auto; padding: 20px; }
  svg { width: 100%; height: auto; display: block; }
  .title { font-size: 34px; font-weight: 760; fill: var(--ink); letter-spacing: -0.7px; }
  .subtitle { font-size: 17px; fill: var(--muted); }
  .zone-title { font-size: 14px; font-weight: 750; letter-spacing: 1.5px; fill: var(--muted); }
  .label { font-size: 17px; font-weight: 720; fill: var(--ink); }
  .small { font-size: 13px; fill: var(--muted); }
  .tiny { font-size: 12px; fill: var(--muted); }
  .edge-label { font-size: 12px; font-weight: 700; fill: var(--muted); }
  .node { stroke: var(--line); stroke-width: 1.3; }
  .input { fill: var(--input); }
  .process { fill: var(--process); }
  .storage { fill: var(--storage); }
  .external { fill: var(--external); }
  .risk { fill: var(--risk); }
  .rule { fill: var(--rule); }
  .paper { fill: var(--paper); }
  .zone { fill: var(--paper); stroke: var(--zone); stroke-width: 1.2; stroke-dasharray: 8 7; }
  .edge { stroke: var(--line); stroke-width: 2; fill: none; marker-end: url(#arrow); }
  .edge-accent { stroke: var(--accent); stroke-width: 2.6; fill: none; marker-end: url(#arrow-accent); }
  .edge-link { stroke: var(--link); stroke-width: 2.6; fill: none; marker-end: url(#arrow-link); }
  .edge-success { stroke: var(--success); stroke-width: 2.6; fill: none; marker-end: url(#arrow-success); }
  .edge-dashed { stroke: var(--line); stroke-width: 1.8; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow); }
  .badge { font-size: 12px; font-weight: 780; fill: var(--paper); }
  .note-title { font-size: 14px; font-weight: 760; fill: var(--ink); }
  .rule-text { font-size: 12px; fill: var(--ink); }
</style>
<main>
<svg viewBox="0 0 1600 1220" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Homestead identity and invite network</title>
  <desc id="diagram-desc">End-to-end architecture showing invite-created standalone Homestead accounts, optional Authentik identity linking later, stable user IDs, wall memberships, and recovery rules.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#766f64" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a9562c" />
    </marker>
    <marker id="arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#665191" />
    </marker>
    <marker id="arrow-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#386b56" />
    </marker>
  </defs>

  <text x="42" y="50" class="title">Homestead identity network</text>
  <text x="42" y="80" class="subtitle">Invites create real standalone users now. Authentik can be linked later without moving their data.</text>

  <!-- Connectors are deliberately drawn before nodes. -->
  <!-- First-visit flow -->
  <path class="edge-accent" d="M 250 230 H 312" />
  <path class="edge-accent" d="M 592 230 H 652" />
  <path class="edge-accent" d="M 892 230 C 930 230, 930 175, 970 175" />
  <path class="edge" d="M 892 230 C 930 230, 930 325, 970 325" />
  <path class="edge-accent" d="M 1240 175 H 1310" />
  <path class="edge" d="M 1240 325 H 1310" />
  <path class="edge-success" d="M 1415 365 V 448" />

  <!-- Identity/data ownership flow -->
  <path class="edge-accent" d="M 1105 235 V 530 H 493" />
  <path class="edge" d="M 1105 385 V 500 H 775 V 530" />
  <path class="edge" d="M 493 610 H 620" />
  <path class="edge-link" d="M 1110 610 H 930" />
  <path class="edge-success" d="M 930 610 H 1010" />
  <path class="edge-success" d="M 1175 670 V 705" />
  <path class="edge-success" d="M 1340 670 V 705" />
  <path class="edge-success" d="M 1090 765 C 1030 800, 840 805, 775 710" />

  <!-- Link-later flow -->
  <path class="edge-link" d="M 260 950 H 320" />
  <path class="edge-link" d="M 570 950 H 630" />
  <path class="edge-link" d="M 880 950 H 940" />
  <path class="edge-link" d="M 1190 950 H 1250" />
  <path class="edge-link" d="M 1380 890 C 1380 820, 1280 800, 1110 670" />
  <path class="edge-dashed" d="M 755 890 V 670" />

  <!-- Failure callout -->
  <path class="edge-dashed" d="M 420 1115 C 600 1125, 960 1125, 1085 1040" />

  <!-- Zone: first visit -->
  <rect x="28" y="105" width="1544" height="330" rx="24" class="zone" />
  <text x="54" y="136" class="zone-title">1 · FIRST VISIT — INVITE IS THE ONBOARDING DOOR</text>

  <rect x="62" y="177" width="188" height="106" rx="16" class="node input" />
  <text x="86" y="208" class="label">Invite URL</text>
  <text x="86" y="234" class="small">Code identifies the wall</text>
  <text x="86" y="255" class="small">and the inviter</text>

  <rect x="312" y="155" width="280" height="150" rx="18" class="node process" />
  <text x="338" y="190" class="label">Public welcome page</text>
  <text x="338" y="217" class="small">“Brandon invited you to Family”</text>
  <text x="338" y="239" class="small">Explains Homestead + access</text>
  <text x="338" y="261" class="small">Keeps the invite context visible</text>

  <rect x="652" y="170" width="240" height="120" rx="18" class="node paper" />
  <text x="678" y="204" class="label">Choose a path</text>
  <rect x="678" y="225" width="174" height="24" rx="12" fill="#a9562c" />
  <text x="691" y="242" class="badge">CREATE MY ACCOUNT</text>
  <text x="678" y="274" class="small">or “I already have one”</text>

  <rect x="970" y="115" width="270" height="120" rx="18" class="node process" />
  <text x="995" y="149" class="label">Standalone enrollment</text>
  <text x="995" y="176" class="small">Name + username + password</text>
  <text x="995" y="198" class="small">Creates a real local account</text>
  <text x="995" y="220" class="tiny">No Authentik account required</text>

  <rect x="970" y="270" width="270" height="115" rx="18" class="node external" />
  <text x="995" y="303" class="label">Existing-user sign in</text>
  <text x="995" y="330" class="small">Local password now</text>
  <text x="995" y="352" class="small">Authentik after linking</text>

  <rect x="1310" y="155" width="210" height="210" rx="18" class="node input" />
  <text x="1336" y="189" class="label">Redeem + welcome</text>
  <text x="1336" y="219" class="small">1. Attach wall membership</text>
  <text x="1336" y="242" class="small">2. Explain the Porch</text>
  <text x="1336" y="265" class="small">3. Show their wall</text>
  <text x="1336" y="288" class="small">4. Suggest first action</text>
  <text x="1336" y="326" class="tiny">Invite is consumed only</text>
  <text x="1336" y="344" class="tiny">after account creation succeeds</text>

  <!-- Zone: canonical identity -->
  <rect x="28" y="460" width="1544" height="355" rx="24" class="zone" />
  <text x="54" y="492" class="zone-title">2 · HOMESTEAD OWNS THE PERSON; LOGIN METHODS POINT TO THEM</text>

  <rect x="92" y="530" width="401" height="160" rx="18" class="node storage" />
  <text x="118" y="565" class="label">local_credentials</text>
  <text x="118" y="594" class="small">user_id → users.id</text>
  <text x="118" y="617" class="small">password_hash · recovery state</text>
  <text x="118" y="640" class="small">optional after Authentik linking</text>
  <rect x="118" y="654" width="216" height="22" rx="11" fill="#386b56" />
  <text x="130" y="670" class="badge">STANDALONE LOGIN WORKS</text>

  <rect x="620" y="530" width="310" height="180" rx="18" class="node storage" />
  <text x="647" y="565" class="label">users</text>
  <text x="647" y="593" class="small">Stable canonical users.id</text>
  <text x="647" y="616" class="small">profile · display · preferences</text>
  <text x="647" y="639" class="small">created_at · first_run</text>
  <rect x="647" y="658" width="252" height="27" rx="13" fill="#a9562c" />
  <text x="663" y="677" class="badge">THIS ID NEVER CHANGES</text>

  <rect x="1010" y="530" width="330" height="140" rx="18" class="node storage" />
  <text x="1037" y="565" class="label">identity_links</text>
  <text x="1037" y="593" class="small">user_id · provider · issuer</text>
  <text x="1037" y="616" class="small">provider_subject · linked_at</text>
  <text x="1037" y="639" class="tiny">Many login methods → one Homestead user</text>

  <rect x="1000" y="705" width="180" height="84" rx="16" class="node storage" />
  <text x="1021" y="738" class="label">Wall access</text>
  <text x="1021" y="763" class="small">memberships</text>

  <rect x="1210" y="705" width="240" height="84" rx="16" class="node storage" />
  <text x="1232" y="738" class="label">User-owned history</text>
  <text x="1232" y="763" class="small">posts · tasks · events · apps</text>

  <rect x="92" y="718" width="420" height="66" rx="14" class="node rule" />
  <text x="115" y="746" class="note-title">Ownership rule</text>
  <text x="115" y="768" class="rule-text">All product data points to users.id—not username, email, or Authentik.</text>

  <!-- Zone: link later -->
  <rect x="28" y="840" width="1544" height="340" rx="24" class="zone" />
  <text x="54" y="872" class="zone-title">3 · LINK AUTHENTIK LATER — ADD A KEY, DO NOT MIGRATE THE HOUSE</text>

  <rect x="62" y="900" width="198" height="100" rx="16" class="node input" />
  <text x="86" y="933" class="label">Signed-in user</text>
  <text x="86" y="960" class="small">Uses local password</text>
  <text x="86" y="982" class="small">owns the active session</text>

  <rect x="320" y="890" width="250" height="120" rx="18" class="node process" />
  <text x="345" y="925" class="label">Link Authentik</text>
  <text x="345" y="952" class="small">Settings → Linked accounts</text>
  <text x="345" y="974" class="small">Re-authenticate locally first</text>

  <rect x="630" y="890" width="250" height="120" rx="18" class="node external" />
  <text x="656" y="925" class="label">Authentik</text>
  <text x="656" y="952" class="small">Login / MFA / enrollment</text>
  <text x="656" y="974" class="small">Returns immutable subject ID</text>

  <rect x="940" y="880" width="250" height="140" rx="18" class="node process" />
  <text x="965" y="915" class="label">Verified callback</text>
  <text x="965" y="942" class="small">Validate issuer + state + nonce</text>
  <text x="965" y="964" class="small">Require current Homestead session</text>
  <text x="965" y="986" class="small">Show explicit final confirmation</text>

  <rect x="1250" y="870" width="270" height="160" rx="18" class="node process" />
  <text x="1276" y="905" class="label">Collision guard</text>
  <text x="1276" y="932" class="small">Subject already linked elsewhere?</text>
  <text x="1276" y="954" class="small">Stop; require recovery/admin review.</text>
  <text x="1276" y="985" class="small">Otherwise insert identity_links</text>
  <text x="1276" y="1007" class="tiny">Never auto-link by matching email alone</text>

  <rect x="62" y="1052" width="490" height="96" rx="16" class="node rule" />
  <text x="87" y="1083" class="note-title">Safe account-linking rules</text>
  <text x="87" y="1109" class="rule-text">Logged-in session + local re-auth + OAuth state/nonce + explicit confirmation.</text>
  <text x="87" y="1132" class="rule-text">Keep local recovery until the Authentik path has been proven and recovery tested.</text>

  <rect x="610" y="1052" width="455" height="96" rx="16" class="node risk" />
  <text x="635" y="1083" class="note-title">Current broken behavior</text>
  <text x="635" y="1109" class="rule-text">Invite → generic login → no account creation → recipient stranded.</text>
  <text x="635" y="1132" class="rule-text">That path is removed, not preserved as “intentional.”</text>

  <rect x="1110" y="1052" width="410" height="96" rx="16" class="node rule" />
  <text x="1135" y="1083" class="note-title">Owner recovery</text>
  <text x="1135" y="1109" class="rule-text">A local owner credential remains a break-glass path.</text>
  <text x="1135" y="1132" class="rule-text">Authentik failure must never lock the owner out again.</text>

  <!-- Legend -->
  <rect x="1110" y="36" width="20" height="20" rx="4" class="node process" />
  <text x="1138" y="51" class="tiny">Homestead process</text>
  <rect x="1265" y="36" width="20" height="20" rx="4" class="node storage" />
  <text x="1293" y="51" class="tiny">Homestead data</text>
  <rect x="1410" y="36" width="20" height="20" rx="4" class="node external" />
  <text x="1438" y="51" class="tiny">External identity</text>
</svg>
</main>
