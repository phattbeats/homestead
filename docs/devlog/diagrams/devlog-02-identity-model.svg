<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="monospace" font-size="13" fill="#1b2440">
  <rect width="800" height="460" fill="#ffffff"/>
  <text x="20" y="28" font-size="15" font-weight="bold">FIG 2-2  HOMESTEAD OWNS THE PERSON (identity foundation, 2026-08-29)</text>
  <line x1="20" y1="38" x2="780" y2="38" stroke="#1b2440" stroke-width="1"/>
  <g stroke="#1b2440" stroke-width="2" fill="none">
    <rect x="30" y="70" width="230" height="120"/>
    <rect x="285" y="70" width="230" height="120" stroke="#c9a227" stroke-width="3"/>
    <rect x="540" y="70" width="230" height="120"/>
  </g>
  <text x="45" y="95" font-weight="bold">local_credentials</text>
  <text x="45" y="118">user_id (PK, FK)</text>
  <text x="45" y="136">password_hash</text>
  <text x="45" y="154">recovery token cols</text>
  <text x="45" y="178" font-size="11">0 or 1 per person</text>
  <text x="300" y="95" font-weight="bold" fill="#8a6d0f">users</text>
  <text x="300" y="118">id  (never changes)</text>
  <text x="300" y="136">username, display</text>
  <text x="300" y="154">color, preferences</text>
  <text x="300" y="178" font-size="11">first_run_completed_at</text>
  <text x="555" y="95" font-weight="bold">identity_links</text>
  <text x="555" y="118">user_id (FK)</text>
  <text x="555" y="136">provider, issuer</text>
  <text x="555" y="154">provider_subject</text>
  <text x="555" y="178" font-size="11">0..n per person, UNIQUE triple</text>
  <g stroke="#1b2440" stroke-width="1.5">
    <line x1="260" y1="130" x2="285" y2="130"/>
    <line x1="515" y1="130" x2="540" y2="130"/>
  </g>
  <text x="30" y="225" font-weight="bold">Login methods point at the person:</text>
  <text x="30" y="245">  a password is one key, an Authentik subject is another. Many keys, one door.</text>
  <g stroke="#1b2440" stroke-width="2" fill="none">
    <rect x="30" y="275" width="740" height="90" stroke-dasharray="6 5"/>
  </g>
  <text x="45" y="300" font-weight="bold">Everything else points at users.id</text>
  <text x="45" y="322">wall memberships . posts . tasks . events . apps</text>
  <text x="45" y="342">push subscriptions . enabled modules . access tokens</text>
  <g stroke="#1b2440" stroke-width="1.5">
    <line x1="400" y1="190" x2="400" y2="275"/>
  </g>
  <text x="30" y="400" font-size="12">Rule from the design doc: "All product data points to users.id - not username, email, or Authentik."</text>
  <text x="30" y="425" font-size="11">NOTE: users.pass_hash / auth_provider / provider_subject survive as deprecated shadow columns.</text>
</svg>
