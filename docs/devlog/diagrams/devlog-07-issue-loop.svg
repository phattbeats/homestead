<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="monospace" font-size="12" fill="#1b2440">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2440"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#ffffff"/>
  <text x="20" y="28" font-size="15" font-weight="bold">FIG 7-1  THE LOOP: ISSUE -&gt; AGENT -&gt; PR -&gt; DOD GATE</text>
  <line x1="20" y1="38" x2="780" y2="38" stroke="#1b2440" stroke-width="1"/>

  <!-- reopen loop -->
  <g stroke="#1b2440" stroke-width="1.5" fill="none">
    <path d="M695,95 L695,62 L305,62 L305,92" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  </g>
  <text x="372" y="56" font-size="11">no evidence = reopened, no discussion</text>

  <!-- top row -->
  <g stroke="#1b2440" stroke-width="2" fill="none">
    <rect x="20" y="95" width="180" height="120"/>
    <rect x="215" y="95" width="180" height="120"/>
    <rect x="410" y="95" width="180" height="120"/>
    <rect x="605" y="95" width="180" height="120" stroke="#c9a227" stroke-width="3"/>
  </g>
  <g stroke="#1b2440" stroke-width="1.5">
    <line x1="200" y1="155" x2="213" y2="155" marker-end="url(#arr)"/>
    <line x1="395" y1="155" x2="408" y2="155" marker-end="url(#arr)"/>
    <line x1="590" y1="155" x2="603" y2="155" marker-end="url(#arr)"/>
  </g>

  <text x="32" y="118" font-weight="bold">[1] ISSUE</text>
  <text x="32" y="140">Paperclip ticket.</text>
  <text x="32" y="158">WHY in the body,</text>
  <text x="32" y="176">edge cases in the</text>
  <text x="32" y="194">comments.</text>

  <text x="227" y="118" font-weight="bold">[2] AGENT</text>
  <text x="227" y="140">read the issue twice</text>
  <text x="227" y="158">check existing code</text>
  <text x="227" y="176">branch, implement</text>
  <text x="227" y="194">run verify.sh</text>

  <text x="422" y="118" font-weight="bold">[3] PULL REQUEST</text>
  <text x="422" y="140">CI: npm test</text>
  <text x="422" y="158">+ browser smokes</text>
  <text x="422" y="176">+ authorship check</text>
  <text x="422" y="194">squash-merge</text>

  <text x="617" y="118" font-weight="bold" fill="#8a6d0f">[4] DOD GATE</text>
  <text x="617" y="140">390px screenshot</text>
  <text x="617" y="158">from a REAL instance</text>
  <text x="617" y="176">0 pageerrors</text>
  <text x="617" y="194">SHA in main</text>

  <!-- bottom row -->
  <g stroke="#1b2440" stroke-width="2" fill="none">
    <rect x="410" y="265" width="375" height="95"/>
    <rect x="20" y="265" width="375" height="95"/>
  </g>
  <g stroke="#1b2440" stroke-width="1.5">
    <line x1="695" y1="215" x2="695" y2="263" marker-end="url(#arr)"/>
    <line x1="410" y1="312" x2="397" y2="312" marker-end="url(#arr)"/>
  </g>

  <text x="422" y="288" font-weight="bold">[5] CLOSE THE ISSUE</text>
  <text x="422" y="310">## WHAT changed</text>
  <text x="422" y="328">## SHA in main</text>
  <text x="422" y="346">## EVIDENCE  (screenshot, curl, counts)</text>

  <text x="32" y="288" font-weight="bold">[6] TAG IT BY HAND</text>
  <text x="32" y="310">git tag -a vX.Y.Z; git push origin vX.Y.Z</text>
  <text x="32" y="328">release.yml builds and pushes</text>
  <text x="32" y="346">ghcr.io/phattbeats/homestead:&lt;tag&gt;, :latest</text>

  <text x="20" y="395" font-size="11">NOTE: [4] is the step I added after the 2026-08-23 review. Steps 1-3 alone had closed four issues green</text>
  <text x="20" y="410" font-size="11">      with no code in main.</text>
</svg>
