<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="monospace" font-size="13" fill="#1b2440">
  <rect width="800" height="470" fill="#ffffff"/>
  <text x="20" y="28" font-size="15" font-weight="bold">FIG 2-1  FOUR WAYS IN (authenticate() in server.js, top to bottom)</text>
  <line x1="20" y1="38" x2="780" y2="38" stroke="#1b2440" stroke-width="1"/>
  <g stroke="#1b2440" stroke-width="2" fill="none">
    <rect x="40" y="60" width="560" height="70"/>
    <rect x="40" y="160" width="560" height="70" stroke="#c9a227" stroke-width="3"/>
    <rect x="40" y="260" width="560" height="70"/>
    <rect x="40" y="360" width="560" height="50" stroke-dasharray="6 5"/>
  </g>
  <text x="60" y="85" font-weight="bold">[1] BEARER TOKEN</text>
  <text x="60" y="105">Authorization: Bearer homestead_pat_...</text>
  <text x="60" y="122" font-size="11">agents and installed apps (Part 5). Bad token: 401 right here.</text>
  <text x="60" y="185" font-weight="bold" fill="#8a6d0f">[2] HEADER-TRUST (forward-auth)</text>
  <text x="60" y="205">X-authentik-username + X-authentik-groups</text>
  <text x="60" y="222" font-size="11">set by the reverse proxy after Authentik says yes. provisionOrClaim().</text>
  <text x="60" y="285" font-weight="bold">[3] SESSION COOKIE</text>
  <text x="60" y="305">set by /api/login, invite signup/sign-in, or layer [2]</text>
  <text x="60" y="322" font-size="11">the local-password path. Works with Authentik down.</text>
  <text x="60" y="390" font-weight="bold">[4] NOTHING MATCHED: 401 {"error":"unauthorized"}</text>
  <g stroke="#1b2440" stroke-width="1.5">
    <line x1="320" y1="130" x2="320" y2="160"/><line x1="320" y1="230" x2="320" y2="260"/><line x1="320" y1="330" x2="320" y2="360"/>
    <line x1="600" y1="95" x2="680" y2="95"/><line x1="600" y1="195" x2="680" y2="195"/><line x1="600" y1="295" x2="680" y2="295"/>
    <line x1="680" y1="95" x2="680" y2="320"/>
  </g>
  <text x="328" y="150" font-size="11">no header</text>
  <text x="328" y="250" font-size="11">no header</text>
  <text x="328" y="350" font-size="11">no session</text>
  <rect x="640" y="320" width="120" height="34" fill="none" stroke="#1b2440" stroke-width="2"/>
  <text x="660" y="342" font-weight="bold">next()</text>
  <text x="610" y="88" font-size="11">match</text>
  <text x="610" y="188" font-size="11">match</text>
  <text x="610" y="288" font-size="11">match</text>
  <text x="40" y="450" font-size="11">NOTE: [2] believes the header whenever it is present. The proxy must be the only way in, and must set it itself.</text>
</svg>
