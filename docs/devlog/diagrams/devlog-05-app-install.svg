<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" font-family="monospace" font-size="13" fill="#1b2440">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2440"/>
    </marker>
  </defs>
  <rect width="800" height="580" fill="#ffffff"/>
  <text x="20" y="28" font-size="15" font-weight="bold">FIG 5-4  INSTALL -&gt; CONSENT -&gt; SCOPED TOKEN</text>
  <line x1="20" y1="38" x2="780" y2="38" stroke="#1b2440" stroke-width="1"/>
  <text x="580" y="54" font-size="11" font-weight="bold">DB WRITES</text>

  <g stroke="#1b2440" stroke-width="2" fill="none">
    <rect x="20" y="62" width="540" height="80"/>
    <rect x="20" y="160" width="540" height="80"/>
    <rect x="20" y="258" width="540" height="80" stroke="#c9a227" stroke-width="3"/>
    <rect x="20" y="356" width="540" height="80"/>
    <rect x="20" y="454" width="540" height="80"/>
  </g>
  <g stroke="#1b2440" stroke-width="1" fill="none" stroke-dasharray="4 3">
    <rect x="580" y="62" width="200" height="80"/>
    <rect x="580" y="160" width="200" height="80"/>
    <rect x="580" y="258" width="200" height="80"/>
    <rect x="580" y="356" width="200" height="80"/>
    <rect x="580" y="454" width="200" height="80"/>
  </g>

  <text x="34" y="84" font-weight="bold">[1] RESOLVE: POST /api/apps/resolve</text>
  <text x="34" y="104" font-size="12">fetch the manifest URL, check the 16-field shape and every</text>
  <text x="34" y="120" font-size="12">scope against the vocabulary; https + non-loopback only;</text>
  <text x="34" y="136" font-size="12">a manifest claiming a built-in key ("wall") gets a 409</text>
  <text x="594" y="106" font-size="12">none, by test</text>

  <text x="34" y="182" font-weight="bold">[2] CONSENT: POST /api/apps/consent</text>
  <text x="34" y="202" font-size="12">scopes shown as plain phrases (lib/scope-display.js)</text>
  <text x="34" y="218" font-size="12">consent token: 60 s, single-use, bound to (user, URL)</text>
  <text x="34" y="234" font-size="12">manifest snapshotted: install commits what you saw</text>
  <text x="594" y="204" font-size="12">app_consent_tokens</text>
  <text x="594" y="220" font-size="12">(sha256, not bcrypt)</text>

  <text x="34" y="280" font-weight="bold" fill="#8a6d0f">[3] INSTALL: POST /api/apps/install (one transaction)</text>
  <text x="34" y="300" font-size="12">consume the consent token, upsert the household-wide row,</text>
  <text x="34" y="316" font-size="12">mint an app-scoped PAT with exactly the consented scopes,</text>
  <text x="34" y="332" font-size="12">turn on the Apps launcher. Any failure rolls it all back.</text>
  <text x="594" y="292" font-size="12">installed_apps</text>
  <text x="594" y="308" font-size="12">agent_tokens.app_id</text>
  <text x="594" y="324" font-size="12">user_modules</text>

  <text x="34" y="378" font-weight="bold">[4] USE: Authorization: Bearer homestead_pat_...</text>
  <text x="34" y="398" font-size="12">requireScope() checks the token's array, not the user's</text>
  <text x="34" y="414" font-size="12">powers; a missing scope is 403 insufficient_scope</text>
  <text x="34" y="430" font-size="12">each call is logged after the response is sent</text>
  <text x="594" y="400" font-size="12">app_api_log</text>

  <text x="34" y="476" font-weight="bold">[5] REVOKE: POST /api/apps/:key/revoke</text>
  <text x="34" y="496" font-size="12">soft-delete this user's app token: 401 on the next call</text>
  <text x="34" y="512" font-size="12">the shared row is archived once no member holds a token</text>
  <text x="34" y="528" font-size="12">reinstall re-mints the same scopes without re-consent</text>
  <text x="594" y="498" font-size="12">agent_tokens.revoked_at</text>

  <g stroke="#1b2440" stroke-width="1.5" fill="none">
    <line x1="290" y1="142" x2="290" y2="158" marker-end="url(#arr)"/>
    <line x1="290" y1="240" x2="290" y2="256" marker-end="url(#arr)"/>
    <line x1="290" y1="338" x2="290" y2="354" marker-end="url(#arr)"/>
    <line x1="290" y1="436" x2="290" y2="452" marker-end="url(#arr)"/>
  </g>

  <text x="20" y="562" font-size="11">NOTE: dev: true on the request body (never in the manifest) relaxes the https rule for a local app.</text>
</svg>
