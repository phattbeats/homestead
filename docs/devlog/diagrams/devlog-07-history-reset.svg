<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="monospace" font-size="12" fill="#1b2440">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2440"/>
    </marker>
  </defs>
  <rect width="800" height="470" fill="#ffffff"/>
  <text x="20" y="28" font-size="15" font-weight="bold">FIG 7-3  THE FRESH START, BEFORE AND AFTER (2026-10-16)</text>
  <line x1="20" y1="38" x2="780" y2="38" stroke="#1b2440" stroke-width="1"/>

  <!-- BEFORE -->
  <text x="20" y="64" font-size="13" font-weight="bold">BEFORE  main, 2026-07-29 .. 2026-10-16</text>
  <g stroke="#1b2440" stroke-width="2">
    <line x1="30" y1="110" x2="370" y2="110"/>
    <line x1="80" y1="110" x2="110" y2="84"/><line x1="110" y1="84" x2="150" y2="84"/>
    <line x1="170" y1="110" x2="200" y2="136"/><line x1="200" y1="136" x2="250" y2="136"/>
    <line x1="260" y1="110" x2="290" y2="84"/><line x1="290" y1="84" x2="340" y2="84"/>
  </g>
  <g fill="#1b2440">
    <circle cx="30" cy="110" r="4"/><circle cx="55" cy="110" r="4"/><circle cx="80" cy="110" r="4"/>
    <circle cx="105" cy="110" r="4"/><circle cx="130" cy="110" r="4"/><circle cx="155" cy="110" r="4"/>
    <circle cx="180" cy="110" r="4"/><circle cx="205" cy="110" r="4"/><circle cx="230" cy="110" r="4"/>
    <circle cx="255" cy="110" r="4"/><circle cx="280" cy="110" r="4"/><circle cx="305" cy="110" r="4"/>
    <circle cx="330" cy="110" r="4"/><circle cx="355" cy="110" r="4"/><circle cx="370" cy="110" r="4"/>
    <circle cx="150" cy="84" r="4"/><circle cx="250" cy="136" r="4"/><circle cx="340" cy="84" r="4"/>
  </g>
  <text x="30" y="170">251 commits across all branches</text>
  <text x="30" y="188">37 tags (v0.0.1 .. v0.5.24)</text>
  <text x="30" y="206">~150 PR heads</text>
  <text x="30" y="224">ticket IDs in subjects, branches,</text>
  <text x="30" y="242">test file names, code comments</text>

  <!-- AFTER -->
  <text x="420" y="64" font-size="13" font-weight="bold">AFTER  main</text>
  <circle cx="450" cy="110" r="9" fill="#ffffff" stroke="#c9a227" stroke-width="3"/>
  <text x="470" y="106" font-weight="bold" fill="#8a6d0f">"Homestead v0.6.0"</text>
  <text x="470" y="122">root commit, tag v0.6.0 (the only one)</text>
  <g stroke="#1b2440" stroke-width="2">
    <line x1="450" y1="119" x2="450" y2="232"/>
    <line x1="450" y1="160" x2="490" y2="160"/>
    <line x1="450" y1="190" x2="490" y2="190"/>
    <line x1="450" y1="220" x2="490" y2="220"/>
  </g>
  <g fill="#1b2440"><circle cx="494" cy="160" r="4"/><circle cx="494" cy="190" r="4"/><circle cx="494" cy="220" r="4"/></g>
  <text x="506" y="164">open PR, rebased onto the root</text>
  <text x="506" y="194">open PR, rebased onto the root</text>
  <text x="506" y="224">open PR, rebased onto the root</text>
  <text x="420" y="254">(GitHub closed the old ones for good;</text>
  <text x="420" y="270"> these are new PRs with new numbers)</text>

  <!-- arrow -->
  <g stroke="#1b2440" stroke-width="1.5">
    <line x1="375" y1="110" x2="430" y2="110" marker-end="url(#arr)"/>
  </g>
  <text x="378" y="98" font-size="10">force-push</text>

  <!-- bundle + hidden refs -->
  <g stroke="#1b2440" stroke-width="2" fill="none">
    <rect x="20" y="300" width="365" height="80"/>
    <rect x="415" y="300" width="365" height="80" stroke-dasharray="6 4"/>
  </g>
  <g stroke="#1b2440" stroke-width="1.5">
    <line x1="200" y1="252" x2="200" y2="298" marker-end="url(#arr)"/>
  </g>
  <text x="32" y="322" font-weight="bold">OFFLINE GIT BUNDLE</text>
  <text x="32" y="342">all branches, PR heads, 37 tags</text>
  <text x="32" y="360">made before main was replaced</text>

  <text x="427" y="322" font-weight="bold">GITHUB HIDDEN REFS (not ours)</text>
  <text x="427" y="342">old PR commits still reachable by SHA</text>
  <text x="427" y="360">only GitHub Support can purge them</text>

  <text x="20" y="415" font-size="11">ORDER: prune branches, tags, releases -&gt; rewrite PR titles/bodies -&gt; scrub the tree -&gt; bundle</text>
  <text x="20" y="430" font-size="11">       -&gt; squash to one root -&gt; tag v0.6.0 -&gt; rebase + reopen open work as new PRs.</text>
</svg>
