<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="monospace" font-size="12" fill="#1b2440">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2440"/>
    </marker>
    <pattern id="ran" x="20" y="224" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="13" height="13" fill="#1b2440"/>
    </pattern>
  </defs>
  <rect width="800" height="470" fill="#ffffff"/>
  <text x="20" y="28" font-size="15" font-weight="bold">FIG 7-2  WHO DECIDES WHAT RUNS: AN &amp;&amp; STRING VS A DIRECTORY</text>
  <line x1="20" y1="38" x2="780" y2="38" stroke="#1b2440" stroke-width="1"/>
  <line x1="400" y1="50" x2="400" y2="408" stroke="#1b2440" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- BEFORE -->
  <text x="20" y="64" font-size="13" font-weight="bold">BEFORE  package.json "test"</text>
  <rect x="20" y="76" width="365" height="112" fill="none" stroke="#1b2440" stroke-width="2"/>
  <text x="30" y="96">node --require ... test-user-model.js</text>
  <text x="30" y="114">&amp;&amp; node --require ... test-user-modules.js</text>
  <text x="30" y="132">&amp;&amp; node --require ... test-modules.js</text>
  <text x="30" y="150">&amp;&amp; ... and the rest, typed by hand ...</text>
  <text x="30" y="174" font-weight="bold">66 x "&amp;&amp;"   5,242 characters</text>

  <text x="20" y="214">scripts/test-*.js on disk (70):</text>
  <rect x="20" y="224" width="252" height="72" fill="url(#ran)"/>
  <rect x="20" y="296" width="180" height="13" fill="url(#ran)"/>
  <g fill="none" stroke="#c9a227" stroke-width="2.5">
    <rect x="201" y="297" width="11" height="11"/>
    <rect x="219" y="297" width="11" height="11"/>
    <rect x="237" y="297" width="11" height="11"/>
    <rect x="255" y="297" width="11" height="11"/>
  </g>
  <text x="20" y="334">filled (66) = in the string, ran</text>
  <text x="20" y="352" fill="#8a6d0f" font-weight="bold">gold (4) = nobody spliced it in:</text>
  <text x="20" y="370" fill="#8a6d0f">never ran, never failed</text>
  <text x="20" y="398">porch node:test files: 1 of 2 ran</text>

  <!-- AFTER -->
  <text x="415" y="64" font-size="13" font-weight="bold">AFTER  node scripts/run-tests.js</text>
  <g stroke="#1b2440" stroke-width="2" fill="none">
    <rect x="415" y="76" width="365" height="34"/>
    <rect x="415" y="128" width="365" height="34"/>
    <rect x="415" y="180" width="365" height="34"/>
    <rect x="415" y="232" width="365" height="52"/>
    <rect x="415" y="302" width="365" height="34"/>
  </g>
  <g stroke="#1b2440" stroke-width="1.5">
    <line x1="597" y1="110" x2="597" y2="126" marker-end="url(#arr)"/>
    <line x1="597" y1="162" x2="597" y2="178" marker-end="url(#arr)"/>
    <line x1="597" y1="214" x2="597" y2="230" marker-end="url(#arr)"/>
    <line x1="597" y1="284" x2="597" y2="300" marker-end="url(#arr)"/>
  </g>
  <text x="427" y="98">readdir(scripts/)</text>
  <text x="427" y="150">filter /^test-.*\.js$/, sort</text>
  <text x="427" y="202">count &gt;= 50 ?  else exit 2</text>
  <text x="427" y="254">run each with the bootstrap shim</text>
  <text x="427" y="272">120 s cap, stop at first failure</text>
  <text x="427" y="324">node --test test/porch/*.test.mjs</text>

  <text x="415" y="372" font-weight="bold">first CI run: 70 scripts + 2 porch files</text>
  <text x="415" y="390">new test file = zero package.json edits</text>

  <text x="20" y="430" font-size="11">NOTE: the runner keeps the &amp;&amp; semantics on purpose (sequential, stop at first failure). Only the</text>
  <text x="20" y="445" font-size="11">      list of what runs changed hands, from a person's memory to the filesystem.</text>
</svg>
