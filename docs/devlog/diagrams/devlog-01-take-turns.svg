<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="monospace" font-size="13" fill="#1b2440">
  <rect width="800" height="430" fill="#ffffff"/>
  <text x="20" y="28" font-size="15" font-weight="bold">FIG 1-4  TAKE TURNS: WHAT ONE CHECK-OFF DOES</text>
  <line x1="20" y1="38" x2="780" y2="38" stroke="#1b2440" stroke-width="1"/>
  <g stroke="#1b2440" stroke-width="2" fill="none">
    <rect x="30" y="60" width="300" height="150"/>
    <rect x="470" y="60" width="300" height="150" stroke="#c9a227" stroke-width="3"/>
  </g>
  <text x="45" y="85" font-weight="bold">BEFORE  (example row)</text>
  <text x="45" y="110">title        Bins out</text>
  <text x="45" y="130">recur        weekly    rotate 1</text>
  <text x="45" y="150">assignee     alex</text>
  <text x="45" y="170">alt_assignee sam</text>
  <text x="45" y="190">due_date     2026-08-03</text>
  <text x="485" y="85" font-weight="bold" fill="#8a6d0f">AFTER  same row, still done=0</text>
  <text x="485" y="110">title        Bins out</text>
  <text x="485" y="130">recur        weekly    rotate 1</text>
  <text x="485" y="150">assignee     sam</text>
  <text x="485" y="170">alt_assignee alex</text>
  <text x="485" y="190">due_date     2026-08-10</text>
  <g stroke="#1b2440" stroke-width="1.5" fill="#1b2440">
    <line x1="335" y1="135" x2="458" y2="135"/><polygon points="465,135 457,131 457,139"/>
  </g>
  <text x="345" y="122" font-size="12">POST .../toggle</text>
  <text x="345" y="155" font-size="12">swap pair +</text>
  <text x="345" y="171" font-size="12">bumpDate()</text>
  <text x="30" y="250" font-weight="bold">OVER A MONTH</text>
  <g stroke="#1b2440" stroke-width="1.5" fill="none">
    <rect x="30" y="265" width="170" height="44"/>
    <rect x="215" y="265" width="170" height="44"/>
    <rect x="400" y="265" width="170" height="44"/>
    <rect x="585" y="265" width="170" height="44"/>
  </g>
  <text x="45" y="292">wk 1   alex</text>
  <text x="230" y="292">wk 2   sam</text>
  <text x="415" y="292">wk 3   alex</text>
  <text x="600" y="292">wk 4   sam</text>
  <text x="30" y="345">v0.0.1  swap = compare against two hardcoded usernames.</text>
  <text x="30" y="365">v0.0.2+ swap = assignee &lt;-&gt; alt_assignee. Any two users.</text>
  <text x="30" y="385">Never a round-robin of three. Done-by is logged, not history.</text>
  <text x="20" y="418" font-size="11">NOTE: demo users alex and sam. A non-recurring task just flips done; only recurring chores roll forward.</text>
</svg>
