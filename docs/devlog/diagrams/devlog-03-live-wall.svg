<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="monospace" font-size="12" fill="#1b2440">
  <rect width="800" height="460" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2440"/>
    </marker>
  </defs>
  <text x="20" y="28" font-size="15" font-weight="bold">FIG 3-6  HOW A POST REACHES AN OPEN TAB (v0.5.7)</text>
  <line x1="20" y1="38" x2="780" y2="38" stroke="#1b2440" stroke-width="1"/>

  <!-- column headers -->
  <text x="40" y="66" font-weight="bold">TAB A (posting)</text>
  <text x="320" y="66" font-weight="bold">SERVER (one process)</text>
  <text x="600" y="66" font-weight="bold">TAB B (already open)</text>

  <g stroke="#1b2440" stroke-width="2" fill="none">
    <rect x="30" y="80" width="200" height="50"/>
    <rect x="300" y="80" width="210" height="50"/>
    <rect x="300" y="160" width="210" height="50"/>
    <rect x="300" y="240" width="210" height="60" stroke="#c9a227" stroke-width="3"/>
    <rect x="580" y="240" width="200" height="60"/>
    <rect x="580" y="330" width="200" height="50"/>
  </g>

  <text x="42" y="102">composer: Post</text>
  <text x="42" y="120">POST /walls/:slug/posts</text>

  <text x="312" y="102">walls.createPost()</text>
  <text x="312" y="120">row written first</text>

  <text x="312" y="182">wallEvents.publish(</text>
  <text x="312" y="200">  slug, 'post', post)</text>

  <text x="312" y="262" font-weight="bold" fill="#8a6d0f">EventEmitter, keyed by</text>
  <text x="312" y="280" font-weight="bold" fill="#8a6d0f">wall slug, in memory</text>

  <text x="592" y="262">GET /walls/:slug/events</text>
  <text x="592" y="280">event: post</text>
  <text x="592" y="294">data: {...}</text>

  <text x="592" y="352">EventSource in feed.js</text>
  <text x="592" y="370">POSTS.unshift(); render</text>

  <g stroke="#1b2440" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="230" y1="105" x2="298" y2="105"/>
    <line x1="405" y1="130" x2="405" y2="158"/>
    <line x1="405" y1="210" x2="405" y2="238"/>
    <line x1="510" y1="270" x2="578" y2="270"/>
    <line x1="680" y1="300" x2="680" y2="328"/>
  </g>

  <text x="30" y="170" font-size="11">Stream setup, per open tab:</text>
  <text x="30" y="188" font-size="11">  retry: 3000</text>
  <text x="30" y="204" font-size="11">  ": connected" on open</text>
  <text x="30" y="220" font-size="11">  ": ping" every 25 s</text>
  <text x="30" y="236" font-size="11">  membership checked first</text>

  <text x="30" y="404" font-size="11">Tab hidden -&gt; connection closed.  4 errors in a row -&gt; give up; next time the tab is shown, reload posts.</text>
  <text x="30" y="422" font-size="11">Comments push a count bump. Reactions do not push (each viewer's "did I react" state differs).</text>
  <text x="30" y="440" font-size="11">No Redis, no second transport: it is the drawer's SSE wire format with a long-lived connection.</text>
</svg>
