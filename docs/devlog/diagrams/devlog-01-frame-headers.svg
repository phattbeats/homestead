<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="monospace" font-size="13" fill="#1b2440">
  <rect width="800" height="460" fill="#ffffff"/>
  <text x="20" y="28" font-size="15" font-weight="bold">FIG 1-8  WHY A TILE OPENS TO A WHITE SCREEN</text>
  <line x1="20" y1="38" x2="780" y2="38" stroke="#1b2440" stroke-width="1"/>
  <g stroke="#1b2440" stroke-width="2" fill="none">
    <rect x="30" y="60" width="230" height="120"/>
    <rect x="300" y="60" width="200" height="120"/>
    <rect x="540" y="60" width="230" height="120"/>
    <rect x="30" y="240" width="740" height="120" stroke="#c9a227" stroke-width="3"/>
  </g>
  <text x="45" y="85" font-weight="bold">[1] BROWSER</text>
  <text x="45" y="108">page origin:</text>
  <text x="45" y="126">homestead.example.com</text>
  <text x="45" y="150">&lt;iframe src=</text>
  <text x="45" y="168">  app.example.com&gt;</text>
  <text x="315" y="85" font-weight="bold">[2] PROXY</text>
  <text x="315" y="108">passes upstream</text>
  <text x="315" y="126">headers through</text>
  <text x="315" y="144">untouched by</text>
  <text x="315" y="162">default</text>
  <text x="555" y="85" font-weight="bold">[3] SELF-HOSTED APP</text>
  <text x="555" y="108">X-Frame-Options:</text>
  <text x="555" y="126">  SAMEORIGIN</text>
  <text x="555" y="150">CSP: frame-ancestors</text>
  <text x="555" y="168">  'self'</text>
  <g stroke="#1b2440" stroke-width="1.5" fill="#1b2440">
    <line x1="260" y1="100" x2="294" y2="100"/><polygon points="300,100 292,96 292,104"/>
    <line x1="500" y1="100" x2="534" y2="100"/><polygon points="540,100 532,96 532,104"/>
    <line x1="540" y1="150" x2="266" y2="150"/><polygon points="260,150 268,146 268,154"/>
  </g>
  <text x="300" y="210">result: browser refuses to render the frame</text>
  <text x="45" y="265" font-weight="bold" fill="#8a6d0f">FIX: strip and replace at the proxy, per app (nginx)</text>
  <text x="45" y="290">proxy_hide_header X-Frame-Options;</text>
  <text x="45" y="310">proxy_hide_header Content-Security-Policy;</text>
  <text x="45" y="330">add_header Content-Security-Policy "frame-ancestors 'self' https://homestead.example.com";</text>
  <text x="45" y="350" font-size="12">Embedding only. Direct visits to the app behave exactly as before.</text>
  <text x="30" y="395">RED HERRING: Cross-Origin-Resource-Policy: same-origin. Browsers only apply it</text>
  <text x="30" y="413">to a frame when the embedder sends Cross-Origin-Embedder-Policy: require-corp.</text>
  <text x="30" y="431">Homestead sends no COEP header.</text>
  <text x="20" y="452" font-size="11">NOTE: hostnames are placeholders. Fallback for stubborn apps: set the tile's open mode to New tab.</text>
</svg>
